# Wispral 000E ST-D00 egress attribution (research, not the baseline).
#
# The baseline (branch wispral/baseline-st-d00, unchanged) found Hugging Face lookups and HTTPS
# connections during `pytest` despite HF_HUB_OFFLINE=1, but could not say which test made them.
# This run repeats the baseline's Python job with an observation-only socket probe loaded into
# every Python process (.wispral-probe/sitecustomize.py), so each lookup is recorded with the test
# that was running, including from subprocesses that tests start. No donor file is changed.
# Triggered only by a push to this branch. The donor's own workflows are disabled in this fork.
name: "wispral-attrib-st-d00"
on:
  push:
    branches: [wispral/attrib-st-d00-egress]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      UV_HTTP_TIMEOUT: "120"
      UV_HTTP_RETRIES: "5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: System deps (ffmpeg, squashfs-tools, tcpdump)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg squashfs-tools tcpdump
      - name: Install Python deps (donor script)
        run: bash scripts/uv-sync-retry.sh --all-extras
      - name: Install Electron deps
        run: bun install --frozen-lockfile
      - name: Start egress capture (with DNS answers)
        run: |
          mkdir -p probe-out
          sudo nohup tcpdump -i any -nn -l -tttt '(udp port 53) or (tcp[tcpflags] & tcp-syn != 0 and tcp[tcpflags] & tcp-ack == 0)' > egress-python.txt 2>/dev/null &
          sleep 2
      - name: pytest tests/ (probe in every Python process)
        run: |
          set +e
          uv run --no-sync pytest tests/ -q --tb=short -n auto -p wispral_probe 2>&1 | tee pytest-tests.log
          echo "PYTEST_TESTS_EXIT=${PIPESTATUS[0]}" | tee -a pytest-tests.log
          exit 0
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONPATH: ${{ github.workspace }}/.wispral-probe
          WISPRAL_PROBE_DIR: ${{ github.workspace }}/probe-out
          WISPRAL_TEST_LIMIT_S: "1800"
      - name: pytest backend/tests/ (probe in every Python process)
        run: |
          set +e
          uv run --no-sync pytest backend/tests/ -q --tb=short -p wispral_probe 2>&1 | tee pytest-backend.log
          echo "PYTEST_BACKEND_EXIT=${PIPESTATUS[0]}" | tee -a pytest-backend.log
          exit 0
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONPATH: ${{ github.workspace }}/.wispral-probe
          WISPRAL_PROBE_DIR: ${{ github.workspace }}/probe-out
          WISPRAL_TEST_LIMIT_S: "1800"
      - name: Stop capture and attribute model-hub lookups
        if: always()
        run: |
          sleep 2; sudo pkill tcpdump || true; sleep 1
          python3 - <<'PY'
          import glob, json, re
          hub = re.compile(r"(huggingface\.co|hf\.co|hf-mirror\.com)$")
          out = []
          recs = []
          for f in glob.glob("probe-out/egress-*.jsonl"):
              for line in open(f, encoding="utf-8"):
                  recs.append(json.loads(line))
          hits = [r for r in recs if hub.search(str(r["host"]).rstrip("."))]
          out.append(f"PROBE_RECORDS={len(recs)} PROBE_MODEL_HUB={len(hits)}")
          for r in sorted(hits, key=lambda r: r["t"]):
              out.append(f"HUB {r['kind']} {r['host']}:{r['port']} test={r['test']} in_worker={r['in_worker']} argv={r['argv']}")
              out.append("    " + " <- ".join(r["stack"][-6:]))
          lines = open("egress-python.txt", errors="replace").read().splitlines()
          dns = [l for l in lines if re.search(r" (?:A|AAAA)\? [^ ]*(huggingface\.co|hf\.co|hf-mirror\.com)\. ", l)]
          out.append(f"TCPDUMP_MODEL_HUB_QUERIES={len(dns)}")
          out += ["  " + l for l in dns]
          open("attribution-summary.txt", "w").write("\n".join(out) + "\n")
          print("\n".join(out[:40]))
          PY
      - name: Summarize
        if: always()
        run: |
          {
            grep -h "_EXIT=" pytest-tests.log pytest-backend.log
            tail -n 3 pytest-tests.log | grep -E "passed|failed|error" || true
            tail -n 3 pytest-backend.log | grep -E "passed|failed|error" || true
            head -1 attribution-summary.txt
            grep "^TCPDUMP" attribution-summary.txt
          } | tee python-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: st-d00-attribution
          path: |
            pytest-tests.log
            pytest-backend.log
            egress-python.txt
            attribution-summary.txt
            python-summary.txt
            probe-out/
