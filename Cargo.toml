[workspace]
resolver = "2"
members = [
    "crates/wispral-contracts",
    "crates/wispral-journal",
    "crates/wispral-policy",
    "crates/wispral-arabic",
    "crates/wispral-audio",
    "crates/wispral-adaptive",
    "crates/wispral-context",
    "crates/wispral-memory",
    "crates/wispral-speech",
    "crates/wispral-live",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Wispral"
rust-version = "1.82"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
fs4 = "1.1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
unicode-normalization = "0.1"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
