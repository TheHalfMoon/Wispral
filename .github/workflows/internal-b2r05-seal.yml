name: Internal B2R05 Evidence Seal

on:
  push:
    branches:
      - research/000b2-b2r05-execution
    paths:
      - '.github/workflows/internal-b2r05-seal.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: b2r05-evidence-seal
  cancel-in-progress: false

jobs:
  seal-b2r05:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASK_BRANCH: research/000b2-b2r05-moonshine-compact
      EXPECTED_TASK_HEAD: a12bbf5ec178bdce9602a7fc052c26e0afb8f204
      ARTIFACT_ID: '9989016229'
      ARTIFACT_ZIP_SHA256: f48546a778f5a8e9202fb44edebf78e2fd3596bc8cded939350d1039e2463227
      EVIDENCE_SHA256: c14aaae1ca974e30fee73a7d672bb20910eb9e501601020c5a3f11332d4f00f8
      EVIDENCE_SIZE: '152226'
    steps:
      - name: Checkout exact seal revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve reviewed seal files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b2r05-seal"
          cp research/000b2-public/b2r05-provenance.json "$RUNNER_TEMP/b2r05-seal/"
          cp research/000b2-public/verify_b2r05.py "$RUNNER_TEMP/b2r05-seal/"
          cp research/000b2-public/verify_attempt_manifest.py "$RUNNER_TEMP/b2r05-seal/"

      - name: Download exact successful B2R05 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/b2r05-seal/artifact.zip"
          echo "$ARTIFACT_ZIP_SHA256  $RUNNER_TEMP/b2r05-seal/artifact.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/b2r05-seal/artifact"
          unzip -q "$RUNNER_TEMP/b2r05-seal/artifact.zip" -d "$RUNNER_TEMP/b2r05-seal/artifact"
          test -f "$RUNNER_TEMP/b2r05-seal/artifact/b2r05-moonshine-compact.json"
          test "$(wc -c < "$RUNNER_TEMP/b2r05-seal/artifact/b2r05-moonshine-compact.json")" = "$EVIDENCE_SIZE"
          echo "$EVIDENCE_SHA256  $RUNNER_TEMP/b2r05-seal/artifact/b2r05-moonshine-compact.json" | sha256sum -c -

      - name: Bind exact clean task branch
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/heads/$TASK_BRANCH:refs/remotes/origin/b2r05-task"
          test "$(git rev-parse refs/remotes/origin/b2r05-task)" = "$EXPECTED_TASK_HEAD"
          git checkout --detach refs/remotes/origin/b2r05-task
          test "$(git rev-parse HEAD)" = "$EXPECTED_TASK_HEAD"
          test "$(git hash-object research/000b2-public/decode_b2r05.py)" = "43125c1626d860aa1cb2704d7420a5f72dc7433b"

      - name: Materialize exact sealed task evidence
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/b2r05-seal/artifact/b2r05-moonshine-compact.json" research/000b2-public/b2r05-moonshine-compact.json
          cp "$RUNNER_TEMP/b2r05-seal/b2r05-provenance.json" research/000b2-public/b2r05-provenance.json
          cp "$RUNNER_TEMP/b2r05-seal/verify_b2r05.py" research/000b2-public/verify_b2r05.py
          cp "$RUNNER_TEMP/b2r05-seal/verify_attempt_manifest.py" research/000b2-public/verify_attempt_manifest.py
          python -m py_compile research/000b2-public/verify_b2r05.py research/000b2-public/verify_attempt_manifest.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r05.py
          git diff --check "$EXPECTED_TASK_HEAD" --

      - name: Commit only bounded task seal
        run: |
          set -euo pipefail
          git add \
            research/000b2-public/b2r05-moonshine-compact.json \
            research/000b2-public/b2r05-provenance.json \
            research/000b2-public/verify_b2r05.py \
            research/000b2-public/verify_attempt_manifest.py
          expected="$RUNNER_TEMP/b2r05-seal/expected.txt"
          actual="$RUNNER_TEMP/b2r05-seal/actual.txt"
          printf '%s\n' \
            research/000b2-public/b2r05-moonshine-compact.json \
            research/000b2-public/b2r05-provenance.json \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_b2r05.py | sort > "$expected"
          git diff --cached --name-only | sort > "$actual"
          diff -u "$expected" "$actual"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(000b2): seal B2R05 ATTEMPT-002 evidence'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TASK_HEAD"

      - name: Push fast-forward task seal
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
          echo "B2R05_SEALED_TASK_HEAD=$(git rev-parse HEAD)"
