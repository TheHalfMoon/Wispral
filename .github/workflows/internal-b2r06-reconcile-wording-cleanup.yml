name: Internal B2R06 Reconciliation Wording Cleanup

on:
  push:
    branches:
      - docs/000b2-b2r06-reconciliation
    paths:
      - '.github/workflows/internal-b2r06-reconcile-wording-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup-wording:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: 2460eae15260423b3a06d50d9119ae2459ff41c7
      BRANCH: docs/000b2-b2r06-reconciliation
    steps:
      - name: Checkout exact cleanup revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair stale historical current-authority wording
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE"
          python - <<'PY'
          from pathlib import Path
          path = Path('specs/CURRENT.md')
          text = path.read_text(encoding='utf-8')
          old = 'the latest B2R04 recovery markers below supersede them for new execution:'
          new = 'the latest B2R06 recovery markers below supersede them for new execution:'
          if text.count(old) != 1:
              raise SystemExit(f'stale historical marker count drift: {text.count(old)}')
          text = text.replace(old, new, 1)
          if not text.endswith('\n'):
              text += '\n'
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/internal-b2r06-reconcile-wording-cleanup.yml
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r06.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_manifest.py
          git diff --check "$BASE"
          test "$(git diff --name-only "$BASE" | sort)" = "$(printf '%s\n' \
            docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-readiness.json \
            specs/000B2-public-corpus-bakeoff/tasks.md \
            specs/CURRENT.md | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            .github/workflows/internal-b2r06-reconcile-wording-cleanup.yml \
            specs/CURRENT.md | sort)"
          git commit -m 'docs(000b2): correct B2R06 latest-authority wording'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo 'B2R06_RECONCILIATION_WORDING_CLEANUP=PASS'
