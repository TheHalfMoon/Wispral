name: Internal B2E02 Duplicate Capture Reconciliation

on:
  push:
    branches:
      - research/000b2-b2e02-moonshine-balanced
    paths:
      - '.github/workflows/internal-b2e02-duplicate-reconcile.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: b2e02-duplicate-reconciliation
  cancel-in-progress: false

jobs:
  reconcile-b2e02-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANONICAL_SOURCE_REVISION: 43cab310662b6e8eb1ea25b6d8e39a6dbf14a17e
      CANONICAL_RUN_ID: '33962004933'
      CANONICAL_JOB_ID: '101295384896'
      CANONICAL_ARTIFACT_ID: '9968333519'
      CANONICAL_ARTIFACT_NAME: b2e02-moonshine-balanced-43cab310662b6e8eb1ea25b6d8e39a6dbf14a17e
      CANONICAL_ARTIFACT_ZIP_SHA256: 0cb9ae81262a6af0a5eb2382ac1fccdae6488c8a04d8551a912bdf8ff9d818ad
      CANONICAL_RAW_SHA256: 8bc1b3e2e10bd7c64465b424f8dff5ffc84a153868459457d91e22e5cf3da253
      CANONICAL_PAYLOAD_SHA256: ad2baccb196313323b0284d5672f94d9ffae551f0b2af38cc29b4be082e6a6aa
      CANONICAL_SEMANTIC_RECORDS_SHA256: 5d3a4f43768e7a862267f76df36a5e3dc9c8ec523b7156494c3b739096bc0bb1
      DUPLICATE_SOURCE_REVISION: 76611d5436f1ca6313d5c0832a02e3e7583b0337
      DUPLICATE_RUN_ID: '33963021322'
      DUPLICATE_JOB_ID: '101298112856'
      DUPLICATE_ARTIFACT_ID: '9968588759'
      DUPLICATE_ARTIFACT_NAME: b2e02-moonshine-balanced-76611d5436f1ca6313d5c0832a02e3e7583b0337
      DUPLICATE_ARTIFACT_ZIP_SHA256: daa2236bd1bee96a4c241671eefe622d9353c3f5481691aa453640f3f6888c9a
      DUPLICATE_RAW_SHA256: f21cf41533787b3045cf9209b150949ad646d50f702c89640d57c95c47085bc1
      DUPLICATE_PAYLOAD_SHA256: 601bccfe660db1e3f2b7b1348841c0cfb6152f085c86b9aa2f853e1dce3d0d51
      DUPLICATE_SEMANTIC_RECORDS_SHA256: 76665968a9b315a69534342570080d693cd44ac82cd888a78aaa743ccb947386
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact duplicate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b2e02-duplicate"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DUPLICATE_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/b2e02-duplicate/artifact.zip"
          echo "$DUPLICATE_ARTIFACT_ZIP_SHA256  $RUNNER_TEMP/b2e02-duplicate/artifact.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/b2e02-duplicate/artifact.zip" -d "$RUNNER_TEMP/b2e02-duplicate/unpacked"
          test "$(find "$RUNNER_TEMP/b2e02-duplicate/unpacked" -maxdepth 1 -type f | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/b2e02-duplicate/unpacked/b2e02-moonshine-balanced.json"
          echo "$DUPLICATE_RAW_SHA256  $RUNNER_TEMP/b2e02-duplicate/unpacked/b2e02-moonshine-balanced.json" | sha256sum --check --strict
          echo "$CANONICAL_RAW_SHA256  research/000b2-public/b2e02-moonshine-balanced.json" | sha256sum --check --strict

      - name: Compare canonical and duplicate execution semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          canonical_path = Path('research/000b2-public/b2e02-moonshine-balanced.json')
          duplicate_path = Path(os.environ['RUNNER_TEMP']) / 'b2e02-duplicate/unpacked/b2e02-moonshine-balanced.json'
          canonical = json.loads(canonical_path.read_text(encoding='utf-8'))
          duplicate = json.loads(duplicate_path.read_text(encoding='utf-8'))

          def canonical_bytes(value):
              return (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode('utf-8')

          def validate_payload(value, expected):
              recorded = value.get('evidence_payload_sha256')
              assert recorded == expected
              unsigned = dict(value)
              unsigned.pop('evidence_payload_sha256', None)
              assert hashlib.sha256(canonical_bytes(unsigned)).hexdigest() == expected

          validate_payload(canonical, os.environ['CANONICAL_PAYLOAD_SHA256'])
          validate_payload(duplicate, os.environ['DUPLICATE_PAYLOAD_SHA256'])
          assert canonical['execution']['input_count'] == duplicate['execution']['input_count'] == 240
          assert canonical['execution']['decoded_count'] == duplicate['execution']['decoded_count'] == 240
          assert canonical['execution']['failure_count'] == duplicate['execution']['failure_count'] == 0
          assert canonical['authority'] == duplicate['authority']
          assert canonical['candidate'] == duplicate['candidate']
          assert canonical['c0_controls'] == duplicate['c0_controls']
          assert canonical['claim_guards'] == duplicate['claim_guards']

          canonical_rows = canonical['execution']['records']
          duplicate_rows = duplicate['execution']['records']
          assert len(canonical_rows) == len(duplicate_rows) == 240
          canonical_by_id = {row['utterance_id']: row for row in canonical_rows}
          duplicate_by_id = {row['utterance_id']: row for row in duplicate_rows}
          assert set(canonical_by_id) == set(duplicate_by_id)

          transcript_differences = []
          semantic_keys = (
              'utterance_id', 'source_partition', 'canonical_preprocessed_file_sha256',
              'status', 'raw_lines', 'raw_transcript', 'failure',
          )
          canonical_semantic = []
          duplicate_semantic = []
          for uid in sorted(canonical_by_id):
              a = canonical_by_id[uid]
              b = duplicate_by_id[uid]
              assert a['source_partition'] == b['source_partition']
              assert a['canonical_preprocessed_file_sha256'] == b['canonical_preprocessed_file_sha256']
              assert a['status'] == b['status']
              if (a['raw_lines'], a['raw_transcript'], a['failure']) != (b['raw_lines'], b['raw_transcript'], b['failure']):
                  transcript_differences.append(uid)
              canonical_semantic.append({key: a[key] for key in semantic_keys})
              duplicate_semantic.append({key: b[key] for key in semantic_keys})

          assert len(transcript_differences) == 10
          canonical_semantic_sha = hashlib.sha256(canonical_bytes(canonical_semantic)).hexdigest()
          duplicate_semantic_sha = hashlib.sha256(canonical_bytes(duplicate_semantic)).hexdigest()
          assert canonical_semantic_sha == os.environ['CANONICAL_SEMANTIC_RECORDS_SHA256']
          assert duplicate_semantic_sha == os.environ['DUPLICATE_SEMANTIC_RECORDS_SHA256']
          print('B2E02_DUPLICATE_INPUT_IDENTITY=PASS')
          print('B2E02_DUPLICATE_STATUS_IDENTITY=PASS')
          print('B2E02_DUPLICATE_RAW_TRANSCRIPT_IDENTITY=DIFF')
          print('B2E02_DUPLICATE_RAW_TRANSCRIPT_DIFFERENCE_COUNT=10')
          PY

      - name: Preserve duplicate evidence and provenance reconciliation
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/b2e02-duplicate/unpacked/b2e02-moonshine-balanced.json" \
            research/000b2-public/b2e02-moonshine-balanced-duplicate-run-33963021322.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "schema_version": "000b2-public-b2e02-provenance-v2",
              "task": "B2E02",
              "attempt_id": "000B2-PUBLIC-ATTEMPT-001",
              "candidate_id": "moonshine-balanced",
              "canonical_evidence_source": {
                  "role": "CANONICAL_EVIDENCE_SOURCE",
                  "selection_basis": "CANONICAL_EVIDENCE_WAS_SEALED_BEFORE_DUPLICATE_RUN_STARTED; NOT_RESULT_DRIVEN",
                  "workflow_name": "Internal B2E02 Public C0 Capture",
                  "event": "push",
                  "conclusion": "success",
                  "run_id": int(os.environ['CANONICAL_RUN_ID']),
                  "run_attempt": 1,
                  "job_id": int(os.environ['CANONICAL_JOB_ID']),
                  "source_revision": os.environ['CANONICAL_SOURCE_REVISION'],
                  "artifact_id": int(os.environ['CANONICAL_ARTIFACT_ID']),
                  "artifact_name": os.environ['CANONICAL_ARTIFACT_NAME'],
                  "artifact_zip_sha256": os.environ['CANONICAL_ARTIFACT_ZIP_SHA256'],
                  "evidence_path": "research/000b2-public/b2e02-moonshine-balanced.json",
                  "evidence_raw_file_sha256": os.environ['CANONICAL_RAW_SHA256'],
                  "evidence_payload_sha256": os.environ['CANONICAL_PAYLOAD_SHA256'],
                  "semantic_records_sha256": os.environ['CANONICAL_SEMANTIC_RECORDS_SHA256'],
              },
              "related_capture_runs": [
                  {
                      "role": "FAILED_WORKFLOW_AFTER_SUCCESSFUL_DECODE_NONCANONICAL",
                      "reconciliation_status": "PRESERVED_AND_COMPARED_TO_CANONICAL_EVIDENCE",
                      "workflow_name": "Internal B2E02 Public C0 Capture",
                      "event": "push",
                      "conclusion": "failure",
                      "run_id": int(os.environ['DUPLICATE_RUN_ID']),
                      "run_attempt": 1,
                      "job_id": int(os.environ['DUPLICATE_JOB_ID']),
                      "source_revision": os.environ['DUPLICATE_SOURCE_REVISION'],
                      "artifact_id": int(os.environ['DUPLICATE_ARTIFACT_ID']),
                      "artifact_name": os.environ['DUPLICATE_ARTIFACT_NAME'],
                      "artifact_zip_sha256": os.environ['DUPLICATE_ARTIFACT_ZIP_SHA256'],
                      "evidence_path": "research/000b2-public/b2e02-moonshine-balanced-duplicate-run-33963021322.json",
                      "evidence_raw_file_sha256": os.environ['DUPLICATE_RAW_SHA256'],
                      "evidence_payload_sha256": os.environ['DUPLICATE_PAYLOAD_SHA256'],
                      "semantic_records_sha256": os.environ['DUPLICATE_SEMANTIC_RECORDS_SHA256'],
                      "decoder_capture_status": "CAPTURED_240_DECODED_0_FAILED",
                      "post_decode_verifier_failure": "recorded payload digest drift",
                      "input_identity_equivalence": "PASS",
                      "status_identity_equivalence": "PASS",
                      "raw_transcript_identity_equivalence": "DIFF",
                      "raw_transcript_difference_count": 10,
                      "selection_effect": "NONE",
                  }
              ],
              "duplicate_reconciliation": {
                  "cause": "POST_SEAL_VERIFY_B2E02_CHANGE_MATCHED_CAPTURE_WORKFLOW_PATH_FILTER_BEFORE_CAPTURE_BOOTSTRAP_REMOVAL",
                  "decode_capture_count_for_cell_2": 2,
                  "canonical_evidence_source_count": 1,
                  "input_identity_equivalence": "PASS",
                  "status_identity_equivalence": "PASS",
                  "raw_transcript_identity_equivalence": "DIFF",
                  "raw_transcript_difference_count": 10,
                  "result_driven_evidence_selection": False,
                  "timing_values_are_diagnostic_only": True,
                  "b2e03_authorized": False,
              },
              "claims": {
                  "timing_semantics": "DIAGNOSTIC_ONLY",
                  "comparative_performance_authorized": False,
                  "b2e03_authorized": False,
                  "human_developer_speech_accuracy_evidence": "ABSENT",
                  "production_stt_selected": False,
                  "product_code_authorized": False,
              },
              "provenance_status": "RECORDED_FROM_EXACT_GITHUB_ACTIONS_RUN_ARTIFACT_AND_DUPLICATE_RECONCILIATION_METADATA",
          }
          Path('research/000b2-public/b2e02-provenance.json').write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          echo "$DUPLICATE_RAW_SHA256  research/000b2-public/b2e02-moonshine-balanced-duplicate-run-33963021322.json" | sha256sum --check --strict

      - name: Commit reconciliation forward-only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/000b2-public/b2e02-moonshine-balanced-duplicate-run-33963021322.json \
            research/000b2-public/b2e02-provenance.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'expected duplicate reconciliation changes are absent' >&2; exit 1; }
          git commit -m 'fix(000b2): reconcile duplicate B2E02 capture evidence'
          git push origin HEAD:research/000b2-b2e02-moonshine-balanced
