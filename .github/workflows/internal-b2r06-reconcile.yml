name: Internal B2R06 Recovery Reconciliation

on:
  push:
    branches:
      - docs/000b2-b2r06-reconciliation
    paths:
      - '.github/workflows/internal-b2r06-reconcile.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: internal-b2r06-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-b2r06:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXACT_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reconciliation builder revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          fetch-depth: 0
          persist-credentials: true

      - name: Build and push exact four-file B2R06 reconciliation candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          python research/000b2-public/internal_b2r06_reconcile.py

