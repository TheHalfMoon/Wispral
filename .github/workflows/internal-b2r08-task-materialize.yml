          )
          test "${#committed[@]}" -eq "${#expected_commit[@]}"
          for i in "${!expected_commit[@]}"; do test "${committed[$i]}" = "${expected_commit[$i]}"; done
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)" = "$FINAL_HEAD"
          echo "B2R08_TASK_FINAL_HEAD=$FINAL_HEAD"
          echo 'B2R08_TASK_MATERIALIZATION=PASS'
          echo 'B2R09_AUTHORIZED=NO'

      - name: Remove transient seal material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/b2r08-materialize" "$RUNNER_TEMP/verify_b2r08.py.in"
