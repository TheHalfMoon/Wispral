name: Internal B2R08 Task Evidence Materialization

on:
  push:
    branches:
      - ci/000b2-b2r08-task-materialize
    paths:
      - '.github/workflows/internal-b2r08-task-materialize.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: b2r08-task-materialize-${{ github.ref }}
  cancel-in-progress: false

env:
  CANONICAL_BASE: 4fc35e9d14f949b90dbee58ddf243a36859e02bd
  TASK_BRANCH: research/000b2-b2r08-whispercpp-balanced
  TASK_HEAD_BEFORE_MATERIALIZATION: 5280901f59d5cd530475bf1204d3416a69c9a6db
  SEAL_RUN_ID: '34150046063'
  SEAL_WORKFLOW_ID: '352504105'
  SEAL_JOB_ID: '101830233512'
  SEAL_SOURCE_SHA: 70d9e71961510f2124c02ee4a05fb13b82399d03
  SEAL_ARTIFACT_ID: '10029053259'
  SEAL_ARTIFACT_NAME: b2r08-sharded-seal-70d9e71961510f2124c02ee4a05fb13b82399d03
  SEAL_ARTIFACT_ZIP_SHA256: 6345de28752f714c1a49ce81cbf4b89e86e8f4520ce2b0f0c573843f90c4090a
  SEAL_ARTIFACT_ZIP_SIZE: '118286'
  EVIDENCE_RAW_SHA256: 5b438a0d23c8ec19796df9b384234437a266ef862bd6ddd604772ed965932b41
  EVIDENCE_PAYLOAD_SHA256: b688080a9b54106975fc3d423d210f6b449c47468cdc94135997285d9504314c
  EVIDENCE_SIZE: '397706'
  QUALIFICATION_RUN_ID: '34137057908'
  QUALIFICATION_WORKFLOW_ID: '352397816'
  QUALIFICATION_JOB_ID: '101790371251'
  QUALIFICATION_SOURCE_SHA: 900482d4cce3c69c8ad0a36261e2a8d53f106142
  QUALIFICATION_ARTIFACT_ID: '10024691621'
  QUALIFICATION_ARTIFACT_NAME: b2r08-shard-equivalence-900482d4cce3c69c8ad0a36261e2a8d53f106142
  QUALIFICATION_ARTIFACT_ZIP_SHA256: 124ca565bb22604d39101541b4949c22c55dbc764c576dde766ada8b433a56e4
  QUALIFICATION_RAW_SHA256: 122e217b7efcfadea44540fcd20a181ad881351a89b6303e0a283fdc569d96a1
  QUALIFICATION_PAYLOAD_SHA256: 6d419e5a975c245132b2edca9f40c35bb0abd22c708896ba51b481e815409afd
  QUALIFICATION_SIZE: '5146'
  PRIMARY_RUN_ID: '34139091127'
  PRIMARY_WORKFLOW_ID: '352414950'
  PRIMARY_SOURCE_SHA: 4a6c776b2a666113420263b70a4fad06f752b99a
  FAILED_PRIMARY_RUN_ID: '34067447713'
  FAILED_PRIMARY_WORKFLOW_ID: '351865230'
  FAILED_PRIMARY_JOB_ID: '101578604948'
  FAILED_PRIMARY_SOURCE_SHA: 7c81a469b10af3d83f42a047b933d3b0c14a3891
  FAILED_PRIMARY_ARTIFACT_ID: '10005732797'
  FAILED_PRIMARY_ARTIFACT_ZIP_SHA256: 1a72b3553e7e7fd20c4c058a3d4d3d45fb88bff3d96a8563916c65a1da708a37
  FAILED_PRIMARY_ARTIFACT_ZIP_SIZE: '753'

jobs:
  materialize-b2r08:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact materialization source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reverify live authority and clean task head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main "$TASK_BRANCH"
          test "$(git rev-parse origin/main)" = "$CANONICAL_BASE"
          test "$(git rev-parse "origin/$TASK_BRANCH")" = "$TASK_HEAD_BEFORE_MATERIALIZATION"
          mapfile -t paths < <(git diff --name-only "$CANONICAL_BASE...$TASK_HEAD_BEFORE_MATERIALIZATION" | sort)
          expected=(
            research/000b2-public/b2r08-repair-plan.json
            research/000b2-public/decode_b2r08.py
            research/000b2-public/run_b2r08_sharded_repair.py
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${paths[$i]}" = "${expected[$i]}"; done
          git diff --quiet "$CANONICAL_BASE" "$TASK_HEAD_BEFORE_MATERIALIZATION" -- \
            docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-readiness.json \
            specs/000B2-public-corpus-bakeoff/tasks.md \
            specs/CURRENT.md
          echo 'B2R08_MATERIALIZATION_AUTHORITY=PASS'
          echo 'B2R09_AUTHORIZED=NO'

      - name: Reverify exact seal run and artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r08-materialize"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SEAL_RUN_ID" \
            -o "$ROOT/seal-run.json"
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SEAL_ARTIFACT_ID" \
            -o "$ROOT/seal-artifact.json"
          export ROOT
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          run = json.loads((root / 'seal-run.json').read_text())
          assert run['id'] == int(os.environ['SEAL_RUN_ID'])
          assert run['workflow_id'] == int(os.environ['SEAL_WORKFLOW_ID'])
          assert run['head_sha'] == os.environ['SEAL_SOURCE_SHA']
          assert run['event'] == 'push'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          artifact = json.loads((root / 'seal-artifact.json').read_text())
          assert artifact['id'] == int(os.environ['SEAL_ARTIFACT_ID'])
          assert artifact['name'] == os.environ['SEAL_ARTIFACT_NAME']
          assert artifact['expired'] is False
          assert artifact['size_in_bytes'] == int(os.environ['SEAL_ARTIFACT_ZIP_SIZE'])
          assert artifact['digest'] == 'sha256:' + os.environ['SEAL_ARTIFACT_ZIP_SHA256']
          assert artifact['workflow_run']['id'] == int(os.environ['SEAL_RUN_ID'])
          assert artifact['workflow_run']['head_sha'] == os.environ['SEAL_SOURCE_SHA']
          print('B2R08_SEAL_REBOUND=PASS')
          PY

      - name: Download and independently verify exact seal bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r08-materialize"
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SEAL_ARTIFACT_ID/zip" \
            -o "$ROOT/seal.zip"
          test "$(stat -c %s "$ROOT/seal.zip")" = "$SEAL_ARTIFACT_ZIP_SIZE"
          printf '%s  %s\n' "$SEAL_ARTIFACT_ZIP_SHA256" "$ROOT/seal.zip" | sha256sum --check -
          mkdir -p "$ROOT/seal"
          unzip -q "$ROOT/seal.zip" -d "$ROOT/seal"
          export ROOT
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['ROOT']) / 'seal'
          expected = sorted([
              'artifact-map.json',
              'b2r08-whispercpp-balanced.json',
              'b2r08-sharded-seal-manifest.json',
              'qualification/b2r08-shard-equivalence.json',
              'shard-0/b2r08-primary-shard-0.json',
              'shard-1/b2r08-primary-shard-1.json',
              'shard-2/b2r08-primary-shard-2.json',
              'shard-3/b2r08-primary-shard-3.json',
          ])
          files = sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file())
          assert files == expected, files
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def canonical(v):
              return (json.dumps(v, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode()
          evidence_path = root / 'b2r08-whispercpp-balanced.json'
          assert evidence_path.stat().st_size == int(os.environ['EVIDENCE_SIZE'])
          assert sha(evidence_path) == os.environ['EVIDENCE_RAW_SHA256']
          evidence = json.loads(evidence_path.read_text())
          unsigned = dict(evidence)
          payload = unsigned.pop('evidence_payload_sha256')
          assert payload == os.environ['EVIDENCE_PAYLOAD_SHA256']
          assert hashlib.sha256(canonical(unsigned)).hexdigest() == payload
          assert evidence['task'] == 'B2R08'
          assert evidence['attempt_id'] == '000B2-PUBLIC-ATTEMPT-002'
          assert evidence['candidate']['cell_index'] == 4
          assert evidence['candidate']['candidate_id'] == 'whispercpp-balanced'
          assert evidence['candidate']['runtime_revision'] == '371b5a7561823ab2bb32142d2751e35e7534727b'
          assert evidence['candidate']['model'] == 'ggml-small.en.bin'
          x = evidence['execution']
          assert (x['input_count'], x['decoded_count'], x['failure_count']) == (240, 240, 0)
          assert x['reference_transcripts_loaded_by_decoder'] is False
          assert x['accuracy_scoring_performed'] is False
          assert x['comparative_ranking_present'] is False
          assert x['performance_claim_present'] is False
          assert evidence['claim_guards']['b2r09_authorized'] is False
          records = x['records']
          ids = [r['utterance_id'] for r in records]
          assert len(records) == 240 and len(set(ids)) == 240 and ids == sorted(ids)
          all_shard_records = []
          shard_raw = [
              'd11a6f85f0d2bb6781f64ca62091ccaab16125455cd7d6e96ee8eed3ae15c672',
              'b8ae0143baebf1baaa3b0bc32fc3930bbfccdae96b276a09389458b341a2863b',
              '4017337c0a6af1dff0b89c9d30399ef65e752a2341ed974307f45ff1c8c6c8f3',
              '8b13f9c011ff5dd72aad1b3ce61c83ecfba2a06acd87a4461ea2b27461fa78bf',
          ]
          for i in range(4):
              p = root / f'shard-{i}/b2r08-primary-shard-{i}.json'
              assert sha(p) == shard_raw[i]
              s = json.loads(p.read_text())
              su = dict(s); sp = su.pop('evidence_payload_sha256')
              assert hashlib.sha256(canonical(su)).hexdigest() == sp
              assert s['shard_index'] == i and len(s['utterance_ids']) == 60
              assert s['run']['github_run_id'] == int(os.environ['PRIMARY_RUN_ID'])
              assert s['run']['repository_revision'] == os.environ['PRIMARY_SOURCE_SHA']
              assert s['execution']['decoded_count'] == 60 and s['execution']['failure_count'] == 0
              assert s['execution']['reference_transcripts_loaded_by_decoder'] is False
              assert s['execution']['accuracy_scoring_performed'] is False
              all_shard_records.extend(s['execution']['records'])
          assert all_shard_records == records
          qpath = root / 'qualification/b2r08-shard-equivalence.json'
          assert qpath.stat().st_size == int(os.environ['QUALIFICATION_SIZE'])
          assert sha(qpath) == os.environ['QUALIFICATION_RAW_SHA256']
          q = json.loads(qpath.read_text())
          qu = dict(q); qp = qu.pop('evidence_payload_sha256')
          assert qp == os.environ['QUALIFICATION_PAYLOAD_SHA256']
          assert hashlib.sha256(canonical(qu)).hexdigest() == qp
          assert q['primary_corpus_accessed'] is False and q['candidate_result_accessed'] is False
          assert q['qualification']['fixture_count'] == 8
          assert q['qualification']['mismatch_count'] == 0
          assert q['qualification']['semantic_rows_byte_identical'] is True
          assert q['qualification']['full_semantic_sha256'] == q['qualification']['sharded_semantic_sha256']
          manifest_path = root / 'b2r08-sharded-seal-manifest.json'
          assert sha(manifest_path) == '77eed53d72b16497df2a8b4191a9166449b74e05143cef0ae093c51c62f2e877'
          manifest = json.loads(manifest_path.read_text())
          mu = dict(manifest); mp = mu.pop('manifest_payload_sha256')
          assert hashlib.sha256(canonical(mu)).hexdigest() == mp
          assert manifest['merged_evidence']['raw_sha256'] == os.environ['EVIDENCE_RAW_SHA256']
          assert manifest['merged_evidence']['payload_sha256'] == os.environ['EVIDENCE_PAYLOAD_SHA256']
          assert manifest['claim_guards']['b2r09_authorized'] is False
          print('B2R08_SEAL_BYTES=PASS')
          print('B2R09_AUTHORIZED=NO')
          PY

      - name: Materialize exact evidence, provenance, and verifier on clean task branch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r08-materialize"
          git switch --detach "$TASK_HEAD_BEFORE_MATERIALIZATION"
          git switch -C "$TASK_BRANCH" "$TASK_HEAD_BEFORE_MATERIALIZATION"
          test "$(git rev-parse HEAD)" = "$TASK_HEAD_BEFORE_MATERIALIZATION"
          mkdir -p research/000b2-public
          cp "$ROOT/seal/b2r08-whispercpp-balanced.json" research/000b2-public/b2r08-whispercpp-balanced.json
          cp "$ROOT/seal/qualification/b2r08-shard-equivalence.json" research/000b2-public/b2r08-shard-equivalence.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('research/000b2-public')
          artifact_map = json.loads((Path(os.environ['RUNNER_TEMP']) / 'b2r08-materialize/seal/artifact-map.json').read_text())
          provenance = {
              'schema_version': '000b2-public-b2r08-provenance-v1',
              'task': 'B2R08',
              'attempt_id': '000B2-PUBLIC-ATTEMPT-002',
              'candidate_id': 'whispercpp-balanced',
              'canonical_evidence_source': {
                  'role': 'CANONICAL_EVIDENCE_SOURCE',
                  'workflow_id': int(os.environ['SEAL_WORKFLOW_ID']),
                  'run_id': int(os.environ['SEAL_RUN_ID']),
                  'job_id': int(os.environ['SEAL_JOB_ID']),
                  'source_branch': 'research/000b2-b2r08-sharded-seal-v1',
                  'source_revision': os.environ['SEAL_SOURCE_SHA'],
                  'conclusion': 'success',
                  'event': 'push',
                  'artifact_id': int(os.environ['SEAL_ARTIFACT_ID']),
                  'artifact_name': os.environ['SEAL_ARTIFACT_NAME'],
                  'artifact_zip_size_bytes': int(os.environ['SEAL_ARTIFACT_ZIP_SIZE']),
                  'artifact_zip_sha256': os.environ['SEAL_ARTIFACT_ZIP_SHA256'],
                  'evidence_path': 'research/000b2-public/b2r08-whispercpp-balanced.json',
                  'evidence_raw_file_size_bytes': int(os.environ['EVIDENCE_SIZE']),
                  'evidence_raw_file_sha256': os.environ['EVIDENCE_RAW_SHA256'],
                  'evidence_payload_sha256': os.environ['EVIDENCE_PAYLOAD_SHA256'],
                  'selection_basis': 'FIRST_SUCCESSFUL_PREDECLARED_FOUR_SHARD_PRIMARY_AFTER_THE_ORIGINAL_FULL_LIST_PRIMARY_HIT_THE_GITHUB_HOSTED_RUNNER_EXECUTION_CEILING_WITHOUT_TRANSCRIPT_OR_EVIDENCE_JSON; SHARD_EQUIVALENCE_WAS_QUALIFIED_ON_SYNTHETIC_NON_PRIMARY_FIXTURES_BEFORE_REPAIRED_PRIMARY_RESULTS; NOT_RESULT_DRIVEN',
              },
              'original_failed_primary': {
                  'role': 'FAILED_PRIMARY_NONCANONICAL',
                  'workflow_id': int(os.environ['FAILED_PRIMARY_WORKFLOW_ID']),
                  'run_id': int(os.environ['FAILED_PRIMARY_RUN_ID']),
                  'job_id': int(os.environ['FAILED_PRIMARY_JOB_ID']),
                  'source_branch': 'research/000b2-b2r08-execution',
                  'source_revision': os.environ['FAILED_PRIMARY_SOURCE_SHA'],
                  'conclusion': 'cancelled',
                  'failure_stage': 'GITHUB_HOSTED_RUNNER_EXECUTION_CEILING',
                  'primary_decode_started': True,
                  'artifact_id': int(os.environ['FAILED_PRIMARY_ARTIFACT_ID']),
                  'artifact_name': 'b2r08-whispercpp-balanced-' + os.environ['FAILED_PRIMARY_SOURCE_SHA'],
                  'artifact_zip_size_bytes': int(os.environ['FAILED_PRIMARY_ARTIFACT_ZIP_SIZE']),
                  'artifact_zip_sha256': os.environ['FAILED_PRIMARY_ARTIFACT_ZIP_SHA256'],
                  'artifact_contents': ['whisper-build/wispral-build-identity.json'],
                  'transcript_artifact_present': False,
                  'evidence_json_present': False,
                  'candidate_result_inspection_before_repair': False,
                  'selection_effect': 'NONE',
              },
              'forward_only_repair': {
                  'policy': 'FORWARD_ONLY_DETERMINISTIC_CONTIGUOUS_SHARDING_AFTER_HOSTED_RUNNER_CEILING',
                  'shard_count': 4,
                  'shard_sizes': [60, 60, 60, 60],
                  'partitioning': 'CONTIGUOUS_PARTITIONS_OF_SORTED_FROZEN_UTTERANCE_IDS',
                  'final_record_order': 'ORIGINAL_SORTED_FROZEN_UTTERANCE_ID_ORDER',
                  'per_shard_adapter_processes': 1,
                  'per_shard_adapter_timeout_seconds': 18000,
                  'candidate_changed': False,
                  'model_changed': False,
                  'runtime_revision_changed': False,
                  'frozen_audio_membership_changed': False,
                  'frozen_audio_bytes_changed': False,
                  'frozen_input_order_changed_in_final_evidence': False,
                  'c0_controls_changed': False,
                  'scorer_changed': False,
                  'normalization_changed': False,
                  'reference_transcript_access_during_decode': False,
                  'accuracy_scoring_during_decode': False,
              },
              'equivalence_qualification': {
                  'role': 'NON_PRIMARY_REPAIR_QUALIFICATION',
                  'workflow_id': int(os.environ['QUALIFICATION_WORKFLOW_ID']),
                  'run_id': int(os.environ['QUALIFICATION_RUN_ID']),
                  'job_id': int(os.environ['QUALIFICATION_JOB_ID']),
                  'source_branch': 'research/000b2-b2r08-repair-qualification-v2',
                  'source_revision': os.environ['QUALIFICATION_SOURCE_SHA'],
                  'artifact_id': int(os.environ['QUALIFICATION_ARTIFACT_ID']),
                  'artifact_name': os.environ['QUALIFICATION_ARTIFACT_NAME'],
                  'artifact_zip_sha256': os.environ['QUALIFICATION_ARTIFACT_ZIP_SHA256'],
                  'evidence_path': 'research/000b2-public/b2r08-shard-equivalence.json',
                  'evidence_raw_file_size_bytes': int(os.environ['QUALIFICATION_SIZE']),
                  'evidence_raw_file_sha256': os.environ['QUALIFICATION_RAW_SHA256'],
                  'evidence_payload_sha256': os.environ['QUALIFICATION_PAYLOAD_SHA256'],
                  'fixture_count': 8,
                  'primary_corpus_accessed': False,
                  'candidate_result_accessed': False,
                  'mismatch_count': 0,
                  'semantic_rows_byte_identical': True,
              },
              'sharded_primary': {
                  'workflow_id': int(os.environ['PRIMARY_WORKFLOW_ID']),
                  'run_id': int(os.environ['PRIMARY_RUN_ID']),
                  'source_branch': 'research/000b2-b2r08-sharded-primary-v1',
                  'source_revision': os.environ['PRIMARY_SOURCE_SHA'],
                  'conclusion': 'success',
                  'preflight_job_id': 101796754393,
                  'shards': [
                      {**row, 'job_id': [101796800482, 101796800522, 101796800502, 101796800450][row['shard_index']]}
                      for row in artifact_map
                  ],
                  'input_count': 240,
                  'decoded_count': 240,
                  'failure_count': 0,
              },
              'seal': {
                  'prepared_staging_commit': '5d549bb46c7e232f06d975a91aae2a22b2ec7ee1',
                  'execution_source': os.environ['SEAL_SOURCE_SHA'],
                  'workflow_content_blob_sha': 'c89986f9f9bb1d1b5b5386985469a67819931a4c',
                  'workflow_content_unchanged_by_trigger_commit': True,
                  'trigger_commit_change': 'FILE_MODE_ONLY_100644_TO_100755',
                  'run_id': int(os.environ['SEAL_RUN_ID']),
                  'job_id': int(os.environ['SEAL_JOB_ID']),
                  'artifact_id': int(os.environ['SEAL_ARTIFACT_ID']),
                  'artifact_zip_sha256': os.environ['SEAL_ARTIFACT_ZIP_SHA256'],
                  'manifest_raw_sha256': '77eed53d72b16497df2a8b4191a9166449b74e05143cef0ae093c51c62f2e877',
                  'manifest_payload_sha256': '95ac81b41481f27f8cc8bcff35929d72591697ea7dcd28531542d41dbd59edd4',
              },
              'task_materialization': {
                  'role': 'BYTE_PRESERVING_POST_SEAL_TASK_MATERIALIZATION',
                  'workflow_name': os.environ['GITHUB_WORKFLOW'],
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'job_name': os.environ['GITHUB_JOB'],
                  'source_branch': os.environ['GITHUB_REF_NAME'],
                  'source_revision': os.environ['GITHUB_SHA'],
                  'result_access_effect': 'NONE',
              },
              'result_accounting': {
                  'input_count': 240,
                  'decoded_count': 240,
                  'failure_count': 0,
                  'all_frozen_input_hashes_reverified': True,
                  'all_speech_samples_delivered_for_decoded_records': True,
                  'all_zero_suffix_samples_delivered_for_decoded_records': True,
                  'reference_transcripts_loaded_by_decoder': False,
                  'accuracy_scoring_performed': False,
                  'comparative_ranking_present': False,
                  'performance_claim_present': False,
                  'result_driven_evidence_selection': False,
                  'timing_semantics': 'DIAGNOSTIC_ONLY',
              },
              'claims': {
                  'b2r09_authorized': False,
                  'comparative_performance_authorized': False,
                  'comparative_result_available': False,
                  'human_developer_speech_accuracy_evidence': 'ABSENT',
                  'product_code_authorized': False,
                  'production_stt_selected': False,
              },
              'provenance_status': 'RECORDED_FROM_EXACT_GITHUB_ACTIONS_FAILED_PRIMARY_QUALIFICATION_SHARDED_PRIMARY_AND_SEAL_EVIDENCE_WITH_NON_RESULT_DRIVEN_FORWARD_ONLY_REPAIR_CHRONOLOGY',
          }
          canonical = lambda v: (json.dumps(v, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode()
          provenance['provenance_payload_sha256'] = hashlib.sha256(canonical(provenance)).hexdigest()
          (root / 'b2r08-provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY
          PROVENANCE_SHA256="$(sha256sum research/000b2-public/b2r08-provenance.json | cut -d' ' -f1)"
          export PROVENANCE_SHA256
          cat > "$RUNNER_TEMP/verify_b2r08.py.in" <<'PY'
          #!/usr/bin/env python3
          """Verify sealed B2R08 ATTEMPT-002 whispercpp-balanced sharded execution evidence."""
          from __future__ import annotations
          import hashlib, json, subprocess
          from pathlib import Path
          from typing import Any

