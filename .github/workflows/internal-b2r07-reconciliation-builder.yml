name: Internal B2R07 Reconciliation Builder

on:
  push:
    branches:
      - ci/000b2-b2r07-reconciliation-builder

permissions:
  contents: write

jobs:
  build-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANONICAL_BASE: 5ea5a513db5ec9c13739510061ca82faa84a0018
      QUALIFIED_TASK_HEAD: 704a0998e15562e4b22467b7a99d23de85737e1f
      RECONCILIATION_BRANCH: docs/000b2-b2r07-reconciliation
    steps:
      - name: Checkout builder revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build and verify reconciliation candidate
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git rev-list --parents -n 1 "$CANONICAL_BASE")" = "$CANONICAL_BASE 16104eacf2d571276452d173ddb54c089faccd0e $QUALIFIED_TASK_HEAD"
          cp .github/internal/b2r07_reconcile.py "$RUNNER_TEMP/b2r07_reconcile.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard "$CANONICAL_BASE"
          git switch -c "$RECONCILIATION_BRANCH"
          python "$RUNNER_TEMP/b2r07_reconcile.py"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r07.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_manifest.py
          rm -rf research/000b2-public/__pycache__ research/000b2-entry/__pycache__
          expected="$(printf '%s\n' 'docs/canonical/CURRENT_STATE.md' 'research/000b2-public/recovery-readiness.json' 'specs/000B2-public-corpus-bakeoff/tasks.md' 'specs/CURRENT.md' | sort)"
          observed="$(git diff --name-only "$CANONICAL_BASE" | sort)"
          test "$observed" = "$expected"
          test -z "$(git ls-files --others --exclude-standard)"
          echo 'B2R07_RECONCILIATION_SCOPE=PASS'

      - name: Push reconciliation candidate
        run: |
          set -euo pipefail
          git add docs/canonical/CURRENT_STATE.md research/000b2-public/recovery-readiness.json specs/000B2-public-corpus-bakeoff/tasks.md specs/CURRENT.md
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'docs(000b2): reconcile B2R07 and authorize B2R08'
          git push origin "HEAD:$RECONCILIATION_BRANCH"
          echo "B2R07_RECONCILIATION_HEAD=$(git rev-parse HEAD)"
