name: Internal B2R06 Reconciliation EOF Repair

on:
  push:
    branches:
      - docs/000b2-b2r06-reconciliation
    paths:
      - '.github/workflows/internal-b2r06-eof-repair.yml'

permissions:
  contents: write

jobs:
  repair-eof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: 2460eae15260423b3a06d50d9119ae2459ff41c7
      BRANCH: docs/000b2-b2r06-reconciliation
    steps:
      - name: Checkout exact repair revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair EOF boundary and retrigger hardened builder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE"
          python - <<'PY'
          from pathlib import Path
          helper = Path('research/000b2-public/internal_b2r06_reconcile.py')
          text = helper.read_text(encoding='utf-8')
          old = '''    end = text.find("\\n\\n", start)
    require(end != -1, f"{label}: next-action paragraph boundary missing")
    current = text[start:end]
'''
          new = '''    end = text.find("\\n\\n", start)
    if end == -1:
        end = len(text)
    current = text[start:end]
'''
          assert text.count(old) == 1
          helper.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/internal-b2r06-reconcile.yml')
          wf = workflow.read_text(encoding='utf-8')
          marker = 'name: Internal B2R06 Recovery Reconciliation\n'
          assert wf.count(marker) == 1
          workflow.write_text(wf.replace(marker, marker + '# EOF-safe retrigger\n', 1), encoding='utf-8')
          PY
          rm .github/workflows/internal-b2r06-eof-repair.yml
          python -m py_compile research/000b2-public/internal_b2r06_reconcile.py
          rm -rf research/000b2-public/__pycache__
          git diff --check "$BASE"
          test "$(git diff --name-only "$BASE" | sort)" = "$(printf '%s\n' \
            .github/workflows/internal-b2r06-reconcile.yml \
            research/000b2-public/internal_b2r06_reconcile.py | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            .github/workflows/internal-b2r06-eof-repair.yml \
            .github/workflows/internal-b2r06-reconcile.yml \
            research/000b2-public/internal_b2r06_reconcile.py | sort)"
          git commit -m 'fix(000b2): accept EOF next-action boundary'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo 'B2R06_RECONCILIATION_EOF_REPAIR=PASS'
