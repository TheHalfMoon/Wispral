name: Internal B2P08 Stale Authority Repair

on:
  push:
    branches:
      - research/000b2-b2p08-reconciliation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/000b2-b2p08-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair stale post-B2P08 authority
        run: |
          python - <<'PY'
          from pathlib import Path

          state_path = Path('docs/canonical/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          replacements = {
              '- B2P08 authorized as the sole current bounded execution unit;': '- B2E01 is now the only authorized bounded execution unit;',
              '- candidate revalidation, preprocessing capture, and execution-environment capture are complete; no comparative public-corpus decoding has started, B2P08 remains unfrozen until its own execution unit, and no production STT is selected.': '- candidate revalidation, preprocessing capture, execution-environment capture, and final pre-decode attempt freeze are complete; no comparative public-corpus decoding has started, B2E01 is the sole authorized decoding unit, B2E02 and all later candidate cells remain unauthorized, and no production STT is selected.',
              'Execute and canonically qualify `B2P08` only: freeze the final pre-decode attempt manifest for `000B2-PUBLIC-ATTEMPT-001`, binding the canonical B2P04 subset, B2P05 candidate revalidation, B2P06 preprocessing evidence, and B2P07 execution-environment evidence while verifying `primary_decoding_started=false`. B2P08 must not execute candidate or primary decoding. Preserve `HUMAN_DEVELOPER_SPEECH_ACCURACY_EVIDENCE=ABSENT`, historical `000B2-unbiased-stt-bakeoff=BLOCKED_EXTERNAL`, `production_stt_selected=false`, and `product_code_authorized=false`. Candidate and primary decoding remain unauthorized until B2P08 is canonically qualified, post-merge verified, and reconciled.': 'Execute and canonically qualify `B2E01` only: decode the exact frozen P0 public-human subset with candidate cell 1 (`moonshine-compact`) under frozen C0. Preserve raw transcript, failure, and run evidence; keep repository/test-specific context and candidate-specific audio transforms OFF; and preserve GitHub-hosted timing as `DIAGNOSTIC_ONLY`. Do not begin B2E02 or any later candidate cell until B2E01 is separately qualified, merged, post-merge verified, and reconciled. Preserve `HUMAN_DEVELOPER_SPEECH_ACCURACY_EVIDENCE=ABSENT`, historical `000B2-unbiased-stt-bakeoff=BLOCKED_EXTERNAL`, `production_stt_selected=false`, and `product_code_authorized=false`. B2E02 and all later candidate cells remain unauthorized.'
          }
          for old, new in replacements.items():
              if state.count(old) != 1:
                  raise SystemExit(f'expected exactly one stale authority occurrence: {old!r}')
              state = state.replace(old, new)
          state_path.write_text(state, encoding='utf-8')

          verifier_path = Path('research/000b2-public/verify_methodology.py')
          verifier = verifier_path.read_text(encoding='utf-8')
          anchor = '    require_absent(current_state, "current bounded execution unit is `B2P07`", "current state stale unit")\n'
          inserted = anchor + '    require_absent(current_state, "B2P08 authorized as the sole current bounded execution unit", "current state stale B2P08 authority")\n    require_absent(current_state, "B2P08 remains unfrozen until its own execution unit", "current state stale B2P08 freeze wording")\n    require_absent(current_state, "Execute and canonically qualify `B2P08` only", "current state stale B2P08 next action")\n'
          if verifier.count(anchor) != 1:
              raise SystemExit('expected exactly one current-state stale-unit anchor')
          verifier = verifier.replace(anchor, inserted)
          old_print = '    print("B2P08_FRONTIER=AUTHORIZED")\n'
          new_print = '    print("B2E01_FRONTIER=AUTHORIZED")\n'
          if verifier.count(old_print) != 1:
              raise SystemExit('expected exactly one stale frontier print')
          verifier = verifier.replace(old_print, new_print)
          verifier_path.write_text(verifier, encoding='utf-8')
          PY

          python -m py_compile research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_methodology.py
          git diff --check dd65e23d29e7f83b9a94aba9c018928c7f9cc41d --
      - name: Commit forward-only repair
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/canonical/CURRENT_STATE.md research/000b2-public/verify_methodology.py; then
            echo 'No repair diff produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/canonical/CURRENT_STATE.md research/000b2-public/verify_methodology.py
          git commit -m 'fix(000b2): remove stale B2P08 authority'
          git push origin HEAD:research/000b2-b2p08-reconciliation
