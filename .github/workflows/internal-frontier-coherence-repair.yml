name: Internal 000B2 Frontier Coherence Repair

on:
  push:
    branches:
      - research/000b2-frontier-coherence

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/000b2-frontier-coherence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine canonical frontier chronology
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('specs/CURRENT.md')
          text = path.read_text(encoding='utf-8')
          old = ", and B2P07 execution-environment capture became canonical at merge `4bd5306fa1d274d7b822b73e26172dd9c7058319`, and B2P08 pre-decode attempt freeze became canonical at merge `dd65e23d29e7f83b9a94aba9c018928c7f9cc41d`."
          new = ", B2P07 execution-environment capture became canonical at merge `4bd5306fa1d274d7b822b73e26172dd9c7058319`, and B2P08 pre-decode attempt freeze became canonical at merge `dd65e23d29e7f83b9a94aba9c018928c7f9cc41d`."
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one chronology grammar occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python -m py_compile research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_methodology.py
          git diff --check e11d228be5366840be234ed4822e481156125933 --
      - name: Commit forward-only chronology refinement
        run: |
          set -euo pipefail
          if git diff --quiet -- specs/CURRENT.md; then
            echo 'No chronology refinement produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/CURRENT.md
          if [ "$(git diff --cached --name-only)" != 'specs/CURRENT.md' ]; then
            echo 'Unexpected staged scope:'
            git diff --cached --name-only
            exit 1
          fi
          git commit -m 'docs(000b2): normalize frontier chronology wording'
          git push origin HEAD:research/000b2-frontier-coherence
