name: Internal B2R13 Review Remediation V2

on:
  push:
    branches:
      - recovery/b2r13-attempt-002-invalidation
    paths:
      - '.github/workflows/internal-b2r13-review-fix-v2.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: recovery/b2r13-attempt-002-invalidation
          fetch-depth: 0
      - name: Apply and verify remediation
        shell: bash
        run: |
          set -euo pipefail
          python tools/internal_b2r13_review_remediate.py
          python tools/internal_b2r13_activation_patch.py
          rm -f \
            .github/workflows/internal-b2r13-review-fix.yml \
            .github/workflows/internal-b2r13-review-fix-v2.yml \
            tools/internal_b2r13_review_remediate.py \
            tools/internal_b2r13_activation_patch.py
          git config user.name 'TheHalfMoon'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(b2): enforce B2R13/B2R14 non-primary content boundaries'
          python -m py_compile \
            research/000b2-public/verify_attempt_002_invalidation.py \
            research/000b2-public/verify_b2r13_activation.py
          AUTHORITY_BASE_REVISION=dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff \
            PYTHONDONTWRITEBYTECODE=1 \
            python research/000b2-public/verify_b2r13_activation.py --static-only
          test "$(git diff --name-only dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff HEAD -- | sort)" = "$(printf '%s\n' \
            .github/workflows/000b2-public-attempt-003-recovery.yml \
            .github/workflows/000b2-public-attempt-recovery.yml \
            research/000b2-public/attempt-002-invalidation.json \
            research/000b2-public/recovery-attempt-003-readiness.json \
            research/000b2-public/verify_attempt_002_invalidation.py \
            research/000b2-public/verify_b2r13_activation.py \
            specs/000B2-public-corpus-bakeoff/recovery-v2.md \
            specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md \
            specs/CURRENT.md | sort)"
          git push origin HEAD:recovery/b2r13-attempt-002-invalidation
