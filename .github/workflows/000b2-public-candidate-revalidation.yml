name: 000B2 Public Corpus Candidate Revalidation

on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-candidate-revalidation.yml'
      - '.github/trusted/verify_000b2_materialization.py'
      - 'research/000b1/qualified-candidates.json'
      - 'research/000b2-entry/artifact-size-amendment.json'
      - 'research/000b2-entry/materialized-artifacts.json'
      - 'research/000b2-public/candidate-revalidation.json'
      - 'research/000b2-public/readiness.json'
      - 'research/000b2-public/verify_candidate_revalidation.py'
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CANONICAL_BASE_SHA: 6135cd67c1b31e0be0b82ba202b6a6770d34b68d
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  static-candidate-revalidation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout independent canonical base authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANONICAL_BASE_SHA }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact trust boundary
        run: |
          set -euo pipefail
          test "$(git -C trusted-base rev-parse HEAD)" = "${CANONICAL_BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_SHA}"
          echo "B2P05_CANONICAL_BASE=${CANONICAL_BASE_SHA}"
          echo "B2P05_EXACT_HEAD=${EXPECTED_SHA}"
      - name: Compile B2P05 verifier
        run: python -m py_compile candidate/research/000b2-public/verify_candidate_revalidation.py
      - name: Verify B2P05 static authority and closed later gates
        run: python candidate/research/000b2-public/verify_candidate_revalidation.py --trusted-base-root trusted-base
      - name: Reverify current public methodology and frozen subset
        run: |
          PYTHONDONTWRITEBYTECODE=1 python candidate/research/000b2-public/verify_methodology.py
          PYTHONDONTWRITEBYTECODE=1 python candidate/research/000b2-public/verify_subset_freeze.py

  live-candidate-revalidation:
    needs: static-candidate-revalidation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout independent canonical base authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANONICAL_BASE_SHA }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact trust boundary
        run: |
          set -euo pipefail
          test "$(git -C trusted-base rev-parse HEAD)" = "${CANONICAL_BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_SHA}"
          echo "B2P05_CANONICAL_BASE=${CANONICAL_BASE_SHA}"
          echo "B2P05_EXACT_HEAD=${EXPECTED_SHA}"
      - name: Reproduce pending artifact identities from canonical trusted authority
        run: |
          PYTHONDONTWRITEBYTECODE=1 python trusted-base/.github/trusted/verify_000b2_materialization.py \
            --base-root trusted-base \
            --candidate-root candidate
      - name: Revalidate runtime and pre-pinned model identities live
        run: |
          PYTHONDONTWRITEBYTECODE=1 python candidate/research/000b2-public/verify_candidate_revalidation.py \
            --trusted-base-root trusted-base \
            --live
