name: Internal B2R09 Task Evidence Materialization V2

on:
  push:
    branches:
      - ci/000b2-b2r09-task-materialize-v1
    paths:
      - '.github/workflows/internal-b2r09-task-materialize-v2.yml'

permissions:
  actions: read
  contents: write

env:
  CANONICAL_BASE: 737e2fa0422e0d1aa0dd4d5bdc0473d51cec624c
  TASK_BRANCH: research/000b2-b2r09-sherpa-onnx-compact
  EXPECTED_TASK_HEAD: b7a4bb8828a4b861a399b1424bc07a4e549cf51f
  DECODER_BLOB: 27052cc7f3d57d2743ee06a7db8de730c833935e
  EXECUTION_BRANCH: research/000b2-b2r09-execution
  EXECUTION_SOURCE: 47d1c53f6892dda437aa0f1d109f58f1cc5e101e
  FAILED_SOURCE: f45e9884e3fbcdc84dd27393b8ffde7d12df65e5
  SUCCESS_RUN_ID: '34156167567'
  SUCCESS_JOB_ID: '101848322734'
  FAILED_RUN_ID: '34155967652'
  FAILED_JOB_ID: '101847745228'
  WORKFLOW_ID: '352553362'
  ARTIFACT_ID: '10031177463'
  ARTIFACT_NAME: b2r09-sherpa-onnx-compact-47d1c53f6892dda437aa0f1d109f58f1cc5e101e
  ARTIFACT_ZIP_SHA256: 79652728032760ae133845b7f1308623a984ee69c490991cf190d8a7301985ea
  EVIDENCE_SHA256: d59fa9605e8b0cf6892cd5a7ece105c6abe0753ff8949e9206e35f42da9a003f
  EVIDENCE_SIZE: '248426'
  PAYLOAD_SHA256: 4a81f1be21e18aa462ee9ec9c32a1daeaa6fa86bcca6372b0634a9421c16c1ed

jobs:
  materialize-b2r09:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact clean B2R09 task head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_TASK_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable source and live authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TASK_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git ls-remote origin refs/heads/$TASK_BRANCH | cut -f1)" = "$EXPECTED_TASK_HEAD"
          test "$(git ls-remote origin refs/heads/$EXECUTION_BRANCH | cut -f1)" = "$EXECUTION_SOURCE"
          test "$(git hash-object research/000b2-public/decode_b2r09.py)" = "$DECODER_BLOB"
          test "$(git diff --name-only "$CANONICAL_BASE" "$EXPECTED_TASK_HEAD")" = "research/000b2-public/decode_b2r09.py"
          git diff --quiet HEAD --

      - name: Verify exact GitHub run chronology
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r09-materialize"
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SUCCESS_RUN_ID" > "$ROOT/success-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SUCCESS_RUN_ID/jobs" > "$ROOT/success-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID" > "$ROOT/failed-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID/jobs" > "$ROOT/failed-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID/artifacts" > "$ROOT/failed-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$ROOT/artifact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'b2r09-materialize'
          load=lambda n: json.loads((root/n).read_text())
          sr=load('success-run.json'); sj=load('success-jobs.json'); fr=load('failed-run.json'); fj=load('failed-jobs.json'); fa=load('failed-artifacts.json'); a=load('artifact.json')
          assert sr['id']==int(os.environ['SUCCESS_RUN_ID']) and sr['conclusion']=='success' and sr['head_sha']==os.environ['EXECUTION_SOURCE'] and sr['workflow_id']==int(os.environ['WORKFLOW_ID'])
          jobs=sj['jobs']; assert len(jobs)==1 and jobs[0]['id']==int(os.environ['SUCCESS_JOB_ID']) and jobs[0]['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in jobs[0]['steps']}
          for name in ['Verify exact B2R09 authority before external access','Set up exact Python runtime family','Install exact accepted sherpa runtime release','Reproduce and verify exact frozen P0 preprocessing bytes','Fetch exact pinned sherpa source identity','Download and verify exact sherpa-onnx-compact artifacts','Execute B2R09 sherpa-onnx-compact C0 primary decode','Verify B2R09 semantic and raw-data boundary','Upload bounded B2R09 evidence only','Remove transient primary/model/source/preprocessing material','Verify execution branch stayed clean']:
              assert steps.get(name)=='success', (name, steps.get(name))
          assert fr['id']==int(os.environ['FAILED_RUN_ID']) and fr['conclusion']=='failure' and fr['head_sha']==os.environ['FAILED_SOURCE'] and fr['workflow_id']==int(os.environ['WORKFLOW_ID'])
          fjobs=fj['jobs']; assert len(fjobs)==1 and fjobs[0]['id']==int(os.environ['FAILED_JOB_ID']) and fjobs[0]['conclusion']=='failure'
          fsteps={s['name']:s['conclusion'] for s in fjobs[0]['steps']}
          assert fsteps['Verify exact B2R09 authority before external access']=='success'
          assert fsteps['Set up exact Python runtime family']=='failure'
          for name in ['Install exact accepted sherpa runtime release','Pull exact immutable preprocessing container','Fetch exact FFmpeg release','Build bounded FFmpeg 9.0.1 preprocessing tool','Reproduce and verify exact frozen P0 preprocessing bytes','Fetch exact pinned sherpa source identity','Download and verify exact sherpa-onnx-compact artifacts','Execute B2R09 sherpa-onnx-compact C0 primary decode','Verify B2R09 semantic and raw-data boundary']:
              assert fsteps.get(name)=='skipped', (name, fsteps.get(name))
          assert fa['total_count']==0 and fa['artifacts']==[]
          assert a['id']==int(os.environ['ARTIFACT_ID']) and a['name']==os.environ['ARTIFACT_NAME'] and a['expired'] is False
          assert a['digest']=='sha256:'+os.environ['ARTIFACT_ZIP_SHA256']
          assert a['workflow_run']['id']==int(os.environ['SUCCESS_RUN_ID']) and a['workflow_run']['head_sha']==os.environ['EXECUTION_SOURCE']
          print('B2R09_GITHUB_CHRONOLOGY=PASS')
          PY

      - name: Download and verify exact successful artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r09-materialize"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o "$ROOT/evidence.zip"
          test "$(sha256sum "$ROOT/evidence.zip" | cut -d' ' -f1)" = "$ARTIFACT_ZIP_SHA256"
          unzip -q "$ROOT/evidence.zip" -d "$ROOT/unzip"
          test "$(find "$ROOT/unzip" -type f | wc -l)" -eq 1
          test -f "$ROOT/unzip/b2r09-sherpa-onnx-compact.json"
          test "$(stat -c%s "$ROOT/unzip/b2r09-sherpa-onnx-compact.json")" = "$EVIDENCE_SIZE"
          test "$(sha256sum "$ROOT/unzip/b2r09-sherpa-onnx-compact.json" | cut -d' ' -f1)" = "$EVIDENCE_SHA256"

      - name: Materialize evidence provenance and verifier
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r09-materialize"
          cp "$ROOT/unzip/b2r09-sherpa-onnx-compact.json" research/000b2-public/b2r09-sherpa-onnx-compact.json
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          public=Path('research/000b2-public'); evidence_path=public/'b2r09-sherpa-onnx-compact.json'; evidence=json.loads(evidence_path.read_text())
          canonical=lambda v:(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
          unsigned=dict(evidence); payload=unsigned.pop('evidence_payload_sha256')
          assert payload==os.environ['PAYLOAD_SHA256'] and hashlib.sha256(canonical(unsigned)).hexdigest()==payload
          assert hashlib.sha256(evidence_path.read_bytes()).hexdigest()==os.environ['EVIDENCE_SHA256'] and evidence_path.stat().st_size==int(os.environ['EVIDENCE_SIZE'])
          assert (evidence['task'],evidence['attempt_id'],evidence['state'])==('B2R09','000B2-PUBLIC-ATTEMPT-002','ATTEMPT_002_C0_PRIMARY_DECODE_CAPTURED')
          assert evidence['execution']['input_count']==240 and evidence['execution']['decoded_count']==240 and evidence['execution']['failure_count']==0
          assert evidence['execution']['reference_transcripts_loaded_by_decoder'] is False and evidence['execution']['accuracy_scoring_performed'] is False and evidence['execution']['comparative_ranking_present'] is False and evidence['execution']['performance_claim_present'] is False
          assert evidence['claim_guards']['b2r10_authorized'] is False
          claims={'b2r10_authorized':False,'comparative_performance_authorized':False,'comparative_result_available':False,'human_developer_speech_accuracy_evidence':'ABSENT','product_code_authorized':False,'production_stt_selected':False}
          provenance={
            'schema_version':'000b2-public-b2r09-provenance-v1','task':'B2R09','attempt_id':'000B2-PUBLIC-ATTEMPT-002','candidate_id':'sherpa-onnx-compact',
            'provenance_status':'RECORDED_FROM_EXACT_GITHUB_ACTIONS_SUCCESSFUL_PRIMARY_WITH_FAILED_PRE_PRIMARY_PYTHON_CACHE_SETUP_CHRONOLOGY',
            'canonical_evidence_source':{'role':'CANONICAL_EVIDENCE_SOURCE','workflow_id':int(os.environ['WORKFLOW_ID']),'workflow_name':'Internal B2R09 ATTEMPT-002 Capture','run_id':int(os.environ['SUCCESS_RUN_ID']),'job_id':int(os.environ['SUCCESS_JOB_ID']),'run_attempt':1,'conclusion':'success','event':'push','source_branch':os.environ['EXECUTION_BRANCH'],'source_revision':os.environ['EXECUTION_SOURCE'],'artifact_id':int(os.environ['ARTIFACT_ID']),'artifact_name':os.environ['ARTIFACT_NAME'],'artifact_zip_sha256':os.environ['ARTIFACT_ZIP_SHA256'],'artifact_zip_size_bytes':19519,'evidence_path':'research/000b2-public/b2r09-sherpa-onnx-compact.json','evidence_raw_file_sha256':os.environ['EVIDENCE_SHA256'],'evidence_raw_file_size_bytes':int(os.environ['EVIDENCE_SIZE']),'evidence_payload_sha256':os.environ['PAYLOAD_SHA256'],'execution_decoder_blob_sha':os.environ['DECODER_BLOB'],'mergeable_decoder_blob_sha':os.environ['DECODER_BLOB'],'selection_basis':'FIRST_SUCCESSFUL_B2R09_PRIMARY_AFTER_PRE_PRIMARY_SETUP_PYTHON_CACHE_CONFIGURATION_FAILURE_WITH_ZERO_ARTIFACTS_AND_NO_RUNTIME_MODEL_PREPROCESSING_OR_PRIMARY_ACCESS; NOT_RESULT_DRIVEN'},
            'related_pre_primary_runs':[{'role':'FAILED_PRE_PRIMARY_NONCANONICAL','workflow_id':int(os.environ['WORKFLOW_ID']),'workflow_name':'Internal B2R09 ATTEMPT-002 Capture','run_id':int(os.environ['FAILED_RUN_ID']),'job_id':int(os.environ['FAILED_JOB_ID']),'run_attempt':1,'conclusion':'failure','source_branch':os.environ['EXECUTION_BRANCH'],'source_revision':os.environ['FAILED_SOURCE'],'artifact_count':0,'failure_stage':'SETUP_PYTHON_CACHE_DEPENDENCY_FILE_DISCOVERY','failure_detail':'actions/setup-python cache=pip found no requirements.txt or pyproject.toml after CPython 3.11.16 setup','authority_validation_succeeded':True,'runtime_install_started':False,'preprocessing_container_pull_started':False,'preprocessing_started':False,'runtime_source_fetch_started':False,'model_download_started':False,'primary_decode_started':False,'candidate_result_accessed':False,'selection_effect':'NONE','repair':{'policy':'FORWARD_ONLY_REMOVE_SETUP_PYTHON_PIP_CACHE_CONFIGURATION','c0_controls_changed':False,'candidate_changed':False,'model_changed':False,'runtime_revision_changed':False,'frozen_audio_changed':False,'scorer_changed':False,'normalization_changed':False}}],
            'result_accounting':{'input_count':240,'decoded_count':240,'failure_count':0,'all_frozen_input_hashes_reverified':True,'reference_transcripts_loaded_by_decoder':False,'accuracy_scoring_performed':False,'comparative_ranking_present':False,'performance_claim_present':False,'timing_semantics':'DIAGNOSTIC_ONLY','result_driven_evidence_selection':False},
            'runtime_identity':evidence['run']['runtime_identity'],'claims':claims,
          }
          provenance['provenance_payload_sha256']=hashlib.sha256(canonical(provenance)).hexdigest(); provenance_path=public/'b2r09-provenance.json'; provenance_path.write_text(json.dumps(provenance,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); prov_sha=hashlib.sha256(provenance_path.read_bytes()).hexdigest()
          verifier_b64=''
          verifier=base64.b64decode(verifier_b64).decode().replace('__PROV_SHA__',prov_sha); (public/'verify_b2r09.py').write_text(verifier)
          composite=public/'verify_attempt_manifest.py'; text=composite.read_text(); old='"""Composite attempt verifier for historical B2P08 and recovery B2R04/B2R05/B2R06/B2R07/B2R08."""'; new='"""Composite attempt verifier for historical B2P08 and recovery B2R04/B2R05/B2R06/B2R07/B2R08/B2R09."""'; assert old in text; text=text.replace(old,new,1)
          anchor='    (PUBLIC / "verify_b2r08.py", "wispral_b2r08_execution_evidence"),\n]'; replacement='    (PUBLIC / "verify_b2r08.py", "wispral_b2r08_execution_evidence"),\n    (PUBLIC / "verify_b2r09.py", "wispral_b2r09_execution_evidence"),\n]'; assert anchor in text; text=text.replace(anchor,replacement,1); text=text.replace('B2P08_B2R04_B2R05_B2R06_B2R07_AND_B2R08_ATTEMPT_VERIFIER=PASS','B2P08_B2R04_B2R05_B2R06_B2R07_B2R08_AND_B2R09_ATTEMPT_VERIFIER=PASS',1); composite.write_text(text)
          print('B2R09_PROVENANCE_SHA256='+prov_sha); print('B2R09_PROVENANCE_PAYLOAD_SHA256='+provenance['provenance_payload_sha256'])
          PY
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile research/000b2-public/decode_b2r09.py research/000b2-public/verify_b2r09.py research/000b2-public/verify_attempt_manifest.py
          rm -rf research/000b2-public/__pycache__ research/000b2-entry/__pycache__
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r09.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_manifest.py

      - name: Enforce exact task scope and publish fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          expected={'research/000b2-public/decode_b2r09.py','research/000b2-public/b2r09-sherpa-onnx-compact.json','research/000b2-public/b2r09-provenance.json','research/000b2-public/verify_b2r09.py','research/000b2-public/verify_attempt_manifest.py'}
          observed=set(subprocess.check_output(['git','diff','--name-only',os.environ['CANONICAL_BASE']],text=True).splitlines()); assert observed==expected,(sorted(observed),sorted(expected)); print('B2R09_TASK_SCOPE=PASS')
          PY
          git diff --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git ls-remote origin refs/heads/$TASK_BRANCH | cut -f1)" = "$EXPECTED_TASK_HEAD"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/000b2-public/decode_b2r09.py research/000b2-public/b2r09-sherpa-onnx-compact.json research/000b2-public/b2r09-provenance.json research/000b2-public/verify_b2r09.py research/000b2-public/verify_attempt_manifest.py
          git commit -m "research(000b2): seal B2R09 sherpa onnx compact evidence"
          NEW_HEAD="$(git rev-parse HEAD)"; test "$(git rev-parse HEAD^)" = "$EXPECTED_TASK_HEAD"; git push origin "HEAD:refs/heads/$TASK_BRANCH"; echo "B2R09_TASK_HEAD=$NEW_HEAD"
