name: 000B1 Preregistration

on:
  push:
    branches:
      - research/000b1-benchmark-candidate-qualification
      - research/000b1-canonical-closeout
    paths:
      - 'docs/research/stt/000b1-*'
      - 'docs/canonical/CURRENT_STATE.md'
      - 'research/000b1/**'
      - 'specs/CURRENT.md'
      - 'specs/000B1-benchmark-candidate-qualification/**'
      - '.github/workflows/000b1-preregistration.yml'
  pull_request:
    paths:
      - 'docs/research/stt/000b1-*'
      - 'docs/canonical/CURRENT_STATE.md'
      - 'research/000b1/**'
      - 'specs/CURRENT.md'
      - 'specs/000B1-benchmark-candidate-qualification/**'
      - '.github/workflows/000b1-preregistration.yml'

permissions:
  contents: read

jobs:
  verify-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 000B1 machine-readable preregistration evidence
        run: python research/000b1/verify_preregistration.py
      - name: Verify frozen candidate and schema contract semantics
        run: python research/000b1/verify_frozen_contracts.py
      - name: Verify 000B2 frozen registry readiness gate
        run: python research/000b1/verify_b2_registry_gate.py
      - name: Verify entity annotation semantic invariants
        run: python research/000b1/verify_entity_annotation_gate.py
      - name: Verify 000B1 cross-document authority alignment
        run: python research/000b1/verify_documents.py
      - name: Verify canonical closeout when present
        run: |
          if [ -f research/000b1/canonical-closeout.json ]; then
            python research/000b1/verify_closeout.py
          else
            echo 'B1_CLOSEOUT=NO'
          fi
