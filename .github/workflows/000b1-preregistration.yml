name: 000B1 Preregistration

on:
  push:
    branches:
      - research/000b1-benchmark-candidate-qualification
    paths:
      - 'docs/research/stt/000b1-*'
      - 'research/000b1/**'
      - 'specs/000B1-benchmark-candidate-qualification/tasks.md'
      - '.github/workflows/000b1-preregistration.yml'
  pull_request:
    paths:
      - 'docs/research/stt/000b1-*'
      - 'research/000b1/**'
      - 'specs/000B1-benchmark-candidate-qualification/tasks.md'
      - '.github/workflows/000b1-preregistration.yml'

permissions:
  contents: read

jobs:
  verify-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 000B1 machine-readable preregistration evidence
        run: python research/000b1/verify_preregistration.py
      - name: Verify 000B1 cross-document authority alignment
        run: python research/000b1/verify_documents.py
