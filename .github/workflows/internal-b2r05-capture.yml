name: Internal B2R05 ATTEMPT-002 Moonshine Compact Capture

on:
  push:
    branches:
      - execution/000b2-b2r05-moonshine-compact
    paths:
      - '.github/workflows/internal-b2r05-capture.yml'
      - 'research/000b2-public/decode_b2r05.py'
      - 'research/000b2-public/verify_b2r05.py'

permissions:
  contents: read

concurrency:
  group: b2r05-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-b2r05:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      B2R05_REVISION: ${{ github.sha }}
      FFMPEG_TAG: n9.0.1
      FFMPEG_REV: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
      FFMPEG_ROOT: ${{ runner.temp }}/b2r05/toolchain
    steps:
      - name: Checkout exact B2R05 execution revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.B2R05_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Verify exact revision and static B2R05 authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B2R05_REVISION"
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.14"
          python -m py_compile \
            research/000b2-public/decode_b2r05.py \
            research/000b2-public/verify_b2r05.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r05.py --static-only

      - name: Fetch exact FFmpeg release
        run: |
          set -euo pipefail
          rm -rf "$FFMPEG_ROOT"
          mkdir -p "$FFMPEG_ROOT"
          SRC="$FFMPEG_ROOT/FFmpeg"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C "$SRC" fetch --depth=1 origin "refs/tags/$FFMPEG_TAG:refs/tags/$FFMPEG_TAG"
          test "$(git -C "$SRC" rev-list -n1 "$FFMPEG_TAG")" = "$FFMPEG_REV"
          git -C "$SRC" checkout --detach "$FFMPEG_REV"
          git -C "$SRC" diff --quiet HEAD --

      - name: Build bounded FFmpeg preprocessing tool
        run: |
          set -euo pipefail
          SRC="$FFMPEG_ROOT/FFmpeg"
          PREFIX="$FFMPEG_ROOT/install"
          cd "$SRC"
          ./configure \
            --prefix="$PREFIX" \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-network \
            --disable-autodetect \
            --disable-x86asm \
            --enable-protocol=file \
            --enable-demuxer=flac,wav \
            --enable-muxer=wav \
            --enable-decoder=flac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
            --enable-encoder=pcm_s16le \
            --enable-parser=flac \
            --enable-filter=aresample,aformat \
            --enable-swresample
          make -j2 ffmpeg
          make install
          "$PREFIX/bin/ffmpeg" -version | head -n 1

      - name: Reproduce exact frozen P0 preprocessing bytes
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/b2r05/preprocess"
          mkdir -p "$RUNNER_TEMP/b2r05/preprocess"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/preprocess_subset.py \
            --ffmpeg "$FFMPEG_ROOT/install/bin/ffmpeg" \
            --work-dir "$RUNNER_TEMP/b2r05/preprocess" \
            --output "$RUNNER_TEMP/b2r05/preprocessing-capture.json"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
            --compare-committed "$RUNNER_TEMP/b2r05/preprocessing-capture.json"

      - name: Install exact Moonshine release dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'moonshine-voice==0.1.5'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("moonshine-voice") == "0.1.5"
          print("MOONSHINE_DISTRIBUTION=0.1.5")
          PY

      - name: Execute ATTEMPT-002 B2R05 moonshine-compact streaming C0
        env:
          RUNNER_ENVIRONMENT: github-hosted
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/decode_b2r05.py \
            --work-dir "$RUNNER_TEMP/b2r05/moonshine" \
            --preprocessed-root "$RUNNER_TEMP/b2r05/preprocess/preprocessed" \
            --output "$RUNNER_TEMP/b2r05/b2r05-moonshine-compact.json"

      - name: Verify captured B2R05 evidence without scoring
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r05.py \
            --evidence "$RUNNER_TEMP/b2r05/b2r05-moonshine-compact.json"

      - name: Upload bounded B2R05 execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2r05-moonshine-compact-${{ env.B2R05_REVISION }}
          path: ${{ runner.temp }}/b2r05/b2r05-moonshine-compact.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove transient corpus, model cache, source build, and toolchain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/b2r05"
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
          test ! -e research/000b2-public/transcripts
