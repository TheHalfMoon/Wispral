name: Internal B2P08 Reconciliation Guard Repair

on:
  push:
    branches:
      - research/000b2-b2p08-reconciliation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/000b2-b2p08-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore historical B2P06 freeze guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('research/000b2-public/capture_environment.py')
          text = path.read_text(encoding='utf-8')
          new_guard = '        require(attempt_state.get("frozen") is False, "B2P08 attempt must remain unfrozen at the B2P06 frontier")\n'
          if new_guard not in text:
              anchor = '    if completed_through == "B2P06":\n        require(environment_state.get("resolved") is False, "B2P07 readiness must remain unresolved until canonical reconciliation")\n'
              replacement = '    if completed_through == "B2P06":\n' + new_guard + '        require(environment_state.get("resolved") is False, "B2P07 readiness must remain unresolved until canonical reconciliation")\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'B2P06 guard anchor count={text.count(anchor)}')
              text = text.replace(anchor, replacement, 1)
          text = text.replace(
              '    else:        raise CaptureError(f"B2P07 authority phase unsupported: completed_through={completed_through!r}, allow_reconciled={allow_reconciled}")\n',
              '    else:\n        raise CaptureError(f"B2P07 authority phase unsupported: completed_through={completed_through!r}, allow_reconciled={allow_reconciled}")\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify repaired historical guards
        run: |
          set -euo pipefail
          python -m py_compile research/000b2-public/capture_environment.py research/000b2-public/verify_environment_capture.py research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_environment_capture.py
          python research/000b2-public/verify_preprocessing_capture.py --static-only
          python research/000b2-public/verify_subset_freeze.py
          git diff --check dd65e23d29e7f83b9a94aba9c018928c7f9cc41d --
      - name: Commit verified guard repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/000b2-public/capture_environment.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'B2P06_HISTORICAL_GUARD_REPAIR=NO_CHANGES'
            exit 0
          fi
          git commit -m 'fix(000b2): preserve B2P06 pre-freeze guard'
          git push origin HEAD:research/000b2-b2p08-reconciliation
