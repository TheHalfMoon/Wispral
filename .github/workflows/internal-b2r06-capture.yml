name: Internal B2R06 ATTEMPT-002 Capture

on:
  push:
    branches:
      - research/000b2-b2r06-execution
    paths:
      - '.github/workflows/internal-b2r06-capture.yml'
      - 'research/000b2-public/decode_b2r06.py'

permissions:
  contents: read

concurrency:
  group: b2r06-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-b2r06:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      B2R06_REVISION: ${{ github.sha }}
      B2P06_TOOLCHAIN_CONTAINER_IMAGE: python:3.12.11-bookworm@sha256:13c9584604a99ca134c4f41800f74ffc64ee6ac8cf555cf1e704a6087fc84f12
      B2P06_TOOLCHAIN_CONTAINER_PLATFORM: linux/amd64
      FFMPEG_TAG: n9.0.1
      FFMPEG_REV: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
      FFMPEG_ROOT: /evidence/toolchain
    steps:
      - name: Checkout exact B2R06 execution revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.B2R06_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bound candidate runtime Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Verify exact revision and frozen B2R06 authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B2R06_REVISION"
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.14"
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path
          text = Path('research/000b2-public/decode_b2r06.py').read_text(encoding='utf-8')
          compile(text, 'research/000b2-public/decode_b2r06.py', 'exec')
          assert '"moonshine-compact",\n            "moonshine-balanced"' in text
          assert 'ModelArch.MEDIUM_STREAMING' in text
          assert '"b2r07_authorized": False' in text
          print('B2R06_DECODER_STATIC=PASS')
          PY
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r04_attempt_freeze.py

      - name: Pull exact immutable B2P06 preprocessing toolchain
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/b2r06"
          mkdir -p "$RUNNER_TEMP/b2r06/home" "$RUNNER_TEMP/b2r06/work"
          docker pull --platform "$B2P06_TOOLCHAIN_CONTAINER_PLATFORM" "$B2P06_TOOLCHAIN_CONTAINER_IMAGE"
          test "$(docker image inspect "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" --format '{{.Architecture}}')" = "amd64"

      - name: Fetch exact FFmpeg release inside immutable container
        run: |
          set -euo pipefail
          docker run --rm --platform "$B2P06_TOOLCHAIN_CONTAINER_PLATFORM" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -e FFMPEG_TAG \
            -e FFMPEG_REV \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2r06:/evidence" \
            -w /workspace \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              rm -rf "$FFMPEG_ROOT"
              mkdir -p "$FFMPEG_ROOT"
              SRC="$FFMPEG_ROOT/FFmpeg"
              git init "$SRC"
              git -C "$SRC" remote add origin https://github.com/FFmpeg/FFmpeg.git
              git -C "$SRC" fetch --depth=1 origin "refs/tags/$FFMPEG_TAG:refs/tags/$FFMPEG_TAG"
              test "$(git -C "$SRC" rev-list -n1 "$FFMPEG_TAG")" = "$FFMPEG_REV"
              git -C "$SRC" checkout --detach "$FFMPEG_REV"
              test "$(git -C "$SRC" rev-parse HEAD)" = "$FFMPEG_REV"
              test "$(git -C "$SRC" describe --tags --always)" = "$FFMPEG_TAG"
              git -C "$SRC" diff --quiet HEAD --
            '

      - name: Build bounded exact FFmpeg with network disabled
        run: |
          set -euo pipefail
          docker run --rm --platform "$B2P06_TOOLCHAIN_CONTAINER_PLATFORM" --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$RUNNER_TEMP/b2r06:/evidence" \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              SRC="$FFMPEG_ROOT/FFmpeg"
              PREFIX="$FFMPEG_ROOT/install"
              cd "$SRC"
              ./configure \
                --prefix="$PREFIX" \
                --disable-everything \
                --disable-doc \
                --disable-debug \
                --disable-ffplay \
                --disable-ffprobe \
                --disable-network \
                --disable-autodetect \
                --disable-x86asm \
                --enable-protocol=file \
                --enable-demuxer=flac,wav \
                --enable-muxer=wav \
                --enable-decoder=flac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
                --enable-encoder=pcm_s16le \
                --enable-parser=flac \
                --enable-filter=aresample,aformat \
                --enable-swresample
              make -j2 ffmpeg
              make install
              "$PREFIX/bin/ffmpeg" -version | head -n 1
            '

      - name: Reproduce byte-identical frozen P0 preprocessing inside immutable container
        run: |
          set -euo pipefail
          docker run --rm --platform "$B2P06_TOOLCHAIN_CONTAINER_PLATFORM" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2r06:/evidence" \
            -w /workspace \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/preprocess_subset.py \
                --ffmpeg "$FFMPEG_ROOT/install/bin/ffmpeg" \
                --work-dir /evidence/work \
                --output /evidence/preprocessing-capture.json
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
                --compare-committed /evidence/preprocessing-capture.json
            '

      - name: Install Moonshine release dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'moonshine-voice==0.1.5'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('moonshine-voice') == '0.1.5'
          print('MOONSHINE_DISTRIBUTION_VERSION=0.1.5')
          PY

      - name: Execute B2R06 moonshine-balanced streaming C0 decode
        env:
          GITHUB_REF: refs/heads/research/000b2-b2r06-execution
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/decode_b2r06.py \
            --work-dir "$RUNNER_TEMP/b2r06/runtime" \
            --preprocessed-root "$RUNNER_TEMP/b2r06/work/preprocessed" \
            --output "$RUNNER_TEMP/b2r06-moonshine-balanced.json"

      - name: Verify bounded B2R06 capture semantics
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/b2r06-moonshine-balanced.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['EVIDENCE']).read_text(encoding='utf-8'))
          assert value['schema_version'] == '000b2-public-b2r06-decode-v1'
          assert value['task'] == 'B2R06'
          assert value['attempt_id'] == '000B2-PUBLIC-ATTEMPT-002'
          assert value['candidate']['cell_index'] == 2
          assert value['candidate']['candidate_id'] == 'moonshine-balanced'
          assert value['candidate']['tier'] == 'BALANCED'
          assert value['candidate']['model_arch'] == 5
          assert value['authority']['canonical_authority_base'] == '04056b795a54e38d9d075e4de7aff15df1be2b3b'
          assert value['authority']['attempt_freeze_digest_sha256'] == '600a286747ef2e1503a48c4138b6e405665ccd6586904ef65b3638b49974bcc8'
          controls = value['c0_controls']
          assert controls['repository_context_used'] is False
          assert controls['test_specific_context_used'] is False
          assert controls['candidate_specific_audio_transform_used'] is False
          assert controls['keyterms'] == [] and controls['context'] is None
          assert controls['feed_chunk_samples'] == 8000
          assert controls['final_zero_pad_samples'] == 10560
          assert controls['vad_threshold'] == 0.0
          execution = value['execution']
          assert execution['input_count'] == 240
          assert execution['decoded_count'] == 209
          assert execution['failure_count'] == 31
          assert execution['all_frozen_input_hashes_reverified'] is True
          assert execution['reference_transcripts_loaded_by_decoder'] is False
          assert execution['accuracy_scoring_performed'] is False
          assert execution['comparative_ranking_present'] is False
          assert execution['performance_claim_present'] is False
          assert len(execution['records']) == 240
          expected_failure = {'type': 'C0HarnessError', 'message': 'Moonshine C0 input exceeds the frozen 12-second primary utterance bound'}
          for row in execution['records']:
              if row['status'] == 'DECODED':
                  trace = row['feed_trace']
                  chunks = trace['speech_chunk_samples']
                  assert chunks and all(0 < size <= 8000 for size in chunks)
                  assert all(size == 8000 for size in chunks[:-1])
                  assert sum(chunks) == trace['speech_samples']
                  assert trace['zero_pad_samples'] == 10560
                  assert trace['sample_rate_hz'] == 16000
                  assert trace['stream_started'] is True
                  assert trace['stream_stopped'] is True
              else:
                  assert row['status'] == 'FAILED'
                  assert row['failure'] == expected_failure
                  assert row['raw_lines'] == [] and row['raw_transcript'] == '' and row['feed_trace'] is None
          guards = value['claim_guards']
          assert guards == {
              'human_developer_speech_accuracy_evidence': 'ABSENT',
              'comparative_result_available': False,
              'comparative_performance_authorized': False,
              'production_stt_selected': False,
              'product_code_authorized': False,
              'b2r07_authorized': False,
          }
          print('B2R06_CAPTURE_SEMANTICS=PASS')
          PY

      - name: Upload bounded B2R06 execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2r06-moonshine-balanced-${{ env.B2R06_REVISION }}
          path: ${{ runner.temp }}/b2r06-moonshine-balanced.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove transient corpus, runtime, model cache, and toolchain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/b2r06"
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
