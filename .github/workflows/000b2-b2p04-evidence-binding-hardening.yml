name: 000B2 B2P04 Evidence Binding Hardening

on:
  push:
    branches:
      - docs/000b2-b2p04-frontier-reconciliation
    paths:
      - '.github/workflows/000b2-b2p04-evidence-binding-hardening.yml'

permissions:
  contents: write

jobs:
  harden-b2p04-evidence-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify branch, base, and exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "docs/000b2-b2p04-frontier-reconciliation"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "4c4e758f22b54fa62256e57bfbd344adc817df8e"
          test "$(git merge-base HEAD origin/main)" = "4c4e758f22b54fa62256e57bfbd344adc817df8e"
      - name: Bind exact B2P04 qualification and methodology job identities
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path

          path = Path('research/000b2-public/verify_methodology.py')
          text = path.read_text(encoding='utf-8')

          old_current = '''    require_text(current, B2P04_CANONICAL_MERGE, "current frontier B2P04 canonical proof")
              require_text(current, f"run `{B2P04_POSTMERGE_SUBSET_RUN_ID}`", "current frontier B2P04 subset post-merge run proof")
              require_text(current, f"job `{B2P04_POSTMERGE_SUBSET_JOB_ID}`", "current frontier B2P04 subset post-merge job proof")
              require_text(current, f"artifact `{B2P04_POSTMERGE_ARTIFACT_ID}`", "current frontier B2P04 post-merge artifact proof")'''
          new_current = '''    require_text(current, B2P04_CANONICAL_MERGE, "current frontier B2P04 canonical proof")
              require_text(current, B2P04_QUALIFIED_HEAD, "current frontier B2P04 qualified-head proof")
              require_text(current, f"run `{B2P04_POSTMERGE_SUBSET_RUN_ID}`", "current frontier B2P04 subset post-merge run proof")
              require_text(current, f"job `{B2P04_POSTMERGE_SUBSET_JOB_ID}`", "current frontier B2P04 subset post-merge job proof")
              require_text(current, f"run `{B2P04_POSTMERGE_METHODOLOGY_RUN_ID}`", "current frontier B2P04 methodology post-merge run proof")
              require_text(current, f"job `{B2P04_POSTMERGE_METHODOLOGY_JOB_ID}`", "current frontier B2P04 methodology post-merge job proof")
              require_text(current, f"artifact `{B2P04_POSTMERGE_ARTIFACT_ID}`", "current frontier B2P04 post-merge artifact proof")'''

          old_state = '''    require_text(current_state, B2P04_CANONICAL_MERGE, "current state B2P04 canonical proof")
              require_text(current_state, f"run `{B2P04_POSTMERGE_SUBSET_RUN_ID}`", "current state B2P04 subset post-merge run proof")
              require_text(current_state, f"job `{B2P04_POSTMERGE_SUBSET_JOB_ID}`", "current state B2P04 subset post-merge job proof")
              require_text(current_state, f"artifact `{B2P04_POSTMERGE_ARTIFACT_ID}`", "current state B2P04 post-merge artifact proof")'''
          new_state = '''    require_text(current_state, B2P04_CANONICAL_MERGE, "current state B2P04 canonical proof")
              require_text(current_state, B2P04_QUALIFIED_HEAD, "current state B2P04 qualified-head proof")
              require_text(current_state, f"run `{B2P04_POSTMERGE_SUBSET_RUN_ID}`", "current state B2P04 subset post-merge run proof")
              require_text(current_state, f"job `{B2P04_POSTMERGE_SUBSET_JOB_ID}`", "current state B2P04 subset post-merge job proof")
              require_text(current_state, f"run `{B2P04_POSTMERGE_METHODOLOGY_RUN_ID}`", "current state B2P04 methodology post-merge run proof")
              require_text(current_state, f"job `{B2P04_POSTMERGE_METHODOLOGY_JOB_ID}`", "current state B2P04 methodology post-merge job proof")
              require_text(current_state, f"artifact `{B2P04_POSTMERGE_ARTIFACT_ID}`", "current state B2P04 post-merge artifact proof")'''

          if text.count(old_current) != 1:
              raise SystemExit(f'B2P04_EVIDENCE_BINDING=FAIL: current anchor count {text.count(old_current)}')
          text = text.replace(old_current, new_current)
          if text.count(old_state) != 1:
              raise SystemExit(f'B2P04_EVIDENCE_BINDING=FAIL: current-state anchor count {text.count(old_state)}')
          text = text.replace(old_state, new_state)
          path.write_text(text, encoding='utf-8')
          print('B2P04_EVIDENCE_BINDING=HARDENED')
          PY
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_methodology.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_subset_freeze.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/000b2-public/verify_methodology.py
          test "$(git diff --cached --name-only)" = "research/000b2-public/verify_methodology.py"
          git diff --cached --check
          git commit -m "test(000b2): bind B2P04 canonical evidence identities"
          git push origin HEAD:docs/000b2-b2p04-frontier-reconciliation
