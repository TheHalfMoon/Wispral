name: 000B2 Public Corpus Attempt Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-attempt-recovery.yml'
      - 'research/000b1/frozen-methodology.json'
      - 'research/000b2-public/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/000b2-public-attempt-recovery.yml'
      - 'research/000b1/frozen-methodology.json'
      - 'research/000b2-public/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'

permissions:
  actions: read
  contents: read

concurrency:
  group: 000b2-attempt-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-legacy-recovery-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      DISCOVERY_MAIN: dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          git rev-parse --verify "${DISCOVERY_MAIN}^{commit}"
          echo "EXACT_REVISION=$EXACT_REVISION"

      - name: Preserve ATTEMPT-002 legacy recovery authority as history
        run: |
          set -euo pipefail
          if test -e research/000b2-public/recovery-attempt-003-readiness.json; then
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              'research/000b2-public/attempt-001-invalidation.json': '6fa37d9e6863a9a8f5f7512b09da45dd679ea389',
              'research/000b2-public/recovery-readiness.json': '77159639a4f2ab6d5f9e566ed120388ad76944ef',
              'research/000b2-public/verify_attempt_001_invalidation.py': 'f4c3bd7380f6faaf37ca73b2f7f05a6114ecab85',
              'specs/000B2-public-corpus-bakeoff/recovery.md': '6400080d41e4d816ba37f4e44d2ae9689f49296e',
              'specs/000B2-public-corpus-bakeoff/tasks.md': 'b6a101ea7c71085160ea43048203070cb3773954',
          }
          for path, blob in expected.items():
              actual = subprocess.run(
                  ['git', 'rev-parse', f'HEAD:{path}'],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              ).stdout.strip()
              if actual != blob:
                  raise SystemExit(f'legacy recovery history drift at {path}: {actual} != {blob}')

          state = json.loads(Path('research/000b2-public/recovery-readiness.json').read_text(encoding='utf-8'))
          if state.get('active_recovery_unit') != 'B2R10':
              raise SystemExit('legacy ATTEMPT-002 snapshot no longer records B2R10 at invalidation')
          if state.get('completed_recovery_tasks') != [f'B2R{i:02d}' for i in range(1, 10)]:
              raise SystemExit('legacy ATTEMPT-002 completion prefix drift')

          successor = json.loads(Path('research/000b2-public/recovery-attempt-003-readiness.json').read_text(encoding='utf-8'))
          historical = successor.get('historical_recovery_snapshot', {})
          if historical.get('active_execution_authority') is not False:
              raise SystemExit('successor state must explicitly retire legacy ATTEMPT-002 execution authority')
          print('LEGACY_ATTEMPT_002_RECOVERY_HISTORY=PASS')
          print('LEGACY_ATTEMPT_002_ACTIVE_EXECUTION_AUTHORITY=NO')
          PY
          else
            python -m py_compile research/000b2-public/verify_attempt_001_invalidation.py
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_001_invalidation.py --static-only --canonical-main-ref refs/remotes/origin/main
          fi

      - name: Preserve historical evidence boundary
        run: |
          set -euo pipefail
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
          test ! -e research/000b2-public/transcripts
          echo 'ATTEMPT_001_HISTORY_PRESERVED=PASS'
          echo 'ATTEMPT_002_HISTORY_PRESERVED=PASS'
