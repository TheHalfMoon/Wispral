name: 000B2 B2P04 Durable Manifest Regression

on:
  push:
    branches:
      - docs/000b2-b2p04-frontier-reconciliation
    paths:
      - '.github/workflows/000b2-b2p04-durable-manifest-regression.yml'

permissions:
  contents: write

jobs:
  add-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "4c4e758f22b54fa62256e57bfbd344adc817df8e"
          test "$(git merge-base HEAD origin/main)" = "4c4e758f22b54fa62256e57bfbd344adc817df8e"
      - name: Apply durable regression
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/.b2p04_durable_regression_patch.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_subset_freeze.py | tee "$RUNNER_TEMP/verifier.log"
          grep -F "B2P04_RECONCILED_MISSING_MANIFEST_REJECTION=PASS" "$RUNNER_TEMP/verifier.log"
          grep -F "B2P03_ABSENT_MANIFEST_PROBE=PASS" "$RUNNER_TEMP/verifier.log"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_methodology.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_subset_freeze_root_metadata.py
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/000b2-public/verify_subset_freeze.py
          git rm research/000b2-public/.b2p04_durable_regression_patch.py
          test "$(git diff --cached --name-only | sort)" = $'research/000b2-public/.b2p04_durable_regression_patch.py\nresearch/000b2-public/verify_subset_freeze.py'
          git diff --cached --check
          git commit -m "test(000b2): persist B2P04 missing-manifest regression"
          git push origin HEAD:docs/000b2-b2p04-frontier-reconciliation
