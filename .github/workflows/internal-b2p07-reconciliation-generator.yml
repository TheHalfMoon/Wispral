name: Internal B2P07 Frontier Reconciliation Generator

on:
  push:
    branches:
      - docs/000b2-reconcile-after-b2p07
    paths:
      - '.github/workflows/internal-b2p07-reconciliation-generator.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/000b2-reconcile-after-b2p07
          fetch-depth: 0

      - name: Generate reconciled state
        run: |
          set -euo pipefail
          python tools/internal_b2p07_reconcile.py
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/canonical/CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          old = '**000B2 B2P06 preprocessing-capture merge:** `3dceadd984ff307ce55745bf5f289890a2fac261`  \n'
          new = '**000B2 B2P06 preprocessing-capture merge:** `3dceadd984ff307ce55745bf5f289890a2fac261`\n'
          if text.count(old) != 1:
              raise SystemExit(f'format repair expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate reconciled repository state
        run: |
          set -euo pipefail
          python -m py_compile \
            research/000b2-public/capture_environment.py \
            research/000b2-public/verify_environment_capture.py \
            research/000b2-public/verify_candidate_revalidation.py \
            research/000b2-public/verify_preprocessing_capture.py \
            research/000b2-public/verify_subset_freeze.py \
            research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_subset_freeze.py
          python research/000b2-public/verify_preprocessing_capture.py --static-only
          python research/000b2-public/verify_environment_capture.py
          python research/000b2-public/verify_methodology.py
          git diff --check

      - name: Finalize reconciliation commit
        run: |
          set -euo pipefail
          rm .github/workflows/internal-b2p07-reconciliation-generator.yml
          rm tools/internal_b2p07_reconcile.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(000b2): reconcile frontier after B2P07"
          git push origin HEAD:docs/000b2-reconcile-after-b2p07
