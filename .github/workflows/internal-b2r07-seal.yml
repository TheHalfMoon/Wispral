        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r07-seal"
          printf '%s' "$PROVENANCE_B64" | base64 --decode > "$ROOT/b2r07-provenance.json"
          printf '%s' "$VERIFIER_B64" | base64 --decode > "$ROOT/verify_b2r07.py"
          printf '%s' "$COMPOSITE_B64" | base64 --decode > "$ROOT/verify_attempt_manifest.py"
          python -m py_compile "$ROOT/verify_b2r07.py" "$ROOT/verify_attempt_manifest.py"
          rm -rf "$ROOT/__pycache__"
          test "$(sha256sum "$ROOT/b2r07-provenance.json" | cut -d' ' -f1)" = "d331eb014316f1a3ecaa5d5a82278b39226d29381de37081b49833c80765fb22"
          test "$(sha256sum "$ROOT/verify_b2r07.py" | cut -d' ' -f1)" = "736be90376b3011c0a7bd12f44694b8ff912c75833367a4e160071e6de1470b2"
          test "$(sha256sum "$ROOT/verify_attempt_manifest.py" | cut -d' ' -f1)" = "9d2a5f568e1470070c310ba5b63f13f6e87bd7cceaf88dc0d991151ac4cd4167"
          echo "B2R07_SEALED_TEXT=PASS"

      - name: Apply evidence-only task sealing
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r07-seal"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$TASK_BRANCH:refs/remotes/origin/$TASK_BRANCH"
          git reset --hard "${{ github.sha }}"
          git switch -c b2r07-task "origin/$TASK_BRANCH"
          test "$(git rev-parse HEAD)" = "$TASK_HEAD"
          test "$(git hash-object research/000b2-public/verify_attempt_manifest.py)" = "$COMPOSITE_ORIGINAL_BLOB"

          cp "$ROOT/artifact/b2r07-whispercpp-compact.json" research/000b2-public/b2r07-whispercpp-compact.json
          cp "$ROOT/b2r07-provenance.json" research/000b2-public/b2r07-provenance.json
          cp "$ROOT/verify_b2r07.py" research/000b2-public/verify_b2r07.py
          cp "$ROOT/verify_attempt_manifest.py" research/000b2-public/verify_attempt_manifest.py

          test "$(stat -c %s research/000b2-public/b2r07-whispercpp-compact.json)" = "$EVIDENCE_SIZE"
          printf '%s  %s\n' "$EVIDENCE_SHA256" research/000b2-public/b2r07-whispercpp-compact.json | sha256sum --check -

          for path in \
            docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-readiness.json \
            specs/000B2-public-corpus-bakeoff/tasks.md \
            specs/CURRENT.md
          do
            git diff --quiet "$CANONICAL_BASE" -- "$path"
          done

          expected="$(printf '%s\n' \
            research/000b2-public/b2r07-provenance.json \
            research/000b2-public/b2r07-whispercpp-compact.json \
            research/000b2-public/decode_b2r07.py \
            research/000b2-public/run_b2r07_timeout_repair.py \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_b2r07.py \
            research/000b2-public/whispercpp-adapter/CMakeLists.txt \
            research/000b2-public/whispercpp-adapter/adapter.cpp | sort)"
          observed="$(git diff --name-only "$CANONICAL_BASE" -- | sort)"
          test "$observed" = "$expected"

          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r07.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_manifest.py
          test ! -d research/000b2-public/__pycache__

          git add \
            research/000b2-public/b2r07-provenance.json \
            research/000b2-public/b2r07-whispercpp-compact.json \
            research/000b2-public/verify_b2r07.py \
            research/000b2-public/verify_attempt_manifest.py
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            research/000b2-public/b2r07-provenance.json \
            research/000b2-public/b2r07-whispercpp-compact.json \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_b2r07.py | sort)"
          git commit -m 'research(000b2): seal B2R07 capture evidence'
          git push origin "HEAD:$TASK_BRANCH"
          echo "B2R07_TASK_HEAD=$(git rev-parse HEAD)"
          echo "B2R07_TASK_TREE=$(git rev-parse HEAD^{tree})"
