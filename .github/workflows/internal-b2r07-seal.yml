name: Internal B2R07 Evidence Seal

on:
  push:
    branches:
      - research/000b2-b2r07-execution
    paths:
      - '.github/workflows/internal-b2r07-seal.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: b2r07-evidence-seal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seal-b2r07:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANONICAL_BASE: 16104eacf2d571276452d173ddb54c089faccd0e
      TASK_BRANCH: research/000b2-b2r07-whispercpp-compact
      TASK_HEAD: aa25471247685d08bb296cdbba29b995099937ce
      CAPTURE_SOURCE_REVISION: 42434a018a1feeb599db0c64ecb836d0e4e6b909
      CAPTURE_RUN_ID: '34058440043'
      ARTIFACT_ID: '9998344092'
      ARTIFACT_ZIP_SIZE: '54261'
      ARTIFACT_ZIP_SHA256: 5991299b3349e8f53c199d1843a8304f63162443bc20faf1ebe871965890bfe3
      EVIDENCE_SIZE: '393777'
      EVIDENCE_SHA256: 80b9a21377bfd5a52f19b6f54cb1c8b933cb095c8daa3bb94081841f935dd73a
      PAYLOAD_SHA256: 53a4b3597483e04ec140b7ccbe3bd4352c291fcd470480159a995a6b9ca5b5fd
      BUILD_IDENTITY_SIZE: '1091'
      BUILD_IDENTITY_SHA256: 4888182a73a921fa574a2a4f1cf6862779687c0918d0b724622a01a69e30ff82

    steps:
      - name: Checkout exact sealing revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify live authority and immutable task input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)" = "$TASK_HEAD"
          test "$(git rev-parse "$CAPTURE_SOURCE_REVISION^{commit}")" = "$CAPTURE_SOURCE_REVISION"
          echo "B2R07_SEAL_PRECHECK=PASS"

      - name: Download and verify exact successful capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r07-seal"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/artifact"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$ROOT/artifact.zip"
          test "$(stat -c %s "$ROOT/artifact.zip")" = "$ARTIFACT_ZIP_SIZE"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$ROOT/artifact.zip" | sha256sum --check -
          unzip -q "$ROOT/artifact.zip" -d "$ROOT/artifact"
          test "$(find "$ROOT/artifact" -type f | wc -l)" -eq 2
          test -f "$ROOT/artifact/b2r07-whispercpp-compact.json"
          test -f "$ROOT/artifact/whisper-build/wispral-build-identity.json"
          test "$(stat -c %s "$ROOT/artifact/b2r07-whispercpp-compact.json")" = "$EVIDENCE_SIZE"
          printf '%s  %s\n' "$EVIDENCE_SHA256" "$ROOT/artifact/b2r07-whispercpp-compact.json" | sha256sum --check -
          test "$(stat -c %s "$ROOT/artifact/whisper-build/wispral-build-identity.json")" = "$BUILD_IDENTITY_SIZE"
          printf '%s  %s\n' "$BUILD_IDENTITY_SHA256" "$ROOT/artifact/whisper-build/wispral-build-identity.json" | sha256sum --check -
          export ROOT
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ['ROOT']) / 'artifact' / 'b2r07-whispercpp-compact.json'
          e = json.loads(p.read_text(encoding='utf-8'))
          payload = e.pop('evidence_payload_sha256')
          canonical = (json.dumps(e, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode()
          assert payload == os.environ['PAYLOAD_SHA256']
          assert hashlib.sha256(canonical).hexdigest() == os.environ['PAYLOAD_SHA256']
          assert e['run']['github_run_id'] == int(os.environ['CAPTURE_RUN_ID'])
          assert e['run']['repository_revision'] == os.environ['CAPTURE_SOURCE_REVISION']
          assert (e['execution']['input_count'], e['execution']['decoded_count'], e['execution']['failure_count']) == (240, 240, 0)
          assert e['execution']['accuracy_scoring_performed'] is False
          assert e['execution']['comparative_ranking_present'] is False
          assert e['execution_orchestration']['result_inspection_before_repair'] is False
          assert e['execution_orchestration']['c0_controls_changed'] is False
          assert e['claim_guards']['b2r08_authorized'] is False
          print('B2R07_CAPTURE_ARTIFACT_SEMANTICS=PASS')
          PY

      - name: Apply exact evidence bytes to task branch
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b2r07-seal"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$TASK_BRANCH:refs/remotes/origin/$TASK_BRANCH"
          git reset --hard "${{ github.sha }}"
          git switch -c b2r07-task "origin/$TASK_BRANCH"
          test "$(git rev-parse HEAD)" = "$TASK_HEAD"
          cp "$ROOT/artifact/b2r07-whispercpp-compact.json" research/000b2-public/b2r07-whispercpp-compact.json
          for path in \
            docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-readiness.json \
            specs/000B2-public-corpus-bakeoff/tasks.md \
            specs/CURRENT.md
          do
            git diff --quiet "$CANONICAL_BASE" -- "$path"
          done
          test "$(stat -c %s research/000b2-public/b2r07-whispercpp-compact.json)" = "$EVIDENCE_SIZE"
          printf '%s  %s\n' "$EVIDENCE_SHA256" research/000b2-public/b2r07-whispercpp-compact.json | sha256sum --check -
          git add research/000b2-public/b2r07-whispercpp-compact.json
          test "$(git diff --cached --name-only)" = 'research/000b2-public/b2r07-whispercpp-compact.json'
          git commit -m 'research(000b2): seal B2R07 capture evidence'
          git push origin "HEAD:$TASK_BRANCH"
          echo "B2R07_EVIDENCE_TASK_HEAD=$(git rev-parse HEAD)"
