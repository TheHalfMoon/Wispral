name: Internal B2P05 Reconciliation Patch

on:
  push:
    branches:
      - docs/000b2-reconcile-after-b2p05
    paths:
      - 'tools/internal_b2p05_reconcile_patch.py'
      - '.github/workflows/internal-b2p05-reconcile-patch.yml'

permissions:
  contents: write

jobs:
  patch-methodology:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b2-reconcile-after-b2p05
          fetch-depth: 0
      - name: Apply exact B2P05 reconciliation patch
        run: |
          python tools/internal_b2p05_reconcile_patch.py
          python -m py_compile research/000b2-public/verify_methodology.py
          git diff --check
      - name: Commit exact patch
        run: |
          if git diff --quiet; then
            echo 'No patch changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/000b2-public/verify_methodology.py
          git commit -m 'test(000b2): bind methodology to canonical B2P05'
          git push origin HEAD:docs/000b2-reconcile-after-b2p05
