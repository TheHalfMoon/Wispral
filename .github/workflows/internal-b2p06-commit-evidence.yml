name: Internal B2P06 Commit Immutable Evidence

on:
  push:
    branches:
      - research/000b2-b2p06-preprocessing-capture
    paths:
      - '.github/workflows/internal-b2p06-commit-evidence.yml'

permissions:
  actions: read
  contents: write

jobs:
  commit-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/000b2-b2p06-preprocessing-capture
          fetch-depth: 0
      - name: Download and verify immutable-toolchain B2P06 evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9915818321'
          EXPECTED_ZIP_SHA256: '064dd6da42f903baac9ad5bae8c92811b46a50175bff651d53c728aac363ce1c'
          EXPECTED_JSON_SHA256: 'd90e5215081191134d8e714778140bfeee8080eb77aedc3a159b2dfed6e2d011'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/b2p06-evidence"
          mkdir -p "$RUNNER_TEMP/b2p06-evidence"
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/b2p06-evidence/evidence.zip"
          test "$(sha256sum "$RUNNER_TEMP/b2p06-evidence/evidence.zip" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$RUNNER_TEMP/b2p06-evidence/evidence.zip" -d "$RUNNER_TEMP/b2p06-evidence/unpacked"
          test "$(find "$RUNNER_TEMP/b2p06-evidence/unpacked" -maxdepth 1 -type f | wc -l)" = "1"
          test -f "$RUNNER_TEMP/b2p06-evidence/unpacked/preprocessing-capture.json"
          test "$(sha256sum "$RUNNER_TEMP/b2p06-evidence/unpacked/preprocessing-capture.json" | awk '{print $1}')" = "$EXPECTED_JSON_SHA256"
          cp "$RUNNER_TEMP/b2p06-evidence/unpacked/preprocessing-capture.json" research/000b2-public/preprocessing-capture.json
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
            --evidence research/000b2-public/preprocessing-capture.json
          git diff --check
      - name: Commit exact immutable-toolchain B2P06 evidence bytes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/000b2-public/preprocessing-capture.json
          git commit -m 'research(000b2): commit immutable B2P06 preprocessing evidence'
          git push origin HEAD:research/000b2-b2p06-preprocessing-capture
