name: Internal B2R15 Reconciliation Builder

on:
  push:
    branches:
      - internal/b2r15-reconciliation-builder
    paths:
      - '.github/workflows/internal-b2r15-reconciliation-builder.yml'

permissions:
  contents: write

env:
  CANONICAL_BASE: 3d31b18823b8275c99e1478b132a64f36fad05c0
  TARGET_BRANCH: recovery/b2r15-reconcile-to-b2r16
  TARGET_EXPECTED_HEAD: 63a8a81d31840b7baefa4c7e6e968c232a78272a
  TASK_BASE: ae349f7ef28e8ffd08ee8f54d1727ef80684a31a
  QUALIFIED_HEAD: 1410cb81b59de07bdecee6b78e41fdc825f4a55d
  TASK_MERGE: 3d31b18823b8275c99e1478b132a64f36fad05c0
  RECOVERY_RUN: '34274935240'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout builder source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact live proof and immutable target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_EXPECTED_HEAD"
          test "$(git show -s --format='%P' "$TASK_MERGE")" = "$TASK_BASE $QUALIFIED_HEAD"
          python - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/Wispral/actions/runs/34274935240',
              headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
          )
          run = json.load(urllib.request.urlopen(req))
          assert run['workflow_id'] == 352653404
          assert run['path'] == '.github/workflows/000b2-public-attempt-003-recovery.yml'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == '3d31b18823b8275c99e1478b132a64f36fad05c0'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          print('B2R15_CANONICAL_PROOF=PASS')
          PY

      - name: Checkout exact reconciliation target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git switch --detach "$TARGET_EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_EXPECTED_HEAD"

      - name: Apply B2R15 canonical authority text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          task_base = 'ae349f7ef28e8ffd08ee8f54d1727ef80684a31a'
          head = '1410cb81b59de07bdecee6b78e41fdc825f4a55d'
          merge = '3d31b18823b8275c99e1478b132a64f36fad05c0'
          run = '34274935240'
          review_comment = '5591353978'

          current = Path('specs/CURRENT.md')
          text = current.read_text(encoding='utf-8')
          old_status = '**Status:** founding research active; ACP verified; B1 historical preregistration verified; public-corpus B2 methodology canonical; qualification-chronology gate `SATISFIED`; public-corpus B2 ATTEMPT-003 recovery active; corrective B2R14 canonical and post-merge verified; active successor recovery unit `B2R15`; ATTEMPT-002 invalidated; ATTEMPT-003 primary decoding closed'
          new_status = '**Status:** founding research active; ACP verified; B1 historical preregistration verified; public-corpus B2 methodology canonical; qualification-chronology gate `SATISFIED`; public-corpus B2 ATTEMPT-003 recovery active; B2R15 canonical and post-merge verified; active successor recovery unit `B2R16`; ATTEMPT-002 invalidated; ATTEMPT-003 primary decoding closed'
          if old_status not in text:
              raise SystemExit('BUILDER_FAIL: specs/CURRENT.md current status marker drift')
          text = text.replace(old_status, new_status, 1)
          marker = '## Canonical ATTEMPT-003 B2R15 preexecution-evidence reconciliation'
          if marker in text:
              raise SystemExit('BUILDER_FAIL: specs/CURRENT.md already contains B2R15 reconciliation')
          block = f'''\n\n{marker}\n\nB2R15 is canonically complete at guarded normal merge `{merge}` with first parent `{task_base}` and exact independently reviewed qualified head `{head}` as second parent. Fresh independent exact-range CodeRabbit review comment `{review_comment}` reported no actionable substantive findings before merge. Exact `main` push run `{run}` of `000B2 Public Corpus ATTEMPT-003 Recovery` (`workflow_id=352653404`, path `.github/workflows/000b2-public-attempt-003-recovery.yml`) completed successfully on that exact merge SHA. The B2R15 task rebound only ATTEMPT-003 preprocessing and execution-environment evidence to exact canonical source identities and did not perform a primary decode or scoring.\n\n**Canonical successor recovery predecessor:** `B2R15`\n**Canonical B2R15 task base:** `{task_base}`\n**Canonical B2R15 qualified head:** `{head}`\n**Canonical B2R15 task merge:** `{merge}`\n**Canonical B2R15 post-merge recovery run:** `{run}`\n**Active successor recovery unit:** `B2R16`\n**ATTEMPT-003 required:** `true`\n**ATTEMPT-003 frozen:** `false`\n**ATTEMPT-003 primary decode entry open:** `false`\n\nB2R16 alone is the next bounded action: freeze `000B2-PUBLIC-ATTEMPT-003` with exact candidate, subset, preprocessing, environment, scorer, normalization, and B2R14-qualified harness identities before any new primary decode. No primary decode or scoring is authorized by this reconciliation. B2R17 and every later successor remain unauthorized. Comparative publication/ranking, production selection, and product-code authority remain closed; `HUMAN_DEVELOPER_SPEECH_ACCURACY_EVIDENCE=ABSENT`, `production_stt_selected=false`, and `product_code_authorized=false` remain preserved.\n'''
          current.write_text(text.rstrip() + block + '\n', encoding='utf-8')

          state_path = Path('docs/canonical/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          old_tail = '; active successor recovery unit is `B2R15`; ATTEMPT-003 remains unfrozen and primary decoding is closed'
          new_tail = f'; B2R15 is canonical at guarded normal merge `{merge}` from exact independently reviewed qualified head `{head}` and post-merge ATTEMPT-003 Recovery run `{run}` succeeded; active successor recovery unit is `B2R16`; ATTEMPT-003 remains unfrozen and primary decoding is closed'
          if state.count(old_tail) != 1:
              raise SystemExit(f'BUILDER_FAIL: CURRENT_STATE current chronology tail count={state.count(old_tail)}')
          state = state.replace(old_tail, new_tail, 1)
          state_marker = '## Canonical ATTEMPT-003 B2R15 preexecution-evidence reconciliation'
          if state_marker in state:
              raise SystemExit('BUILDER_FAIL: CURRENT_STATE already contains B2R15 reconciliation')
          insertion = f'''{state_marker}\n\nB2R15 is canonically complete after PR #102 merged the exact independently reviewed five-file preexecution-evidence range as guarded normal merge `{merge}` with first parent `{task_base}` and exact qualified head `{head}` as second parent. Fresh independent exact-range CodeRabbit review comment `{review_comment}` reported no actionable substantive findings before merge. Exact `main` push run `{run}` of `000B2 Public Corpus ATTEMPT-003 Recovery` (`workflow_id=352653404`, path `.github/workflows/000b2-public-attempt-003-recovery.yml`) completed successfully on that exact merge SHA. The completed task cryptographically rebound ATTEMPT-003 preprocessing and execution-environment evidence to the exact frozen candidate, subset, scorer, normalization, C0, B2R14 harness, source-document, and source-blob identities without primary decoding or scoring.\n\n**ATTEMPT-002 status:** `INVALIDATED_MATERIAL_EXECUTION_DRIFT`\n**Successor recovery authority:** `specs/000B2-public-corpus-bakeoff/recovery-v2.md`\n**Successor machine authority:** `research/000b2-public/recovery-attempt-003-readiness.json`\n**Canonical successor recovery predecessor:** `B2R15`\n**Canonical B2R15 task base:** `{task_base}`\n**Canonical B2R15 qualified head:** `{head}`\n**Canonical B2R15 task merge:** `{merge}`\n**Canonical B2R15 post-merge recovery run:** `{run}`\n**Active successor recovery unit:** `B2R16`\n**ATTEMPT-003 required:** `true`\n**ATTEMPT-003 frozen:** `false`\n**ATTEMPT-003 primary decode entry open:** `false`\n\nB2R16 alone is the next bounded unit: freeze `000B2-PUBLIC-ATTEMPT-003` with exact candidate, subset, preprocessing, environment, scorer, normalization, and B2R14-qualified harness identities before any new primary decode. No primary decode or scoring is authorized by this reconciliation. B2R17 and every later successor remain unauthorized. Comparative publication/ranking, production selection, and product-code authority remain closed; `HUMAN_DEVELOPER_SPEECH_ACCURACY_EVIDENCE=ABSENT`, `production_stt_selected=false`, and `product_code_authorized=false` remain preserved.\n\n'''
          anchor = '## Current product thesis'
          if state.count(anchor) != 1:
              raise SystemExit(f'BUILDER_FAIL: CURRENT_STATE product-thesis anchor count={state.count(anchor)}')
          state = state.replace(anchor, insertion + anchor, 1)
          state_path.write_text(state, encoding='utf-8')
          print('B2R15_AUTHORITY_TEXT=APPLIED')
          PY

      - name: Verify exact reconciliation scope and machine state
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-attempt-003-readiness.json \
            specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md \
            specs/CURRENT.md | sort)
          actual=$(git diff --name-only "$CANONICAL_BASE" HEAD -- | sort)
          test "$actual" = "$expected"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json
          readiness = json.loads(Path('research/000b2-public/recovery-attempt-003-readiness.json').read_text(encoding='utf-8'))
          assert readiness['completed_recovery_tasks'] == ['B2R13','B2R14','B2R15']
          assert readiness['active_recovery_unit'] == 'B2R16'
          assert readiness['replacement_attempt']['frozen'] is False
          assert readiness['replacement_attempt']['primary_decode_entry_open'] is False
          assert readiness['transition_proofs'][-1] == {
              'completed_task':'B2R15',
              'canonical_task_base':'ae349f7ef28e8ffd08ee8f54d1727ef80684a31a',
              'qualified_task_head':'1410cb81b59de07bdecee6b78e41fdc825f4a55d',
              'canonical_task_merge':'3d31b18823b8275c99e1478b132a64f36fad05c0',
              'post_merge_recovery_run_id':34274935240,
              'successor_task':'B2R16',
          }
          for name in ('specs/CURRENT.md','docs/canonical/CURRENT_STATE.md'):
              text=Path(name).read_text(encoding='utf-8')
              assert '**Active successor recovery unit:** `B2R16`' in text
              assert '**ATTEMPT-003 frozen:** `false`' in text
              assert '**ATTEMPT-003 primary decode entry open:** `false`' in text
              assert '`3d31b18823b8275c99e1478b132a64f36fad05c0`' in text
              assert '`34274935240`' in text
          print('B2R15_RECONCILIATION_STATE=PASS')
          PY

      - name: Run canonical successor verifier
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_002_invalidation.py --static-only

      - name: Commit and fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_EXPECTED_HEAD"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add docs/canonical/CURRENT_STATE.md specs/CURRENT.md
          git commit -m 'docs(b2): complete B2R15 reconciliation authority'
          test "$(git rev-parse HEAD^)" = "$TARGET_EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Verify published reconciliation candidate
        shell: bash
        run: |
          set -euo pipefail
          head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$head" = "$(git rev-parse HEAD)"
          expected=$(printf '%s\n' \
            docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-attempt-003-readiness.json \
            specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md \
            specs/CURRENT.md | sort)
          test "$(git diff --name-only "$CANONICAL_BASE" "$head" -- | sort)" = "$expected"
          echo "B2R15_RECONCILIATION_HEAD=$head"
