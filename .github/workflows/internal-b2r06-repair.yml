name: Internal B2R06 Candidate-Order Repair

on:
  push:
    branches:
      - research/000b2-b2r06-execution
    paths:
      - '.github/workflows/internal-b2r06-repair.yml'

permissions:
  contents: write

concurrency:
  group: b2r06-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-b2r06:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair decoder and converge branches
        run: |
          set -euo pipefail
          python research/000b2-public/internal_b2r06_repair.py
