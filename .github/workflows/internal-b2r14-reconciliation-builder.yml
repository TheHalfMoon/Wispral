name: Internal B2R14 Corrective Reconciliation Builder

on:
  push:
    branches:
      - automation/b2r14-corrective-reconciliation-builder
    paths:
      - '.github/workflows/internal-b2r14-reconciliation-builder.yml'

permissions:
  contents: write

jobs:
  disambiguate-predecessor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc0a78c5ea4f0eee1566caa3dfed2d21aab07243
          fetch-depth: 0
          persist-credentials: true

      - name: Reverify target and disambiguate B2R13 chronology
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cc0a78c5ea4f0eee1566caa3dfed2d21aab07243"
          test "$(git ls-remote origin refs/heads/recovery/b2r14-corrective-reconcile-to-b2r15 | cut -f1)" = "cc0a78c5ea4f0eee1566caa3dfed2d21aab07243"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "e07e9bf7b7bdff3fdb41cc421140a9d6bdd8b3ca"
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/canonical/CURRENT_STATE.md")
          text = path.read_text(encoding="utf-8")
          old = "B2R14 alone is the next bounded unit: qualify the corrected sherpa-onnx result-extraction harness against the canonical deterministic synthetic non-primary fixture and exact pinned upstream source. Primary corpus access, ATTEMPT-003 primary evidence access, scoring, ranking, synthesis, production STT selection, and product-code authority remain closed. B2R15 and every later successor unit require their own exact-head qualification, independent review, guarded normal merge, post-merge recovery proof, and separate reconciliation."
          new = "At the B2R13 reconciliation frontier, B2R14 alone was the next bounded unit: qualify the corrected sherpa-onnx result-extraction harness against the canonical deterministic synthetic non-primary fixture and exact pinned upstream source while primary corpus access, ATTEMPT-003 primary evidence access, scoring, ranking, synthesis, production STT selection, and product-code authority remained closed. That B2R13-era instruction is historical and is superseded by the corrective B2R14 reconciliation below; it grants no present execution authority."
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/canonical/CURRENT_STATE.md"
          grep -F 'That B2R13-era instruction is historical and is superseded by the corrective B2R14 reconciliation below; it grants no present execution authority.' docs/canonical/CURRENT_STATE.md >/dev/null
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git switch -c work
          git add docs/canonical/CURRENT_STATE.md
          git commit -m "docs(b2): disambiguate B2R13 predecessor authority"
          test "$(git rev-parse HEAD^)" = "cc0a78c5ea4f0eee1566caa3dfed2d21aab07243"
          git push origin "HEAD:refs/heads/recovery/b2r14-corrective-reconcile-to-b2r15"
