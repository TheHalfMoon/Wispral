              '    subset_workflow = subset_workflow_path.read_text(encoding="utf-8")\n    subset_freeze_workflow = subset_freeze_workflow_path.read_text(encoding="utf-8")\n',
          )
          replace_once(verifier, 'expected_marker = "- [x]" if task_id in {"B2P01", "B2P02", "B2P03"} else "- [ ]"', 'expected_marker = "- [x]" if task_id in {"B2P01", "B2P02", "B2P03", "B2P04"} else "- [ ]"')
          replace_once(verifier, 'require_text(tasks, "- [ ] `B2P04` Freeze selected public-human subset manifest and manifest digest before candidate decoding.", "public child tasks")', 'require_text(tasks, "- [x] `B2P04` Freeze selected public-human subset manifest and manifest digest before candidate decoding.", "public child tasks")')
          replace_once(
              verifier,
