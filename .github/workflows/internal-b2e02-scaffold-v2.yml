name: Internal B2E02 Scaffold V2

on:
  push:
    branches:
      - research/000b2-b2e02-moonshine-balanced
    paths:
      - '.github/workflows/internal-b2e02-scaffold-v2.yml'

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact B2E02 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/000b2-b2e02-moonshine-balanced
          fetch-depth: 0

      - name: Derive bounded B2E02 decoder and pre-capture verifier
        shell: bash
        run: |
          set -euo pipefail
          cp research/000b2-public/decode_b2e01.py research/000b2-public/decode_b2e02.py
          git show 1a39e9c177fce1f45c46854ffc58640a35dbe2d0:research/000b2-public/verify_b2e01.py > research/000b2-public/verify_b2e02.py

          python - <<'PY'
          from pathlib import Path

          AUTHORITY = '116dbd1734e01ec1280d6b530f0cb1dec867feb1'
          OLD_AUTHORITY = '6607b1b1a13daebe1c267f82e3295be9b3bdea32'

          def task_shift(text: str) -> str:
              text = text.replace('B2E02', '__NEXT_TASK__')
              text = text.replace('B2E01', 'B2E02')
              text = text.replace('__NEXT_TASK__', 'B2E03')
              text = text.replace('b2e02', '__next_task__')
              text = text.replace('b2e01', 'b2e02')
              text = text.replace('__next_task__', 'b2e03')
              return text

          p = Path('research/000b2-public/decode_b2e02.py')
          text = task_shift(p.read_text(encoding='utf-8'))
          replacements = {
              'moonshine-compact': 'moonshine-balanced',
              OLD_AUTHORITY: AUTHORITY,
              'candidate cell 1': 'candidate cell 2',
              'candidate_ids[0]': 'candidate_ids[1]',
              'config.get("tier") == "COMPACT"': 'config.get("tier") == "BALANCED"',
              'ModelArch.SMALL_STREAMING': 'ModelArch.MEDIUM_STREAMING',
              '"cell_index": 1': '"cell_index": 2',
              '"tier": "COMPACT"': '"tier": "BALANCED"',
              'readiness.get("completed_through") == "B2P08"': 'readiness.get("completed_through") == "B2E01"',
              'B2E02 authority requires canonical completion through B2P08': 'B2E02 authority requires canonical completion through B2E01',
              'require("B2E02 is the sole current bounded execution unit" in current, "CURRENT B2E02 sole-unit authority missing")': 'require("B2E02 (`moonshine-balanced`) is the sole current bounded execution unit" in current, "CURRENT B2E02 sole-unit authority missing")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'decoder transformation anchor missing: {old}')
              text = text.replace(old, new)

          old_tasks = '''    require("- [ ] `B2E02` Decode the frozen P0 public-human subset with candidate cell 2 under C0." in tasks, "B2E02 task state drift")\n    require("- [ ] `B2E03` Decode the identical frozen P0 subset with candidate cell 2 under C0." in tasks, "B2E03 task state drift")\n'''
          new_tasks = '''    require("- [x] `B2E01` Decode the frozen P0 public-human subset with candidate cell 1 under C0." in tasks, "B2E01 predecessor task state drift")\n    require("- [ ] `B2E02` Decode the identical frozen P0 subset with candidate cell 2 under C0." in tasks, "B2E02 task state drift")\n    require("- [ ] `B2E03` Decode the identical frozen P0 subset with candidate cell 3 under C0." in tasks, "B2E03 task state drift")\n'''
          if text.count(old_tasks) != 1:
              raise SystemExit(f'decoder task block drift: {text.count(old_tasks)}')
          text = text.replace(old_tasks, new_tasks)
          p.write_text(text, encoding='utf-8')

          p = Path('research/000b2-public/verify_b2e02.py')
          text = task_shift(p.read_text(encoding='utf-8'))
          replacements = {
              'moonshine-compact': 'moonshine-balanced',
              OLD_AUTHORITY: AUTHORITY,
              'readiness.get("completed_through") == "B2P08"': 'readiness.get("completed_through") == "B2E01"',
              'pre-reconciliation readiness drift': 'pre-B2E02 readiness drift',
              'candidate.get("cell_index") == 1': 'candidate.get("cell_index") == 2',
              'candidate cell drift': 'candidate cell 2 drift',
              'candidate.get("family") == "moonshine" and candidate.get("tier") == "COMPACT"': 'candidate.get("family") == "moonshine" and candidate.get("tier") == "BALANCED"',
              'candidate.get("model_arch") == 4': 'candidate.get("model_arch") == 5',
              'require("B2E02 is the sole current bounded execution unit" in current, "CURRENT frontier drift")': 'require("B2E02 (`moonshine-balanced`) is the sole current bounded execution unit" in current, "CURRENT frontier drift")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'verifier transformation anchor missing: {old}')
              text = text.replace(old, new)

          old_tasks = '    require("- [ ] `B2E02`" in tasks and "- [ ] `B2E03`" in tasks, "execution PR self-reconciled task state")\n'
          new_tasks = '    require("- [x] `B2E01`" in tasks and "- [ ] `B2E02`" in tasks and "- [ ] `B2E03`" in tasks, "execution PR task frontier drift")\n'
          if text.count(old_tasks) != 1:
              raise SystemExit(f'verifier task block drift: {text.count(old_tasks)}')
          text = text.replace(old_tasks, new_tasks)
          p.write_text(text, encoding='utf-8')
          PY

          python -m py_compile research/000b2-public/decode_b2e02.py research/000b2-public/verify_b2e02.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e02.py --static-only

          manifest=research/000b2-public/attempt-manifest.json
          original="$RUNNER_TEMP/attempt.json"
          cp "$manifest" "$original"
          trap 'cp "$original" "$manifest"' EXIT
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/000b2-public/attempt-manifest.json')
          v = json.loads(p.read_text(encoding='utf-8'))
          v['freeze_digest_sha256'] = 'bad'
          p.write_text(json.dumps(v, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          set +e
          out=$(PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/decode_b2e02.py --work-dir "$RUNNER_TEMP/work" --preprocessed-root "$RUNNER_TEMP/pre" --output "$RUNNER_TEMP/out.json" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          test "$status" -eq 1
          grep -Fqx 'B2E02_EXECUTION=FAIL: attempt freeze digest missing or malformed' <<<"$out"
          test ! -e "$RUNNER_TEMP/out.json"
          cp "$original" "$manifest"

          grep -F 'CANDIDATE_ID = "moonshine-balanced"' research/000b2-public/decode_b2e02.py
          grep -F 'candidate_ids[1]' research/000b2-public/decode_b2e02.py
          grep -F 'ModelArch.MEDIUM_STREAMING' research/000b2-public/decode_b2e02.py
          grep -F '"cell_index": 2' research/000b2-public/decode_b2e02.py
          grep -F '"tier": "BALANCED"' research/000b2-public/decode_b2e02.py
          grep -F '"b2e03_authorized": False' research/000b2-public/decode_b2e02.py
          grep -F 'B2E03_AUTHORIZED=NO' research/000b2-public/decode_b2e02.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/000b2-public/decode_b2e02.py research/000b2-public/verify_b2e02.py
          git commit -m 'research(000b2): scaffold bounded B2E02 moonshine-balanced execution'
          git push origin HEAD:research/000b2-b2e02-moonshine-balanced
