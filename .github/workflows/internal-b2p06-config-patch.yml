name: Internal B2P06 Config Patch

on:
  push:
    branches:
      - research/000b2-b2p06-preprocessing-capture
    paths:
      - '.github/workflows/internal-b2p06-config-patch.yml'

permissions:
  contents: write

jobs:
  patch-config-verifier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/000b2-b2p06-preprocessing-capture
          fetch-depth: 0
      - name: Apply exact order-independent fail-closed patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('research/000b2-public/preprocess_subset.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '    require(len(observed_flags) == len(behavior_flags) + 1, "FFmpeg build configuration must contain exactly one ignored prefix flag")\n'
              '    require(behavior_flags == list(EXPECTED_BEHAVIOR_CONFIG_FLAGS), "FFmpeg behavior-affecting build configuration drift")\n'
              '    return {\n'
          )
          new = (
              '    require(len(observed_flags) == len(behavior_flags) + 1, "FFmpeg build configuration must contain exactly one ignored prefix flag")\n'
              '    require(len(behavior_flags) == len(set(behavior_flags)), "FFmpeg behavior configuration contains duplicate flags")\n'
              '    observed_set = set(behavior_flags)\n'
              '    expected_set = set(EXPECTED_BEHAVIOR_CONFIG_FLAGS)\n'
              '    if observed_set != expected_set:\n'
              '        missing = sorted(expected_set - observed_set)\n'
              '        extra = sorted(observed_set - expected_set)\n'
              '        raise PreprocessingError(\n'
              '            f"FFmpeg behavior-affecting build configuration drift: missing={missing!r}, extra={extra!r}, observed={behavior_flags!r}"\n'
              '        )\n'
              '    return {\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile research/000b2-public/preprocess_subset.py
          git diff --check
          git diff -- research/000b2-public/preprocess_subset.py
      - name: Commit exact patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/000b2-public/preprocess_subset.py
          git commit -m 'fix(000b2): compare FFmpeg build flags order-independently'
          git push origin HEAD:research/000b2-b2p06-preprocessing-capture
