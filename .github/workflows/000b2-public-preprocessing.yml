name: 000B2 Public Corpus Preprocessing Capture

on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-preprocessing.yml'
      - 'research/000b2-public/predecode-attempt-state.json'
      - 'research/000b2-public/preprocess_subset.py'
      - 'research/000b2-public/verify_preprocessing_capture.py'
      - 'research/000b2-public/preprocessing-capture.json'
      - 'research/000b2-public/subset-manifest.json'
      - 'research/000b2-public/freeze_subset_manifest.py'
      - 'research/000b2-public/corpus-source.json'
      - 'research/000b2-public/materialize_archives.py'
      - 'research/000b2-entry/preprocessing/contract.json'
      - 'research/000b2-entry/preprocessing/capture.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/000b2-public-preprocessing.yml'
      - 'research/000b2-public/predecode-attempt-state.json'
      - 'research/000b2-public/preprocess_subset.py'
      - 'research/000b2-public/verify_preprocessing_capture.py'
      - 'research/000b2-public/preprocessing-capture.json'
      - 'research/000b2-public/subset-manifest.json'
      - 'research/000b2-public/freeze_subset_manifest.py'
      - 'research/000b2-public/corpus-source.json'
      - 'research/000b2-public/materialize_archives.py'
      - 'research/000b2-entry/preprocessing/contract.json'
      - 'research/000b2-entry/preprocessing/capture.py'

permissions:
  contents: read

concurrency:
  group: b2p06-preprocessing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-public-corpus-preprocessing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      B2P06_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      B2P06_TOOLCHAIN_CONTAINER_IMAGE: python:3.12.11-bookworm@sha256:13c9584604a99ca134c4f41800f74ffc64ee6ac8cf555cf1e704a6087fc84f12
      B2P06_TOOLCHAIN_CONTAINER_PLATFORM: linux/amd64
      B2P06_TOOLCHAIN_CONTAINER_INDEX_DIGEST: sha256:13c9584604a99ca134c4f41800f74ffc64ee6ac8cf555cf1e704a6087fc84f12
      B2P06_TOOLCHAIN_CONTAINER_AMD64_MANIFEST_DIGEST: sha256:1b48a1b13ec678be8d84974541cc007d4367aaf01f985231daad1a940106efc0
      FFMPEG_TAG: n9.0.1
      FFMPEG_REV: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
      FFMPEG_ROOT: /evidence/toolchain
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.B2P06_REVISION }}
          persist-credentials: false

      - name: Pull exact immutable B2P06 toolchain container
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/b2p06"
          mkdir -p "$RUNNER_TEMP/b2p06/home"
          docker pull --platform linux/amd64 "$B2P06_TOOLCHAIN_CONTAINER_IMAGE"
          test "$(docker image inspect "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" --format '{{.Architecture}}')" = "amd64"
          docker image inspect "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" --format '{{json .RepoDigests}}' \
            | grep -F "$B2P06_TOOLCHAIN_CONTAINER_INDEX_DIGEST"

      - name: Verify exact revision and static B2P06 frontier inside immutable container
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B2P06_REVISION"
          docker run --rm --platform linux/amd64 --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e B2P06_REVISION \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2p06:/evidence" \
            -w /workspace \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              test "$(git rev-parse HEAD)" = "$B2P06_REVISION"
              test "$(python -c '"'"'import platform; print(platform.python_version())'"'"')" = "3.12.11"
              python -m py_compile \
                research/000b2-public/preprocess_subset.py \
                research/000b2-public/verify_preprocessing_capture.py
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py --static-only
              echo "B2P06_EXACT_REVISION=$B2P06_REVISION"
            '

      - name: Fetch exact FFmpeg release inside immutable container
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -e FFMPEG_TAG \
            -e FFMPEG_REV \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2p06:/evidence" \
            -w /workspace \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              rm -rf "$FFMPEG_ROOT"
              mkdir -p "$FFMPEG_ROOT"
              SRC="$FFMPEG_ROOT/FFmpeg"
              git init "$SRC"
              git -C "$SRC" remote add origin https://github.com/FFmpeg/FFmpeg.git
              git -C "$SRC" fetch --depth=1 origin "refs/tags/$FFMPEG_TAG:refs/tags/$FFMPEG_TAG"
              test "$(git -C "$SRC" rev-list -n1 "$FFMPEG_TAG")" = "$FFMPEG_REV"
              git -C "$SRC" checkout --detach "$FFMPEG_REV"
              test "$(git -C "$SRC" rev-parse HEAD)" = "$FFMPEG_REV"
              test "$(git -C "$SRC" describe --tags --always)" = "$FFMPEG_TAG"
            '

      - name: Build bounded exact FFmpeg with network disabled
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$RUNNER_TEMP/b2p06:/evidence" \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              SRC="$FFMPEG_ROOT/FFmpeg"
              PREFIX="$FFMPEG_ROOT/install"
              cd "$SRC"
              ./configure \
                --prefix="$PREFIX" \
                --disable-everything \
                --disable-doc \
                --disable-debug \
                --disable-ffplay \
                --disable-ffprobe \
                --disable-network \
                --disable-autodetect \
                --disable-x86asm \
                --enable-protocol=file \
                --enable-demuxer=flac,wav \
                --enable-muxer=wav \
                --enable-decoder=flac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
                --enable-encoder=pcm_s16le \
                --enable-parser=flac \
                --enable-filter=aresample,aformat \
                --enable-swresample
              make -j2 ffmpeg
              make install
              "$PREFIX/bin/ffmpeg" -version | head -n 1
            '

      - name: Execute exact B2P06 preprocessing capture inside immutable container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b2p06/work"
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2p06:/evidence" \
            -w /workspace \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/preprocess_subset.py \
                --ffmpeg "$FFMPEG_ROOT/install/bin/ffmpeg" \
                --work-dir /evidence/work \
                --output /evidence/preprocessing-capture.json
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
                --evidence /evidence/preprocessing-capture.json
            '

      - name: Upload bounded B2P06 evidence candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2p06-preprocessing-${{ env.B2P06_REVISION }}
          path: ${{ runner.temp }}/b2p06/preprocessing-capture.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require byte-identical committed B2P06 evidence
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2p06:/evidence:ro" \
            -w /workspace \
            "$B2P06_TOOLCHAIN_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
                --compare-committed /evidence/preprocessing-capture.json
            '

      - name: Remove transient corpus, preprocessed audio, and FFmpeg build
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/b2p06"
          test ! -e research/000b2-public/raw
