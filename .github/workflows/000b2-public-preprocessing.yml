name: 000B2 Public Corpus Preprocessing Capture

on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-preprocessing.yml'
      - 'research/000b2-public/predecode-attempt-state.json'
      - 'research/000b2-public/preprocess_subset.py'
      - 'research/000b2-public/verify_preprocessing_capture.py'
      - 'research/000b2-public/preprocessing-capture.json'
      - 'research/000b2-public/subset-manifest.json'
      - 'research/000b2-public/freeze_subset_manifest.py'
      - 'research/000b2-public/corpus-source.json'
      - 'research/000b2-public/materialize_archives.py'
      - 'research/000b2-entry/preprocessing/contract.json'
      - 'research/000b2-entry/preprocessing/capture.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/000b2-public-preprocessing.yml'
      - 'research/000b2-public/predecode-attempt-state.json'
      - 'research/000b2-public/preprocess_subset.py'
      - 'research/000b2-public/verify_preprocessing_capture.py'
      - 'research/000b2-public/preprocessing-capture.json'
      - 'research/000b2-public/subset-manifest.json'
      - 'research/000b2-public/freeze_subset_manifest.py'
      - 'research/000b2-public/corpus-source.json'
      - 'research/000b2-public/materialize_archives.py'
      - 'research/000b2-entry/preprocessing/contract.json'
      - 'research/000b2-entry/preprocessing/capture.py'

permissions:
  contents: read

concurrency:
  group: b2p06-preprocessing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-public-corpus-preprocessing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      B2P06_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      FFMPEG_TAG: n9.0.1
      FFMPEG_REV: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
      FFMPEG_ROOT: /home/runner/wispral-b2p06-toolchain
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.B2P06_REVISION }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact revision and static B2P06 frontier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B2P06_REVISION"
          test "$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          python -m py_compile \
            research/000b2-public/preprocess_subset.py \
            research/000b2-public/verify_preprocessing_capture.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py --static-only
          echo "B2P06_EXACT_REVISION=$B2P06_REVISION"
      - name: Fetch exact FFmpeg release tag and source revision
        run: |
          set -euo pipefail
          rm -rf "$FFMPEG_ROOT"
          mkdir -p "$FFMPEG_ROOT"
          SRC="$FFMPEG_ROOT/FFmpeg"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C "$SRC" fetch --depth=1 origin "refs/tags/$FFMPEG_TAG:refs/tags/$FFMPEG_TAG"
          test "$(git -C "$SRC" rev-list -n1 "$FFMPEG_TAG")" = "$FFMPEG_REV"
          git -C "$SRC" checkout --detach "$FFMPEG_REV"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$FFMPEG_REV"
          test "$(git -C "$SRC" describe --tags --always)" = "$FFMPEG_TAG"
      - name: Build bounded exact FFmpeg with FLAC input and PCM-WAV output
        run: |
          set -euo pipefail
          SRC="$FFMPEG_ROOT/FFmpeg"
          PREFIX="$FFMPEG_ROOT/install"
          cd "$SRC"
          ./configure \
            --prefix="$PREFIX" \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-network \
            --disable-autodetect \
            --disable-x86asm \
            --enable-protocol=file \
            --enable-demuxer=flac,wav \
            --enable-muxer=wav \
            --enable-decoder=flac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
            --enable-encoder=pcm_s16le \
            --enable-parser=flac \
            --enable-filter=aresample,aformat \
            --enable-swresample
          make -j2 ffmpeg
          make install
          "$PREFIX/bin/ffmpeg" -version | head -n 1
      - name: Execute exact B2P06 preprocessing capture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b2p06/work"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/preprocess_subset.py \
            --ffmpeg "$FFMPEG_ROOT/install/bin/ffmpeg" \
            --work-dir "$RUNNER_TEMP/b2p06/work" \
            --output "$RUNNER_TEMP/b2p06/preprocessing-capture.json"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
            --evidence "$RUNNER_TEMP/b2p06/preprocessing-capture.json"
      - name: Upload bounded B2P06 evidence candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2p06-preprocessing-${{ env.B2P06_REVISION }}
          path: ${{ runner.temp }}/b2p06/preprocessing-capture.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require byte-identical committed B2P06 evidence
        run: |
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
            --compare-committed "$RUNNER_TEMP/b2p06/preprocessing-capture.json"
      - name: Remove transient corpus and preprocessed audio
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/b2p06/work"
          rm -rf "$FFMPEG_ROOT"
          test ! -e research/000b2-public/raw
