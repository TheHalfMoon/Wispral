name: 000B2 Public Corpus B2R16 Freeze
on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-b2r16-freeze.yml'
      - 'research/000b2-public/b2r16-attempt-003-manifest.json'
      - 'research/000b2-public/b2r16-preexecution-state.json'
      - 'research/000b2-public/verify_b2r16.py'
permissions:
  contents: read
jobs:
  verify-b2r16-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact B2R16 scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          actual="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/000b2-public-b2r16-freeze.yml' \
            'research/000b2-public/b2r16-attempt-003-manifest.json' \
            'research/000b2-public/b2r16-preexecution-state.json' \
            'research/000b2-public/verify_b2r16.py' | sort)"
          test "$actual" = "$expected"
      - name: Verify B2R16 ATTEMPT-003 pre-primary freeze
        run: python3 research/000b2-public/verify_b2r16.py
      - name: Verify no primary/scoring outputs introduced
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/000b2-public/b2r17-moonshine-compact.json
          test ! -e research/000b2-public/b2r24-scores.json
          echo 'B2R16_PRIMARY_DECODE=NO'
          echo 'B2R16_SCORING=NO'
