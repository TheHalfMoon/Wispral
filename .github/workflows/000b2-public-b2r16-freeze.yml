name: 000B2 Public Corpus B2R16 Freeze

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-b2r16-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASK: B2R16
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      CHECKER_SHA256: b4ad0f3ef02394e28c982100acb68a719acde0d9a137b62be662871756eefe16
      TEST_SHA256: 3b144f15d9870877e891d7847384aa058acd73a5c1fc1ab648bb6d1c04c4aae2

    steps:
      - name: Checkout exact B2R16 revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact B2R16 revision
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXACT_REVISION"
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"

      - name: Verify checker and fixture source identities before execution
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib, os
          from pathlib import Path
          for filename, variable in (("verify_b2r16_preservation.py", "CHECKER_SHA256"), ("test_b2r16_preservation.py", "TEST_SHA256")):
              data = (Path("research/000b2-public") / filename).read_bytes()
              if hashlib.sha256(data).hexdigest() != os.environ[variable]:
                  raise SystemExit("B2R16 control source digest mismatch: " + filename)
          PY

      - name: Verify historical B2R16 proof and frozen object preservation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -I research/000b2-public/verify_b2r16_preservation.py --candidate "$EXACT_REVISION"

      - name: Prove frozen-file tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -I research/000b2-public/test_b2r16_preservation.py
