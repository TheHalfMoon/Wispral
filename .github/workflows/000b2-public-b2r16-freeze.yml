name: 000B2 Public Corpus B2R16 Freeze

on:
  pull_request:
    paths:
      - "research/000b2-public/b2r16-attempt-003-manifest.json"
      - "research/000b2-public/b2r16-preexecution-state.json"
      - "research/000b2-public/verify_b2r16.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-b2r16-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASK: B2R16
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact B2R16 revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact B2R16 revision
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXACT_REVISION"
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"

      - name: Verify B2R16 ATTEMPT-003 pre-primary freeze
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r16.py --require-git
