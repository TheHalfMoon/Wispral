name: 000B2 Bounded Forward Repair

on:
  push:
    branches:
      - research/000b2-b2p04-subset-manifest-freeze
    paths:
      - '.github/workflows/000b2-forward-repair.yml'

permissions:
  contents: write

jobs:
  repair-negative-member-size-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact branch and base
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/000b2-b2p04-subset-manifest-freeze"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "c1a576db2adf67cb4b830c280e6cba80b0ae3b43"
      - name: Apply bounded negative-size guard and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          engine = Path('research/000b2-public/freeze_subset_manifest.py')
          text = engine.read_text(encoding='utf-8')
          old = '    require(not member.islnk(), f"hard-link archive member is prohibited: {member.name!r}")\n    require(member.isdir() or member.isreg(), f"special archive member is prohibited: {member.name!r}")\n    if parts == ("LibriSpeech",):\n'
          new = '    require(not member.islnk(), f"hard-link archive member is prohibited: {member.name!r}")\n    require(member.isdir() or member.isreg(), f"special archive member is prohibited: {member.name!r}")\n    if member.isreg():\n        require(member.size >= 0, f"negative regular-file size is prohibited: {member.name!r}")\n    if parts == ("LibriSpeech",):\n'
          if text.count(old) != 1:
              raise SystemExit('B2P04_FORWARD_REPAIR=FAIL: engine anchor drift')
          engine.write_text(text.replace(old, new), encoding='utf-8')

          verifier = Path('research/000b2-public/verify_subset_freeze.py')
          text = verifier.read_text(encoding='utf-8')
          old = '    fifo = tarfile.TarInfo("LibriSpeech/test-clean/fifo")\n    fifo.type = tarfile.FIFOTYPE\n    require_rejected([(fifo, None)], "test-clean", "FIFO")\n\n\ndef verify_static_boundaries() -> None:\n'
          new = '    fifo = tarfile.TarInfo("LibriSpeech/test-clean/fifo")\n    fifo.type = tarfile.FIFOTYPE\n    require_rejected([(fifo, None)], "test-clean", "FIFO")\n\n    negative_size = tarfile.TarInfo("LibriSpeech/test-clean/negative.flac")\n    negative_size.type = tarfile.REGTYPE\n    negative_size.size = -1\n    try:\n        freeze.validate_member_scope(negative_size, "test-clean")\n    except freeze.FreezeError:\n        pass\n    else:\n        raise SystemExit("B2P04_FREEZE_VERIFIER=FAIL: negative regular-file size was accepted")\n\n\ndef verify_static_boundaries() -> None:\n'
          if text.count(old) != 1:
              raise SystemExit('B2P04_FORWARD_REPAIR=FAIL: verifier regression anchor drift')
          text = text.replace(old, new)
          old = '    print("B2P04_SPECIAL_NODE_REJECTION=PASS")\n    print("B2P04_CANDIDATE_REVALIDATION_STARTED=NO")\n'
          new = '    print("B2P04_SPECIAL_NODE_REJECTION=PASS")\n    print("B2P04_NEGATIVE_SIZE_REJECTION=PASS")\n    print("B2P04_CANDIDATE_REVALIDATION_STARTED=NO")\n'
          if text.count(old) != 1:
              raise SystemExit('B2P04_FORWARD_REPAIR=FAIL: verifier output anchor drift')
          verifier.write_text(text.replace(old, new), encoding='utf-8')
          print('B2P04_FORWARD_REPAIR=APPLIED')
          PY
      - name: Run offline verifier after repair
        run: PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_subset_freeze.py
      - name: Commit forward-only repair and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/000b2-forward-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research/000b2-public/freeze_subset_manifest.py \
            research/000b2-public/verify_subset_freeze.py \
            .github/workflows/000b2-forward-repair.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git commit -m "fix(000b2): reject negative tar member sizes"
          git push origin "HEAD:research/000b2-b2p04-subset-manifest-freeze"
