name: Internal B2E02 Public C0 Capture

on:
  push:
    branches:
      - research/000b2-b2e02-moonshine-balanced
    paths:
      - '.github/workflows/internal-b2e02-capture.yml'
      - 'research/000b2-public/decode_b2e02.py'
      - 'research/000b2-public/verify_b2e02.py'

permissions:
  contents: read

concurrency:
  group: b2e02-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-b2e02:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      B2E02_REVISION: ${{ github.sha }}
      B2E02_CONTAINER_IMAGE: python:3.12.11-bookworm@sha256:13c9584604a99ca134c4f41800f74ffc64ee6ac8cf555cf1e704a6087fc84f12
      FFMPEG_TAG: n9.0.1
      FFMPEG_REV: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
      FFMPEG_ROOT: /evidence/toolchain
    steps:
      - name: Checkout exact B2E02 source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.B2E02_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pull exact immutable execution container
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/b2e02"
          mkdir -p "$RUNNER_TEMP/b2e02/home" "$RUNNER_TEMP/b2e02/work"
          docker pull --platform linux/amd64 "$B2E02_CONTAINER_IMAGE"
          test "$(docker image inspect "$B2E02_CONTAINER_IMAGE" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$B2E02_CONTAINER_IMAGE" --format '{{.Architecture}}')" = "amd64"

      - name: Verify exact revision and static B2E02 authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B2E02_REVISION"
          docker run --rm --platform linux/amd64 --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e B2E02_REVISION \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2e02:/evidence" \
            -w /workspace \
            "$B2E02_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              test "$(git rev-parse HEAD)" = "$B2E02_REVISION"
              test "$(python -c '"'"'import platform; print(platform.python_version())'"'"')" = "3.12.11"
              mkdir -p /evidence/pycache
              PYTHONPYCACHEPREFIX=/evidence/pycache python -m py_compile \
                research/000b2-public/decode_b2e02.py \
                research/000b2-public/verify_b2e02.py
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e02.py --static-only
            '

      - name: Fetch exact FFmpeg release
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -e FFMPEG_TAG \
            -e FFMPEG_REV \
            -v "$RUNNER_TEMP/b2e02:/evidence" \
            "$B2E02_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              rm -rf "$FFMPEG_ROOT"
              mkdir -p "$FFMPEG_ROOT"
              SRC="$FFMPEG_ROOT/FFmpeg"
              git init "$SRC"
              git -C "$SRC" remote add origin https://github.com/FFmpeg/FFmpeg.git
              git -C "$SRC" fetch --depth=1 origin "refs/tags/$FFMPEG_TAG:refs/tags/$FFMPEG_TAG"
              test "$(git -C "$SRC" rev-list -n1 "$FFMPEG_TAG")" = "$FFMPEG_REV"
              git -C "$SRC" checkout --detach "$FFMPEG_REV"
            '

      - name: Build bounded FFmpeg 9.0.1 preprocessing tool
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$RUNNER_TEMP/b2e02:/evidence" \
            "$B2E02_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              SRC="$FFMPEG_ROOT/FFmpeg"
              PREFIX="$FFMPEG_ROOT/install"
              cd "$SRC"
              ./configure \
                --prefix="$PREFIX" \
                --disable-everything \
                --disable-doc \
                --disable-debug \
                --disable-ffplay \
                --disable-ffprobe \
                --disable-network \
                --disable-autodetect \
                --disable-x86asm \
                --enable-protocol=file \
                --enable-demuxer=flac,wav \
                --enable-muxer=wav \
                --enable-decoder=flac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
                --enable-encoder=pcm_s16le \
                --enable-parser=flac \
                --enable-filter=aresample,aformat \
                --enable-swresample
              make -j2 ffmpeg
              make install
              "$PREFIX/bin/ffmpeg" -version | head -n 1
            '

      - name: Reproduce exact frozen P0 preprocessing bytes
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2e02:/evidence" \
            -w /workspace \
            "$B2E02_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/preprocess_subset.py \
                --ffmpeg "$FFMPEG_ROOT/install/bin/ffmpeg" \
                --work-dir /evidence/work \
                --output /evidence/preprocessing-capture.json
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
                --compare-committed /evidence/preprocessing-capture.json
            '

      - name: Execute B2E02 moonshine-balanced C0 decode
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_JOB \
            -e RUNNER_OS \
            -e RUNNER_ARCH \
            -e B2E02_CONTAINER_IMAGE \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2e02:/evidence" \
            -w /workspace \
            "$B2E02_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              python -m pip install --disable-pip-version-check --no-input "moonshine-voice==0.1.5"
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/decode_b2e02.py \
                --work-dir /evidence/moonshine \
                --preprocessed-root /evidence/work/preprocessed \
                --output /evidence/b2e02-moonshine-balanced.json
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e02.py \
                --evidence /evidence/b2e02-moonshine-balanced.json
            '

      - name: Upload bounded B2E02 execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2e02-moonshine-balanced-${{ env.B2E02_REVISION }}
          path: ${{ runner.temp }}/b2e02/b2e02-moonshine-balanced.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove transient corpus, model cache, and toolchain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/b2e02"
          test ! -e research/000b2-public/raw
