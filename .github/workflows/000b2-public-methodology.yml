name: 000B2 Public Corpus Methodology

on:
  pull_request:
    paths:
      - 'specs/000B-stt-entity-bakeoff/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/000-founding-research/tasks.md'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
      - 'research/000b2-public/**'
      - '.github/workflows/000b2-public-methodology.yml'
      - '.github/workflows/000b2-public-materialization.yml'
  push:
    branches:
      - main
    paths:
      - 'specs/000B-stt-entity-bakeoff/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/000-founding-research/tasks.md'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
      - 'research/000b2-public/**'
      - '.github/workflows/000b2-public-methodology.yml'
      - '.github/workflows/000b2-public-materialization.yml'

permissions:
  contents: read

jobs:
  verify-public-corpus-methodology:
    runs-on: ubuntu-latest
    env:
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_REVISION }}
      - name: Verify exact revision identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          echo "EXACT_REVISION=$EXACT_REVISION"
      - name: Verify workflow contracts
        run: python research/000b2-public/verify_workflow_contracts.py
      - name: Verify methodology contract
        run: python research/000b2-public/verify_methodology.py
