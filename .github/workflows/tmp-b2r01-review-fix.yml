name: Temporary B2R01 review repair

on:
  push:
    branches:
      - research/000b2-reconcile-b2r01
    paths:
      - '.github/workflows/tmp-b2r01-review-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch canonical main
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "715efc4855fb52187ed250b11f0c28bb2c2c0660"

      - name: Repair stale active-authority sentence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('specs/CURRENT.md')
          text = path.read_text(encoding='utf-8')
          old = 'B2P02 is canonical and post-merge verified. B2P03 deterministic subset-selection logic is canonical and post-merge verified at merge `83eca872148f329033c299f6671d275edf2d7b58`. B2P04 deterministic source-membership freeze is canonical and post-merge verified at merge `4c4e758f22b54fa62256e57bfbd344adc817df8e` with manifest byte SHA-256 `5fa108dc623760f194fdde463cbfb819288fe8f2a10279d25ec889f221b389bb` and freeze digest `f75a1084e8414e56a47b00350d5a7c1295445e2c52b03a0f591c40c041c9f242`. B2P05 candidate identity revalidation is canonical and post-merge verified at merge `49538990fb4cf8223e9321261925206ed7ff5cee`. B2P06 attempt-bound preprocessing capture is canonical and post-merge verified at merge `3dceadd984ff307ce55745bf5f289890a2fac261` with evidence SHA-256 `d90e5215081191134d8e714778140bfeee8080eb77aedc3a159b2dfed6e2d011`. B2P07 attempt-bound execution-environment capture is canonical and post-merge verified at merge `4bd5306fa1d274d7b822b73e26172dd9c7058319` with preserved raw/seal ancestry and `DIAGNOSTIC` performance semantics. B2P08 is canonical and post-merge verified. B2E01 and B2E02 are canonical. B2E03 (`whispercpp-compact`) is now the only authorized bounded unit; B2E04 and all later candidate cells remain unauthorized until B2E03 is separately qualified, merged, post-merge verified, and reconciled.'
          new = 'B2P02 is canonical and post-merge verified. B2P03 deterministic subset-selection logic is canonical and post-merge verified at merge `83eca872148f329033c299f6671d275edf2d7b58`. B2P04 deterministic source-membership freeze is canonical and post-merge verified at merge `4c4e758f22b54fa62256e57bfbd344adc817df8e` with manifest byte SHA-256 `5fa108dc623760f194fdde463cbfb819288fe8f2a10279d25ec889f221b389bb` and freeze digest `f75a1084e8414e56a47b00350d5a7c1295445e2c52b03a0f591c40c041c9f242`. B2P05 candidate identity revalidation is canonical and post-merge verified at merge `49538990fb4cf8223e9321261925206ed7ff5cee`. B2P06 attempt-bound preprocessing capture is canonical and post-merge verified at merge `3dceadd984ff307ce55745bf5f289890a2fac261` with evidence SHA-256 `d90e5215081191134d8e714778140bfeee8080eb77aedc3a159b2dfed6e2d011`. B2P07 attempt-bound execution-environment capture is canonical and post-merge verified at merge `4bd5306fa1d274d7b822b73e26172dd9c7058319` with preserved raw/seal ancestry and `DIAGNOSTIC` performance semantics. B2P08 is canonical and post-merge verified. B2E01 and B2E02 remain canonical historical ATTEMPT-001 executions. B2R01 invalidated ATTEMPT-001 for material execution drift, so B2E03 and every later ATTEMPT-001 primary decode are closed; B2R02 is the sole current bounded recovery unit.'
          if text.count(old) != 1:
              raise SystemExit(f'REVIEW_REPAIR_FAIL expected one stale authority anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('B2R01_REVIEW_FINDING_REPAIR=PASS')
          PY

      - name: Create repaired candidate commit without helper
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-b2r01-review-fix.yml
          git add specs/CURRENT.md
          git commit -m "docs(000b2): remove stale B2E03 active authority"

      - name: Verify review finding is resolved and scope remains exact
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('specs/CURRENT.md').read_text(encoding='utf-8')
          phrase = 'B2E03 (`whispercpp-compact`) is now the only authorized bounded unit'
          assert text.count(phrase) == 1, text.count(phrase)
          historical = text.index('### Historical ATTEMPT-001 post-B2E02 snapshot wording — non-authoritative')
          occurrence = text.index(phrase)
          next_action = text.index('## Next canonical action')
          assert historical < occurrence < next_action
          assert phrase not in text[:historical]
          assert phrase not in text[next_action:]
          print('B2R01_STALE_ACTIVE_AUTHORITY_REMOVED=PASS')
          PY
          mapfile -t changed < <(git diff --name-only refs/remotes/origin/main...HEAD | sort)
          expected=(
            'docs/canonical/CURRENT_STATE.md'
            'research/000b2-public/recovery-readiness.json'
            'specs/000B2-public-corpus-bakeoff/tasks.md'
            'specs/CURRENT.md'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          echo 'B2R01_RECONCILIATION_SCOPE=PASS'

      - name: Reverify historical and recovery gates
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_methodology.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_subset_freeze.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_manifest.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e01.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e02.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_001_invalidation.py \
            --static-only \
            --canonical-main-ref refs/remotes/origin/main
          echo 'B2R01_REVIEW_REPAIR_COMBINED_QUALIFICATION=PASS'

      - name: Push repaired candidate
        run: |
          set -euo pipefail
          git push origin HEAD:research/000b2-reconcile-b2r01
