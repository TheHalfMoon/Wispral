name: 000B2 Trusted Participant Policy

on:
  pull_request:
    paths:
      - '.github/trusted/verify_000b2_participant_policy.py'
      - '.github/workflows/000b2-trusted-participant-policy.yml'
      - 'research/000b2-entry/authority/authority-package.json'
      - 'research/000b2-entry/authority/authority-policy-freeze.json'
      - 'research/000b2-entry/readiness.json'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/trusted/verify_000b2_participant_policy.py'
      - '.github/workflows/000b2-trusted-participant-policy.yml'
      - 'research/000b2-entry/authority/authority-package.json'
      - 'research/000b2-entry/authority/authority-policy-freeze.json'
      - 'research/000b2-entry/readiness.json'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head for trusted-policy bootstrap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify bootstrap checkout matches exact PR head
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$EVENT_HEAD_SHA" ]; then
            echo "trusted-policy bootstrap exact-head mismatch: event=$EVENT_HEAD_SHA checkout=$CHECKED_OUT_SHA" >&2
            exit 1
          fi
          echo "EXACT_PR_HEAD_SHA=$CHECKED_OUT_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile trusted participant-policy verifier
        run: |
          python -m py_compile .github/trusted/verify_000b2_participant_policy.py
          python -m py_compile research/000b2-entry/authority/verify_authority.py
          python -m py_compile research/000b2-entry/authority/verify_consent_records.py
      - name: Exercise trusted participant-policy self-test
        run: |
          python .github/trusted/verify_000b2_participant_policy.py \
            --base-root . \
            --self-test
      - name: Verify current bootstrap state remains non-authorizing
        run: |
          OUTPUT="$(python .github/trusted/verify_000b2_participant_policy.py \
            --base-root . \
            --candidate-root .)"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -Fx 'PARTICIPANT_POLICY=NOT_YET_CANONICAL'
          printf '%s\n' "$OUTPUT" | grep -Fx 'AUTHORITY_PACKAGE=NOT_AUTHORIZED'
          printf '%s\n' "$OUTPUT" | grep -Fx 'PARTICIPANT_CONSENT_ATTESTATION=NOT_PROVIDED_BY_THIS_GATE'
          printf '%s\n' "$OUTPUT" | grep -Fx 'B2_PRIMARY_RECORDING_AUTHORIZED=NO'
          printf '%s\n' "$OUTPUT" | grep -Fx 'B2_READY=NO'
      - name: Verify trusted workflow bootstrap invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/000b2-trusted-participant-policy.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'pull_request_target:',
              "github.event.pull_request.base.ref == 'main'",
              'Checkout live canonical base participant-policy authority',
              'Checkout exact PR head for trusted-policy bootstrap',
              'trusted-base/.github/trusted/verify_000b2_participant_policy.py',
              'PARTICIPANT_CONSENT_ATTESTATION=NOT_PROVIDED_BY_THIS_GATE',
              '--reverify-open-prs',
              'actions/checkout@11d5960a326750d5838078e36cf38b85af677262',
              'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'trusted participant-policy workflow bootstrap drift: {missing}')
          uses = []
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith(('- uses:', 'uses:')):
                  uses.append(stripped.split('uses:', 1)[1].strip())
          if not uses:
              raise SystemExit('trusted participant-policy workflow has no action uses entries')
          bad = [item for item in uses if re.fullmatch(r'[^@\s]+@[0-9a-f]{40}', item) is None]
          if bad:
              raise SystemExit(f'trusted participant-policy workflow has non-pinned action uses: {bad}')
          print('TRUSTED_PARTICIPANT_POLICY_BOOTSTRAP=PASS')
          PY

  verify-candidate-policy-from-live-base:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout live canonical base participant-policy authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted-base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve exact trusted policy boundary
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA="$(git -C trusted-base rev-parse HEAD)"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "live canonical policy base SHA malformed: $BASE_SHA" >&2
            exit 1
          fi
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate policy head SHA malformed: $EVENT_HEAD_SHA" >&2
            exit 1
          fi
          echo "TRUSTED_BASE_SHA=$BASE_SHA"
          echo "CANDIDATE_HEAD_SHA=$EVENT_HEAD_SHA"
      - name: Verify exact candidate policy data with live canonical verifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python trusted-base/.github/trusted/verify_000b2_participant_policy.py \
            --base-root trusted-base \
            --repo "$REPOSITORY" \
            --head-sha "$CANDIDATE_HEAD_SHA"
          echo 'PARTICIPANT_CONSENT_ATTESTATION=NOT_PROVIDED_BY_THIS_GATE'
          echo 'PRIMARY_MEDIA_ACCEPTANCE=NO'

  verify-canonical-and-open-prs-after-base-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted-base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify new canonical participant-policy base remains fail-closed
        run: |
          python trusted-base/.github/trusted/verify_000b2_participant_policy.py \
            --base-root trusted-base \
            --candidate-root trusted-base
          echo 'PARTICIPANT_CONSENT_ATTESTATION=NOT_PROVIDED_BY_THIS_GATE'
      - name: Reverify every open main-targeting PR against canonical participant-policy authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python trusted-base/.github/trusted/verify_000b2_participant_policy.py \
            --base-root trusted-base \
            --repo "$REPOSITORY" \
            --reverify-open-prs
