name: Internal B2P08 Attempt Freeze Bootstrap

on:
  push:
    branches:
      - research/000b2-b2p08-attempt-freeze
    paths:
      - '.github/workflows/internal-b2p08-attempt-freeze-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/000b2-b2p08-attempt-freeze
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic B2P08 manifest
        run: |
          python research/000b2-public/freeze_attempt_manifest.py \
            --output research/000b2-public/attempt-manifest.json
          python research/000b2-public/verify_public_wer.py
          python research/000b2-public/verify_attempt_manifest.py
          git diff --check
      - name: Commit final B2P08 execution surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/internal-b2p08-attempt-freeze-bootstrap.yml
          git add \
            .github/workflows/000b2-public-attempt-freeze.yml \
            research/000b2-public/freeze_attempt_manifest.py \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/score_public_wer.py \
            research/000b2-public/verify_public_wer.py \
            research/000b2-public/attempt-manifest.json
          git diff --cached --check
          git commit -m "research(000b2): freeze B2P08 pre-decode attempt"
          git push origin HEAD:research/000b2-b2p08-attempt-freeze
