name: Temporary recovery authority precedence patch

on:
  push:
    branches:
      - fix/000b2-recovery-authority-precedence
    paths:
      - '.github/workflows/tmp-recovery-authority-precedence-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply fail-closed recovery precedence repair
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_FAIL {path}: expected one anchor, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # verify_methodology.py: preserve the ATTEMPT-001 readiness snapshot while
          # making the active authority checks follow recovery-readiness.json.
          path = "research/000b2-public/verify_methodology.py"
          replace_once(
              path,
              '    readiness_path = ROOT / "research/000b2-public/readiness.json"\n',
              '    readiness_path = ROOT / "research/000b2-public/readiness.json"\n'
              '    recovery_readiness_path = ROOT / "research/000b2-public/recovery-readiness.json"\n',
          )
          replace_once(
              path,
              '        readiness_path, corpus_source_path, materialization_path, materializer_path,\n',
              '        readiness_path, recovery_readiness_path, corpus_source_path, materialization_path, materializer_path,\n',
          )
          methodology_recovery_block = '''\n\n    recovery = load_object(recovery_readiness_path, "recovery readiness")
    recovery_tasks = tuple(f"B2R{index:02d}" for index in range(1, 13))
    recovery_completed = recovery.get("completed_recovery_tasks")
    require(isinstance(recovery_completed, list), "recovery completed-task ledger must be a list")
    require(
        recovery_completed == list(recovery_tasks[: len(recovery_completed)]),
        "recovery completed-task ledger must be a contiguous prefix",
    )
    recovery_active = recovery_tasks[len(recovery_completed)] if len(recovery_completed) < len(recovery_tasks) else None
    expected_recovery_state = (
        "RECOVERY_PENDING_CANONICALIZATION"
        if not recovery_completed
        else "RECOVERY_READY"
        if recovery_active is not None
        else "RECOVERY_COMPLETE"
    )
    require(recovery.get("schema_version") == "000b2-public-recovery-readiness-v2", "recovery readiness schema drift")
    require(recovery.get("lane") == "PUBLIC_CORPUS", "recovery readiness lane drift")
    require(recovery.get("state") == expected_recovery_state, "recovery readiness state drift")
    require(
        recovery.get("authority_precedence") == "OVERRIDES_ATTEMPT_001_READY_SNAPSHOT_FOR_NEW_EXECUTION",
        "recovery authority precedence drift",
    )
    require(recovery.get("active_recovery_unit") == recovery_active, "recovery active unit drift")
    invalidated_attempt = recovery.get("invalidated_attempt")
    require(isinstance(invalidated_attempt, dict), "invalidated attempt recovery boundary missing")
    require(invalidated_attempt.get("attempt_id") == "000B2-PUBLIC-ATTEMPT-001", "invalidated attempt id drift")
    require(invalidated_attempt.get("comparative_scoring_eligible") is False, "invalidated attempt scoring authority reopened")
    require(invalidated_attempt.get("candidate_superiority_claim_eligible") is False, "invalidated attempt superiority authority reopened")
    require(invalidated_attempt.get("new_primary_decode_authorized") is False, "ATTEMPT-001 primary decode authority reopened")
    replacement_attempt = recovery.get("replacement_attempt")
    require(isinstance(replacement_attempt, dict), "replacement attempt recovery boundary missing")
    require(replacement_attempt.get("attempt_id") == "000B2-PUBLIC-ATTEMPT-002", "replacement attempt id drift")
    require(replacement_attempt.get("required") is True, "replacement attempt requirement weakened")
    require(replacement_attempt.get("frozen") is (len(recovery_completed) >= 4), "replacement attempt freeze state drift")
    require(
        replacement_attempt.get("primary_decode_entry_open") is (recovery_active in set(recovery_tasks[4:10])),
        "replacement attempt primary-entry authority drift",
    )
    recovery_next_action = recovery.get("next_action")
    require(isinstance(recovery_next_action, str) and recovery_next_action, "recovery next action missing")
    if recovery_active is not None:
        require(recovery_active in recovery_next_action, "recovery next action does not bind the active recovery unit")
    if len(recovery_completed) < 4:
        require(
            "primary" in recovery_next_action.lower()
            and ("closed" in recovery_next_action.lower() or "do not" in recovery_next_action.lower()),
            "pre-freeze recovery next action must keep primary decoding closed",
        )
'''
          replace_once(
              path,
              '    require(readiness.get("next_action") == expected_next_action, "next action must be exact post-B2E02 B2E03-only instruction")\n',
              '    require(readiness.get("next_action") == expected_next_action, "historical ATTEMPT-001 readiness next action drift")\n'
              + methodology_recovery_block,
          )
          old_current = '''    require_text(current, "current bounded execution unit `B2E03`", "current frontier")
    require_text(current, "Execute and canonically qualify `B2E03` only", "current frontier next action")
    require_text(current, "Execute and canonically qualify `B2E03` only: decode the identical frozen P0 public-human subset with candidate cell 3 (`whispercpp-compact`) under unchanged frozen C0", "current frontier exact B2E03 candidate/action identity")
'''
          new_current = '''    if expected_recovery_state == "RECOVERY_PENDING_CANONICALIZATION":
        require_text(current, "current bounded execution unit `B2E03`", "transitional historical current frontier")
        require_text(current, "Execute and canonically qualify `B2E03` only", "transitional historical current next action")
    else:
        recovery_label = recovery_active if recovery_active is not None else "NONE"
        require_text(current, f"**Active recovery unit:** `{recovery_label}`", "current recovery frontier")
        current_next_section = current.rsplit("## Next canonical action", 1)
        require(len(current_next_section) == 2, "CURRENT next-action section missing")
        if recovery_active is not None:
            require_text(current_next_section[1], recovery_active, "CURRENT recovery next action")
        require_text(current, "ATTEMPT-001", "current recovery historical-attempt boundary")
        require_text(current, "ATTEMPT-002", "current recovery replacement-attempt boundary")
'''
          replace_once(path, old_current, new_current)
          old_current_summary = '''    require_text(current, "B2E01 and B2E02 are canonical. B2E03 (`whispercpp-compact`) is now the only authorized bounded unit", "current frontier B2E03 baseline summary")
    require_text(current, "B2P08 pre-decode attempt freeze became canonical at merge `dd65e23d29e7f83b9a94aba9c018928c7f9cc41d`", "current frontier B2P08 active-route chronology")
    require_text(current, "B2P01 through B2P08, B2E01, and B2E02 are complete.", "current frontier post-B2E02 completion")
    require_text(current, "B2E03 (`whispercpp-compact`) is the sole current bounded execution unit.", "current frontier B2E03 active-route authority")
'''
          new_current_summary = '''    if expected_recovery_state == "RECOVERY_PENDING_CANONICALIZATION":
        require_text(current, "B2E01 and B2E02 are canonical. B2E03 (`whispercpp-compact`) is now the only authorized bounded unit", "transitional historical B2E03 summary")
        require_text(current, "B2E03 (`whispercpp-compact`) is the sole current bounded execution unit.", "transitional historical B2E03 active-route authority")
    require_text(current, "B2P08 pre-decode attempt freeze became canonical at merge `dd65e23d29e7f83b9a94aba9c018928c7f9cc41d`", "current frontier B2P08 active-route chronology")
    require_text(current, "B2P01 through B2P08, B2E01, and B2E02 are complete.", "current frontier post-B2E02 completion")
'''
          replace_once(path, old_current_summary, new_current_summary)
          old_state = '''    require_text(current_state, "current bounded execution unit is `B2E03`", "current state")
    require_text(current_state, "Execute and canonically qualify `B2E03` only", "current state next action")
    require_text(current_state, "Execute and canonically qualify `B2E03` only: decode the identical frozen P0 public-human subset with candidate cell 3 (`whispercpp-compact`) under unchanged frozen C0", "current state exact B2E03 candidate/action identity")
'''
          new_state = '''    if expected_recovery_state == "RECOVERY_PENDING_CANONICALIZATION":
        require_text(current_state, "current bounded execution unit is `B2E03`", "transitional historical current state")
        require_text(current_state, "Execute and canonically qualify `B2E03` only", "transitional historical current-state next action")
    else:
        recovery_label = recovery_active if recovery_active is not None else "NONE"
        require_text(current_state, f"**Active recovery unit:** `{recovery_label}`", "current-state recovery frontier")
        state_next_section = current_state.rsplit("## Next canonical action", 1)
        require(len(state_next_section) == 2, "CURRENT_STATE next-action section missing")
        if recovery_active is not None:
            require_text(state_next_section[1], recovery_active, "CURRENT_STATE recovery next action")
        require_text(current_state, "ATTEMPT-001", "current-state recovery historical-attempt boundary")
        require_text(current_state, "ATTEMPT-002", "current-state recovery replacement-attempt boundary")
'''
          replace_once(path, old_state, new_state)
          replace_once(
              path,
              '    print("B2E03_FRONTIER=AUTHORIZED")\n',
              '    print("B2E03_FRONTIER=CLOSED_BY_RECOVERY_PRECEDENCE")\n'
              '    print(f"RECOVERY_AUTHORITY_STATE={expected_recovery_state}")\n'
              '    print(f"RECOVERY_ACTIVE_UNIT={recovery_active if recovery_active is not None else \'NONE\'}")\n',
          )

          # Common helper body for historical gates that must defer active authority
          # to recovery-readiness.json while preserving readiness.json byte semantics.
          recovery_helper = '''\n\ndef verify_recovery_precedence(tasks: str, current: str) -> str | None:
    """Validate recovery authority without converting the historical readiness snapshot into active authority."""
    if not RECOVERY_READINESS.is_file():
        return None
    recovery = load(RECOVERY_READINESS)
    recovery_tasks = tuple(f"B2R{index:02d}" for index in range(1, 13))
    completed = recovery.get("completed_recovery_tasks")
    require(isinstance(completed, list), "recovery completed-task ledger must be a list")
    require(completed == list(recovery_tasks[: len(completed)]), "recovery completed-task ledger must be a contiguous prefix")
    active = recovery_tasks[len(completed)] if len(completed) < len(recovery_tasks) else None
    expected_state = "RECOVERY_PENDING_CANONICALIZATION" if not completed else "RECOVERY_READY" if active is not None else "RECOVERY_COMPLETE"
    require(recovery.get("schema_version") == "000b2-public-recovery-readiness-v2", "recovery readiness schema drift")
    require(recovery.get("lane") == "PUBLIC_CORPUS", "recovery readiness lane drift")
    require(recovery.get("state") == expected_state, "recovery readiness state drift")
    require(recovery.get("authority_precedence") == "OVERRIDES_ATTEMPT_001_READY_SNAPSHOT_FOR_NEW_EXECUTION", "recovery authority precedence drift")
    require(recovery.get("active_recovery_unit") == active, "recovery active unit drift")
    invalidated = recovery.get("invalidated_attempt")
    require(isinstance(invalidated, dict), "invalidated attempt recovery boundary missing")
    require(invalidated.get("attempt_id") == "000B2-PUBLIC-ATTEMPT-001", "invalidated attempt id drift")
    require(invalidated.get("comparative_scoring_eligible") is False, "invalidated ATTEMPT-001 scoring authority reopened")
    require(invalidated.get("candidate_superiority_claim_eligible") is False, "invalidated ATTEMPT-001 superiority authority reopened")
    require(invalidated.get("new_primary_decode_authorized") is False, "invalidated ATTEMPT-001 primary authority reopened")
    replacement = recovery.get("replacement_attempt")
    require(isinstance(replacement, dict), "replacement attempt recovery boundary missing")
    require(replacement.get("attempt_id") == "000B2-PUBLIC-ATTEMPT-002", "replacement attempt id drift")
    require(replacement.get("required") is True, "replacement attempt requirement weakened")
    require(replacement.get("frozen") is (len(completed) >= 4), "replacement attempt freeze state drift")
    require(replacement.get("primary_decode_entry_open") is (active in set(recovery_tasks[4:10])), "replacement attempt primary-entry authority drift")
    next_action = recovery.get("next_action")
    require(isinstance(next_action, str) and next_action, "recovery next action missing")
    if active is not None:
        require(active in next_action, "recovery next action does not bind active recovery unit")
    if len(completed) < 4:
        require("primary" in next_action.lower() and ("closed" in next_action.lower() or "do not" in next_action.lower()), "pre-freeze recovery next action must keep primary decoding closed")
    if expected_state == "RECOVERY_PENDING_CANONICALIZATION":
        require("- [ ] `B2R01`" in tasks, "B2R01 must remain pending before canonical reconciliation")
    else:
        require("- [x] `B2R01`" in tasks, "B2R01 completion lost after recovery reconciliation")
        label = active if active is not None else "NONE"
        require(f"**Active recovery unit:** `{label}`" in current, "CURRENT recovery marker drift")
        next_section = current.rsplit("## Next canonical action", 1)
        require(len(next_section) == 2, "CURRENT next-action section missing during recovery")
        if active is not None:
            require(active in next_section[1], "CURRENT next action does not bind active recovery unit")
    return expected_state
'''

          # verify_subset_freeze.py
          path = "research/000b2-public/verify_subset_freeze.py"
          replace_once(
              path,
              'READINESS_PATH = ROOT / "research/000b2-public/readiness.json"\n',
              'READINESS_PATH = ROOT / "research/000b2-public/readiness.json"\n'
              'RECOVERY_READINESS = ROOT / "research/000b2-public/recovery-readiness.json"\n',
          )
          replace_once(
              path,
              '\ndef verify_current_authority() -> str:\n',
              recovery_helper + '\n\ndef verify_current_authority() -> str:\n',
          )
          old_subset = '''        validate_b2e03_task_chain(tasks)
        verify_b2e03_task_chain_regression(tasks)
        require("current bounded execution unit `B2E03`" in current, "reconciled frontier is not B2E03-only")
        require("Execute and canonically qualify `B2E03` only" in current, "reconciled current view must authorize B2E03 only")
        require("B2E04 and all later candidate cells remain unauthorized" in current, "reconciled frontier must keep later candidate cells closed")
        return "B2E02"
'''
          new_subset = '''        validate_b2e03_task_chain(tasks)
        verify_b2e03_task_chain_regression(tasks)
        recovery_state = verify_recovery_precedence(tasks, current)
        if recovery_state is None or recovery_state == "RECOVERY_PENDING_CANONICALIZATION":
            require("current bounded execution unit `B2E03`" in current, "transitional historical frontier is not B2E03")
            require("Execute and canonically qualify `B2E03` only" in current, "transitional historical current view must name B2E03")
        require("B2E04 and all later candidate cells remain unauthorized" in current or recovery_state is not None, "historical later-cell closure missing")
        return "B2E02_RECOVERY" if recovery_state is not None else "B2E02"
'''
          replace_once(path, old_subset, new_subset)

          # verify_attempt_manifest.py
          path = "research/000b2-public/verify_attempt_manifest.py"
          replace_once(
              path,
              'READINESS_PATH = HERE / "readiness.json"\n',
              'READINESS_PATH = HERE / "readiness.json"\n'
              'RECOVERY_READINESS = HERE / "recovery-readiness.json"\n',
          )
          attempt_helper = recovery_helper.replace('def verify_recovery_precedence(tasks: str, current: str) -> str | None:', 'def verify_recovery_precedence(tasks: str, current: str) -> str | None:').replace('    recovery = load(RECOVERY_READINESS)\n', '    recovery = load_json(RECOVERY_READINESS, "recovery readiness")\n')
          replace_once(
              path,
              '\ndef load_freezer():\n',
              attempt_helper + '\n\ndef load_freezer():\n',
          )
          old_attempt = '''    else:
        require("- [x] `B2E01`" in tasks and "- [x] `B2E02`" in tasks, "B2E01/B2E02 must remain checked")
        require("- [ ] `B2E03`" in tasks, "B2E03 must remain pending before execution")
        require("current bounded execution unit `B2E03`" in current, "CURRENT frontier must advance to B2E03")
        require("Execute and canonically qualify `B2E03` only" in current, "CURRENT must authorize B2E03 only")
        require("B2E04 and all later candidate cells remain unauthorized" in current, "CURRENT must bound decoding to B2E03")
'''
          new_attempt = '''    else:
        require("- [x] `B2E01`" in tasks and "- [x] `B2E02`" in tasks, "B2E01/B2E02 must remain checked")
        require("- [ ] `B2E03`" in tasks, "B2E03 must remain pending under historical ATTEMPT-001")
        recovery_state = verify_recovery_precedence(tasks, current)
        if recovery_state is None or recovery_state == "RECOVERY_PENDING_CANONICALIZATION":
            require("current bounded execution unit `B2E03`" in current, "transitional historical CURRENT frontier must remain B2E03")
            require("Execute and canonically qualify `B2E03` only" in current, "transitional historical CURRENT must name B2E03")
'''
          replace_once(path, old_attempt, new_attempt)
          replace_once(
              path,
              '    print("B2E01_AUTHORIZED=YES_BOUNDED_CANONICAL_FRONTIER")\n',
              '    if RECOVERY_READINESS.is_file():\n'
              '        print("ATTEMPT_001_PRIMARY_AUTHORITY=CLOSED_BY_RECOVERY_PRECEDENCE")\n'
              '    else:\n'
              '        print("B2E03_AUTHORIZED=YES_BOUNDED_CANONICAL_FRONTIER")\n',
          )

          # verify_b2e02.py
          path = "research/000b2-public/verify_b2e02.py"
          replace_once(
              path,
              'READINESS = PUBLIC / "readiness.json"\n',
              'READINESS = PUBLIC / "readiness.json"\n'
              'RECOVERY_READINESS = PUBLIC / "recovery-readiness.json"\n',
          )
          b2e02_helper = recovery_helper
          replace_once(
              path,
              '\ndef sha(path: Path) -> str:\n',
              b2e02_helper + '\n\ndef sha(path: Path) -> str:\n',
          )
          old_b2e02 = '''    elif completed == "B2E02":
        require(str(readiness.get("next_action", "")).startswith("Execute B2E03 only:"), "B2E03 is not sole post-B2E02 next action")
        require("- [x] `B2E02`" in tasks and "- [ ] `B2E03`" in tasks, "B2E02/B2E03 canonical task frontier drift")
        require("B2E03" in current and "whispercpp-compact" in current and "sole current bounded execution unit" in current, "CURRENT post-B2E02 frontier drift")
'''
          new_b2e02 = '''    elif completed == "B2E02":
        require(str(readiness.get("next_action", "")).startswith("Execute B2E03 only:"), "historical ATTEMPT-001 B2E03 next action drift")
        require("- [x] `B2E02`" in tasks and "- [ ] `B2E03`" in tasks, "historical B2E02/B2E03 task frontier drift")
        recovery_state = verify_recovery_precedence(tasks, current)
        if recovery_state is None or recovery_state == "RECOVERY_PENDING_CANONICALIZATION":
            require("B2E03" in current and "whispercpp-compact" in current and "sole current bounded execution unit" in current, "transitional historical CURRENT B2E03 frontier drift")
'''
          replace_once(path, old_b2e02, new_b2e02)

          # Compile all repaired gates before committing.
          import py_compile
          for source in (
              "research/000b2-public/verify_methodology.py",
              "research/000b2-public/verify_subset_freeze.py",
              "research/000b2-public/verify_attempt_manifest.py",
              "research/000b2-public/verify_b2e02.py",
          ):
              py_compile.compile(source, doraise=True)
          PY
      - name: Verify repaired gates against transitional recovery authority
        run: |
          set -euo pipefail
          python research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_subset_freeze.py
          python research/000b2-public/verify_attempt_manifest.py
          python research/000b2-public/verify_b2e01.py
          python research/000b2-public/verify_b2e02.py
      - name: Commit permanent repair and remove helper
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-recovery-authority-precedence-patch.yml
          git add \
            research/000b2-public/verify_methodology.py \
            research/000b2-public/verify_subset_freeze.py \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_b2e02.py
          git diff --cached --check
          git commit -m "fix(000b2): honor recovery authority precedence"
          git push origin HEAD:fix/000b2-recovery-authority-precedence
