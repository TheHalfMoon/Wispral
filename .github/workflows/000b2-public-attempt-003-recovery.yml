name: 000B2 Public Corpus ATTEMPT-003 Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-*.yml'
      - 'research/000b1/frozen-methodology.json'
      - 'research/000b2-public/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/000b2-public-*.yml'
      - 'research/000b1/frozen-methodology.json'
      - 'research/000b2-public/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: 000b2-attempt-003-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-successor-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTHORITY_BASE_REVISION: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
      DISCOVERY_MAIN: dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff
      SHERPA_REVISION: 917bed95c8e5c7c18aa4d69fea42e9ef8ef0a60e

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision and authority base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          git rev-parse --verify "${DISCOVERY_MAIN}^{commit}"
          git rev-parse --verify "${AUTHORITY_BASE_REVISION}^{commit}"
          echo "EXACT_REVISION=$EXACT_REVISION"
          echo "AUTHORITY_BASE_REVISION=$AUTHORITY_BASE_REVISION"
          echo "DISCOVERY_MAIN=$DISCOVERY_MAIN"

      - name: Fetch exact pinned sherpa-onnx source before candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/sherpa-onnx"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/k2-fsa/sherpa-onnx.git
          git -C "$SRC" fetch --depth=1 origin "$SHERPA_REVISION"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SHERPA_REVISION"
          test "$(git -C "$SRC" rev-parse HEAD:sherpa-onnx/python/sherpa_onnx/online_recognizer.py)" = "18b49aaf40dc6e43606c63c9633762e8f573876b"
          git -C "$SRC" diff --quiet HEAD --

      - name: Trusted pre-candidate execution boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import importlib.util
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import types
          from pathlib import Path

          root = Path.cwd()
          base = os.environ["AUTHORITY_BASE_REVISION"]
          discovery = os.environ["DISCOVERY_MAIN"]
          readiness_path = root / "research/000b2-public/recovery-attempt-003-readiness.json"
          state = json.loads(readiness_path.read_text(encoding="utf-8"))
          active = state.get("active_recovery_unit")
          completed = state.get("completed_recovery_tasks")
          scopes = state.get("task_candidate_scopes")
          activation_scope = state.get("activation_installation_scope")
          trusted = state.get("trusted_control_paths")
          is_reconciliation = False

          if not isinstance(completed, list):
              raise SystemExit("TRUSTED_BOUNDARY=FAIL: completed recovery state malformed")
          if not isinstance(scopes, dict):
              raise SystemExit("TRUSTED_BOUNDARY=FAIL: task_candidate_scopes malformed")
          if not isinstance(activation_scope, list) or not isinstance(trusted, list):
              raise SystemExit("TRUSTED_BOUNDARY=FAIL: activation/trusted scope missing")

          changed_raw = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACDMRTUXB", base, "HEAD", "--"],
              check=True, text=True, stdout=subprocess.PIPE
          ).stdout
          changed = {line for line in changed_raw.splitlines() if line}

          if base == discovery:
              if changed != set(activation_scope):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R13 activation installation scope drift")
              if active != "B2R13":
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: activation must leave B2R13 active")
              untrusted = changed - set(trusted)
              if untrusted != set(scopes["B2R13"]):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R13 trusted/candidate scope split drift")
          else:
              base_read = subprocess.run(
                  ["git", "show", f"{base}:research/000b2-public/recovery-attempt-003-readiness.json"],
                  check=False, text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
              )
              if base_read.returncode != 0:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: non-activation base lacks successor readiness")
              base_state = json.loads(base_read.stdout)
              if state.get("task_candidate_scopes") != base_state.get("task_candidate_scopes"):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: task candidate scopes are immutable after activation")
              if state.get("trusted_control_paths") != base_state.get("trusted_control_paths"):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: trusted control path set drift")
              if state.get("activation_installation_scope") != base_state.get("activation_installation_scope"):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: activation installation scope drift")

              base_completed = base_state.get("completed_recovery_tasks")
              if not isinstance(base_completed, list):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: authority-base completion state malformed")
              delta = len(completed) - len(base_completed)
              if delta not in {0, 1}:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: candidate must advance at most one recovery task")
              if completed[:len(base_completed)] != base_completed:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: candidate rewrites completed recovery prefix")
              is_reconciliation = delta == 1

              four_authority = {
                  "docs/canonical/CURRENT_STATE.md",
                  "research/000b2-public/recovery-attempt-003-readiness.json",
                  "specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md",
                  "specs/CURRENT.md",
              }
              if is_reconciliation:
                  if not changed or not changed <= four_authority:
                      raise SystemExit("TRUSTED_BOUNDARY=FAIL: reconciliation may change only canonical authority files")
              elif active and changed:
                  allowed = set(scopes.get(active, []))
                  if not changed <= allowed:
                      raise SystemExit(f"TRUSTED_BOUNDARY=FAIL: {active} task-candidate path scope violation")

          if active == "B2R13":
              candidate_paths = set(scopes["B2R13"])
              executable_suffixes = (".py", ".sh", ".yml", ".yaml", ".ps1", ".js", ".ts")
              for path in candidate_paths:
                  if path.endswith(executable_suffixes):
                      raise SystemExit(f"TRUSTED_BOUNDARY=FAIL: executable B2R13 candidate path: {path}")
                  text = subprocess.run(
                      ["git", "show", f"HEAD:{path}"], check=True, text=True, stdout=subprocess.PIPE
                  ).stdout
                  lowered = text.lower()
                  forbidden = (
                      "primary_decode_entry_open=true",
                      '"primary_decode_entry_open": true',
                      "comparative_result_available=true",
                      '"comparative_result_available": true',
                      "production_stt_selected=true",
                      '"production_stt_selected": true',
                      "product_code_authorized=true",
                      '"product_code_authorized": true',
                  )
                  if any(marker in lowered for marker in forbidden):
                      raise SystemExit(f"TRUSTED_BOUNDARY=FAIL: positive authority in B2R13 candidate path: {path}")

          if active == "B2R14" and base != discovery and not is_reconciliation:
              expected_paths = set(scopes["B2R14"])
              if changed and not changed <= expected_paths:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 candidate path scope drift")

              harness = root / "research/000b2-public/b2r14-sherpa-result-harness.py"
              qualification = root / "research/000b2-public/b2r14-harness-qualification.json"
              candidate_workflow = root / ".github/workflows/000b2-public-b2r14-harness.yml"
              for path in (harness, qualification, candidate_workflow):
                  if not path.is_file():
                      raise SystemExit(f"TRUSTED_BOUNDARY=FAIL: missing B2R14 artifact: {path}")

              workflow_text = candidate_workflow.read_text(encoding="utf-8")
              if re.search(r"(?m)^\s*(pull_request|push)\s*:", workflow_text):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 candidate workflow may not auto-execute")

              harness_text = harness.read_text(encoding="utf-8")
              tree = ast.parse(harness_text, filename=str(harness))
              forbidden_import_roots = {
                  "os", "subprocess", "socket", "urllib", "requests", "http",
                  "ftplib", "importlib", "ctypes", "multiprocessing",
              }
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split(".", 1)[0] in forbidden_import_roots:
                              raise SystemExit(f"TRUSTED_BOUNDARY=FAIL: forbidden B2R14 import {alias.name}")
                  if isinstance(node, ast.ImportFrom):
                      if (node.module or "").split(".", 1)[0] in forbidden_import_roots:
                          raise SystemExit(f"TRUSTED_BOUNDARY=FAIL: forbidden B2R14 import {node.module}")
                  if isinstance(node, ast.Call):
                      name = ""
                      if isinstance(node.func, ast.Name):
                          name = node.func.id
                      elif isinstance(node.func, ast.Attribute):
                          name = node.func.attr
                      if name in {
                          "eval", "exec", "getattr", "__import__", "open",
                          "system", "popen", "spawn", "fork", "walk", "glob", "rglob",
                      }:
                          raise SystemExit(f"TRUSTED_BOUNDARY=FAIL: forbidden B2R14 dynamic call {name}")

              forbidden_primary = (
                  "preprocessing-capture.json", "subset-manifest.json",
                  "research/000b2-public/raw", "research/000b2-public/preprocessed",
                  "research/000b2-public/transcripts", "attempt-003-manifest.json",
                  "b2r17-", "b2r18-", "b2r19-", "b2r20-", "b2r21-", "b2r22-",
              )
              qualification_text = qualification.read_text(encoding="utf-8")
              joined = (harness_text + "\n" + workflow_text + "\n" + qualification_text).lower()
              if any(marker in joined for marker in forbidden_primary):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 references primary/future decode material")

              contract = state.get("b2r14_non_primary_fixture_contract")
              if not isinstance(contract, dict):
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 fixture contract missing")
              expected_digest = "0c92bddb4e96f3ea9ec9f0f64a668255a6c15527ac09f6f119cafde60c7c4a39"
              if contract.get("pcm_sha256") != expected_digest or contract.get("frame_count") != 16000:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 frozen fixture contract drift")
              qualification_doc = json.loads(qualification_text)
              if qualification_doc.get("non_primary_fixture") != contract:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 qualification fixture contract drift")

              source_root = Path(os.environ["RUNNER_TEMP"]) / "sherpa-onnx"
              source_path = source_root / "sherpa-onnx/python/sherpa_onnx/online_recognizer.py"
              if subprocess.run(
                  ["git", "-C", str(source_root), "rev-parse", "HEAD"],
                  check=True, text=True, stdout=subprocess.PIPE,
              ).stdout.strip() != os.environ["SHERPA_REVISION"]:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 pinned source revision drift")
              source_blob = subprocess.run(
                  ["git", "-C", str(source_root), "rev-parse", "HEAD:sherpa-onnx/python/sherpa_onnx/online_recognizer.py"],
                  check=True, text=True, stdout=subprocess.PIPE,
              ).stdout.strip()
              if source_blob != "18b49aaf40dc6e43606c63c9633762e8f573876b":
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 pinned recognizer blob drift")

              source_text = source_path.read_text(encoding="utf-8")
              source_tree = ast.parse(source_text, filename=str(source_path))
              imported_native_names = set()
              for node in source_tree.body:
                  if isinstance(node, ast.ImportFrom) and node.module == "sherpa_onnx.lib._sherpa_onnx":
                      imported_native_names.update(alias.name for alias in node.names)
              if not imported_native_names:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 pinned recognizer native imports missing")

              native_module = types.ModuleType("sherpa_onnx.lib._sherpa_onnx")
              for name in imported_native_names:
                  setattr(native_module, name, type(name, (), {}))
              package = types.ModuleType("sherpa_onnx")
              package.__path__ = []
              lib_package = types.ModuleType("sherpa_onnx.lib")
              lib_package.__path__ = []
              sys.modules["sherpa_onnx"] = package
              sys.modules["sherpa_onnx.lib"] = lib_package
              sys.modules["sherpa_onnx.lib._sherpa_onnx"] = native_module
              spec = importlib.util.spec_from_file_location("wispral_pinned_online_recognizer", source_path)
              if spec is None or spec.loader is None:
                  raise SystemExit("TRUSTED_BOUNDARY=FAIL: B2R14 pinned recognizer loader unavailable")
              pinned = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(pinned)

              with tempfile.TemporaryDirectory() as tmp:
                  tmpdir = Path(tmp)
                  fixture = tmpdir / "trusted-zero-s16le.pcm"
                  fixture.write_bytes(b"\x00" * (16000 * 2))
                  fixture_bytes = fixture.read_bytes()
                  digest = hashlib.sha256(fixture_bytes).hexdigest()
                  if len(fixture_bytes) != 32000 or digest != expected_digest:
                      raise SystemExit("TRUSTED_BOUNDARY=FAIL: generated B2R14 fixture identity mismatch")

                  class TrustedStream:
                      def __init__(self, payload):
                          self.fixture_bytes = payload

                  class TrustedNativeResult:
                      text = "trusted-synthetic-result"

                  class TrustedNativeRecognizer:
                      def get_result(self, stream):
                          if hashlib.sha256(stream.fixture_bytes).hexdigest() != expected_digest:
                              raise RuntimeError("trusted fixture bytes not delivered to pinned recognizer contract")
                          return TrustedNativeResult()

                  recognizer = object.__new__(pinned.OnlineRecognizer)
                  recognizer.recognizer = TrustedNativeRecognizer()
                  result = pinned.OnlineRecognizer.get_result(recognizer, TrustedStream(fixture_bytes))
                  if not isinstance(result, str) or result != "trusted-synthetic-result":
                      raise SystemExit("TRUSTED_BOUNDARY=FAIL: pinned OnlineRecognizer.get_result is not plain-string preserving")
                  if getattr(result, "text", "") != "":
                      raise SystemExit("TRUSTED_BOUNDARY=FAIL: object/string confusion regression not rejected")

              print("B2R14_TRUSTED_PINNED_RESULT_CONTRACT=PASS")

          print("TRUSTED_PRE_CANDIDATE_BOUNDARY=PASS")
          PY

      - name: Verify current successor frontier without external source access
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/000b2-public/verify_attempt_002_invalidation.py \
            research/000b2-public/verify_b2r13_activation.py
          ACTIVE_UNIT="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('research/000b2-public/recovery-attempt-003-readiness.json').read_text(encoding='utf-8'))
          print(state.get('active_recovery_unit') or '')
          PY
          )"
          if test "$ACTIVE_UNIT" = "B2R13"; then
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r13_activation.py --static-only
          else
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_002_invalidation.py --static-only
          fi
          echo "ACTIVE_SUCCESSOR_RECOVERY_UNIT=$ACTIVE_UNIT"

      - name: Verify material drift against exact pinned sherpa-onnx API
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_UNIT="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('research/000b2-public/recovery-attempt-003-readiness.json').read_text(encoding='utf-8'))
          print(state.get('active_recovery_unit') or '')
          PY
          )"
          if test "$ACTIVE_UNIT" = "B2R13"; then
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r13_activation.py \
              --sherpa-source "$RUNNER_TEMP/sherpa-onnx"
          else
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_002_invalidation.py \
              --sherpa-source "$RUNNER_TEMP/sherpa-onnx"
          fi

      - name: Preserve fail-closed recovery boundary and canonical transition proofs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
          test ! -e research/000b2-public/transcripts
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          state = json.loads(Path("research/000b2-public/recovery-attempt-003-readiness.json").read_text(encoding="utf-8"))
          order = [f"B2R{i:02d}" for i in range(13, 25)]
          completed = state.get("completed_recovery_tasks")
          active = state.get("active_recovery_unit")
          proofs = state.get("transition_proofs")
          if state.get("task_order") != order:
              raise SystemExit("ATTEMPT-003 task order drift")
          if not isinstance(completed, list) or completed != order[:len(completed)]:
              raise SystemExit("ATTEMPT-003 completion prefix drift")
          expected_active = order[len(completed)] if len(completed) < len(order) else None
          if active != expected_active:
              raise SystemExit("ATTEMPT-003 active successor drift")
          if not isinstance(proofs, list) or len(proofs) != len(completed):
              raise SystemExit("ATTEMPT-003 transition proof cardinality drift")

          replacement = state.get("replacement_attempt", {})
          if active in {"B2R13","B2R14","B2R15","B2R16","B2R23","B2R24"} or active is None:
              if replacement.get("primary_decode_entry_open") is not False:
                  raise SystemExit("primary decode open during closed phase")
          if active in {"B2R17","B2R18","B2R19","B2R20","B2R21","B2R22"}:
              if replacement.get("primary_decode_entry_open") is not True:
                  raise SystemExit("primary decode closed during decode phase")
          if active in {"B2R13","B2R14","B2R15"} and replacement.get("frozen") is not False:
              raise SystemExit("ATTEMPT-003 frozen before B2R16")
          if active in {"B2R17","B2R18","B2R19","B2R20","B2R21","B2R22","B2R23","B2R24"} or active is None:
              if replacement.get("frozen") is not True:
                  raise SystemExit("ATTEMPT-003 must remain frozen after B2R16")
          if replacement.get("primary_decode_entry_open") is True and replacement.get("frozen") is not True:
              raise SystemExit("primary decode cannot open before freeze")

          guards = state.get("claim_guards", {})
          if guards.get("human_developer_speech_accuracy_evidence") != "ABSENT":
              raise SystemExit("human evidence guard drift")
          if active is not None and guards.get("comparative_result_available") is not False:
              raise SystemExit("comparative result available before recovery completion")
          if guards.get("production_stt_selected") is not False or guards.get("product_code_authorized") is not False:
              raise SystemExit("production/product authority drift")

          authority_base = os.environ["AUTHORITY_BASE_REVISION"]
          discovery = os.environ["DISCOVERY_MAIN"]
          base_state = None
          base_completed = []
          base_proofs = []
          if authority_base != discovery:
              base_read = subprocess.run(
                  ["git", "show", f"{authority_base}:research/000b2-public/recovery-attempt-003-readiness.json"],
                  check=False, text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
              )
              if base_read.returncode != 0:
                  raise SystemExit("authority base lacks successor readiness")
              base_state = json.loads(base_read.stdout)
              base_completed = base_state.get("completed_recovery_tasks")
              base_proofs = base_state.get("transition_proofs")
              if not isinstance(base_completed, list) or not isinstance(base_proofs, list):
                  raise SystemExit("authority-base successor proof state malformed")
              delta = len(completed) - len(base_completed)
              if delta not in {0, 1}:
                  raise SystemExit("candidate must advance at most one recovery task")
              if completed[:len(base_completed)] != base_completed:
                  raise SystemExit("candidate rewrites completed recovery prefix")
              if proofs[:len(base_proofs)] != base_proofs:
                  raise SystemExit("candidate rewrites prior transition proofs")
              if delta == 0 and proofs != base_proofs:
                  raise SystemExit("non-reconciliation candidate changes transition proofs")
              if delta == 1 and proofs[len(base_proofs)].get("canonical_task_merge") != authority_base:
                  raise SystemExit("new transition proof is not bound to exact authority-base task merge")
          elif completed or proofs:
              raise SystemExit("activation candidate may not pre-complete successor work")

          sha40 = re.compile(r"^[0-9a-f]{40}$")
          seen_merges = set()
          seen_runs = set()
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if proofs and (not repository or not token):
              raise SystemExit("GitHub transition-proof environment missing")

          for index, task in enumerate(completed):
              proof = proofs[index]
              required = {
                  "completed_task", "canonical_task_base", "qualified_task_head",
                  "canonical_task_merge", "post_merge_recovery_run_id", "successor_task",
              }
              if not isinstance(proof, dict) or set(proof) != required:
                  raise SystemExit(f"transition proof key drift: {task}")
              if proof.get("completed_task") != task:
                  raise SystemExit(f"transition proof task drift: {task}")
              base = proof["canonical_task_base"]
              head = proof["qualified_task_head"]
              merge = proof["canonical_task_merge"]
              if not all(isinstance(v, str) and sha40.fullmatch(v) for v in (base, head, merge)):
                  raise SystemExit(f"transition proof SHA malformed: {task}")
              if merge in seen_merges:
                  raise SystemExit(f"transition merge reused: {task}")
              seen_merges.add(merge)
              run_id = proof["post_merge_recovery_run_id"]
              if type(run_id) is not int or run_id <= 0 or run_id in seen_runs:
                  raise SystemExit(f"transition run invalid/reused: {task}")
              seen_runs.add(run_id)

              successor = order[index + 1] if index + 1 < len(order) else None
              if proof.get("successor_task") != successor:
                  raise SystemExit(f"transition successor drift: {task}")

              parents = subprocess.run(
                  ["git", "show", "-s", "--format=%P", merge],
                  check=False, text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
              )
              if parents.returncode != 0 or parents.stdout.strip().split() != [base, head]:
                  raise SystemExit(f"transition merge parent mismatch: {task}")
              if subprocess.run(
                  ["git", "merge-base", "--is-ancestor", merge, "HEAD"],
                  check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode != 0:
                  raise SystemExit(f"transition merge not in candidate ancestry: {task}")

              if index == 0:
                  if base != discovery:
                      raise SystemExit("B2R13 task base must equal discovery main")
              else:
                  previous_merge = proofs[index - 1]["canonical_task_merge"]
                  if subprocess.run(
                      ["git", "merge-base", "--is-ancestor", previous_merge, base],
                      check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  ).returncode != 0:
                      raise SystemExit(f"prior task merge not ancestral to task base: {task}")
                  base_snapshot = subprocess.run(
                      ["git", "show", f"{base}:research/000b2-public/recovery-attempt-003-readiness.json"],
                      check=False, text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  )
                  if base_snapshot.returncode != 0:
                      raise SystemExit(f"task base lacks successor readiness snapshot: {task}")
                  snapshot = json.loads(base_snapshot.stdout)
                  if snapshot.get("completed_recovery_tasks") != order[:index]:
                      raise SystemExit(f"task base completed-prefix mismatch: {task}")
                  if snapshot.get("active_recovery_unit") != task:
