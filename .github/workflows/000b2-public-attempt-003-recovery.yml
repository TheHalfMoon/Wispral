name: 000B2 Public Corpus ATTEMPT-003 Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-*.yml'
      - 'research/000b1/frozen-methodology.json'
      - 'research/000b2-public/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/000b2-public-*.yml'
      - 'research/000b1/frozen-methodology.json'
      - 'research/000b2-public/**'
      - 'specs/000B2-public-corpus-bakeoff/**'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: 000b2-attempt-003-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-successor-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTHORITY_BASE_REVISION: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
      DISCOVERY_MAIN: dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff
      SHERPA_REVISION: 917bed95c8e5c7c18aa4d69fea42e9ef8ef0a60e
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision and authority base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          git rev-parse --verify "${DISCOVERY_MAIN}^{commit}"
          if test -n "$AUTHORITY_BASE_REVISION"; then
            git rev-parse --verify "${AUTHORITY_BASE_REVISION}^{commit}"
          fi
          echo "EXACT_REVISION=$EXACT_REVISION"
          echo "AUTHORITY_BASE_REVISION=$AUTHORITY_BASE_REVISION"
          echo "DISCOVERY_MAIN=$DISCOVERY_MAIN"

      - name: Verify current successor frontier without external source access
        run: |
          set -euo pipefail
          python -m py_compile \
            research/000b2-public/verify_attempt_002_invalidation.py \
            research/000b2-public/verify_b2r13_activation.py
          ACTIVE_UNIT="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('research/000b2-public/recovery-attempt-003-readiness.json').read_text(encoding='utf-8'))
          print(state.get('active_recovery_unit') or '')
          PY
          )"
          if test "$ACTIVE_UNIT" = "B2R13"; then
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r13_activation.py --static-only
          else
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_002_invalidation.py --static-only
          fi
          echo "ACTIVE_SUCCESSOR_RECOVERY_UNIT=$ACTIVE_UNIT"

      - name: Fetch exact pinned sherpa-onnx source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/sherpa-onnx"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/k2-fsa/sherpa-onnx.git
          git -C "$SRC" fetch --depth=1 origin "$SHERPA_REVISION"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SHERPA_REVISION"
          git -C "$SRC" diff --quiet HEAD --

      - name: Verify material drift against exact pinned sherpa-onnx API
        run: |
          set -euo pipefail
          ACTIVE_UNIT="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('research/000b2-public/recovery-attempt-003-readiness.json').read_text(encoding='utf-8'))
          print(state.get('active_recovery_unit') or '')
          PY
          )"
          if test "$ACTIVE_UNIT" = "B2R13"; then
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2r13_activation.py \
              --sherpa-source "$RUNNER_TEMP/sherpa-onnx"
          else
            PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_002_invalidation.py \
              --sherpa-source "$RUNNER_TEMP/sherpa-onnx"
          fi

      - name: Preserve fail-closed recovery boundary and canonical transition proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
          test ! -e research/000b2-public/transcripts
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          readiness_path = 'research/000b2-public/recovery-attempt-003-readiness.json'
          state = json.loads(Path(readiness_path).read_text(encoding='utf-8'))
          task_order = state.get('task_order')
          completed = state.get('completed_recovery_tasks')
          active = state.get('active_recovery_unit')
          expected_order = [f'B2R{i:02d}' for i in range(13, 25)]
          if task_order != expected_order:
              raise SystemExit('ATTEMPT-003 successor task order drift')
          if not isinstance(completed, list) or completed != task_order[:len(completed)]:
              raise SystemExit('ATTEMPT-003 completed tasks are not an exact ordered prefix')
          expected_active = task_order[len(completed)] if len(completed) < len(task_order) else None
          if active != expected_active:
              raise SystemExit(f'ATTEMPT-003 active successor drift: {active!r} != {expected_active!r}')

          expected_scope = [
              'docs/canonical/CURRENT_STATE.md',
              'research/000b2-public/recovery-attempt-003-readiness.json',
              'specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md',
              'specs/CURRENT.md',
          ]
          expected_policy = {
              'canonical_main_ref_required_after_first_completion': True,
              'one_recovery_task_per_reconciliation': True,
              'canonical_task_merge_must_be_on_main': True,
              'successful_post_merge_recovery_run_required': True,
              'unique_task_merge_per_completion': True,
              'unique_post_merge_recovery_run_per_completion': True,
              'normal_merge_required': True,
              'exact_qualified_head_parent_required': True,
              'candidate_must_advance_at_most_one_task_from_authority_base': True,
              'authority_documents_must_declare_successor': True,
              'reconciliation_candidate_scope': expected_scope,
          }
          if state.get('transition_policy') != expected_policy:
              raise SystemExit('ATTEMPT-003 transition policy drift')

          proofs = state.get('transition_proofs')
          if not isinstance(proofs, list) or len(proofs) != len(completed):
              raise SystemExit('ATTEMPT-003 transition proof cardinality must equal completed task count')

          authority_base = os.environ.get('AUTHORITY_BASE_REVISION', '')
          base_state = None
          if authority_base:
              read_base = subprocess.run(
                  ['git', 'show', f'{authority_base}:{readiness_path}'],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              if read_base.returncode == 0:
                  try:
                      base_state = json.loads(read_base.stdout)
                  except json.JSONDecodeError as error:
                      raise SystemExit('authority-base successor readiness is malformed JSON') from error
              elif authority_base != os.environ.get('DISCOVERY_MAIN'):
                  raise SystemExit('successor readiness missing from non-activation authority base')

          if base_state is None:
              if authority_base and authority_base != os.environ.get('DISCOVERY_MAIN'):
                  raise SystemExit('only discovery main may lack successor readiness')
              if completed != [] or active != 'B2R13' or proofs != []:
                  raise SystemExit('B2R13 activation may not pre-complete successor recovery')
          else:
              base_completed = base_state.get('completed_recovery_tasks')
              base_order = base_state.get('task_order')
              base_active = base_state.get('active_recovery_unit')
              base_proofs = base_state.get('transition_proofs')
              if base_order != task_order:
                  raise SystemExit('authority-base successor task order drift')
              if not isinstance(base_completed, list) or base_completed != task_order[:len(base_completed)]:
                  raise SystemExit('authority-base completed tasks are not an exact ordered prefix')
              expected_base_active = task_order[len(base_completed)] if len(base_completed) < len(task_order) else None
              if base_active != expected_base_active:
                  raise SystemExit('authority-base active successor drift')
              if not isinstance(base_proofs, list) or len(base_proofs) != len(base_completed):
                  raise SystemExit('authority-base transition proof cardinality drift')
              delta = len(completed) - len(base_completed)
              if delta not in {0, 1}:
                  raise SystemExit('candidate may advance at most one recovery task from authority base')
              changed = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=ACDMRTUXB', authority_base, 'HEAD', '--'],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if changed.returncode != 0:
                  raise SystemExit('unable to compute candidate path scope')
              changed_paths = {line for line in changed.stdout.splitlines() if line}
              if delta == 0:
                  if completed != base_completed or active != base_active or proofs != base_proofs:
                      raise SystemExit('non-reconciliation candidate changed successor completion authority')
                  if changed_paths:
                      if not isinstance(active, str) or active not in task_order:
                          raise SystemExit('no active successor task may accept candidate material')
                      active_token = active.lower()
                      common_workflow = '.github/workflows/000b2-public-attempt-003-recovery.yml'
                      disallowed = []
                      for path in sorted(changed_paths):
                          name = Path(path).name.lower()
                          if path == common_workflow:
                              continue
                          if path.startswith('.github/workflows/') and active_token in name:
                              continue
                          if path.startswith('research/000b2-public/') and active_token in name:
                              continue
                          disallowed.append(path)
                      if disallowed:
                          raise SystemExit(
                              f'{active} candidate changed paths outside active-task scope: '
                              + ', '.join(disallowed)
                          )
              else:
                  if completed[:-1] != base_completed or proofs[:-1] != base_proofs:
                      raise SystemExit('reconciliation replaced prior completion/proof history')
                  if completed[-1] != base_active:
                      raise SystemExit('reconciliation did not complete the exact authority-base active task')
                  if proofs[-1].get('canonical_task_merge') != authority_base:
                      raise SystemExit('new transition proof must bind the exact reconciliation authority-base task merge')
                  allowed_scope = set(expected_scope)
                  if not changed_paths:
                      raise SystemExit('reconciliation candidate must change canonical authority files')
                  outside_scope = sorted(changed_paths - allowed_scope)
                  if outside_scope:
                      raise SystemExit(
                          'reconciliation candidate changed paths outside canonical authority scope: '
                          + ', '.join(outside_scope)
                      )

          sha40 = re.compile(r'^[0-9a-f]{40}$')
          seen_merges: set[str] = set()
          seen_runs: set[int] = set()
          previous_merge = None
          for index, task in enumerate(completed):
              proof = proofs[index]
              if not isinstance(proof, dict):
                  raise SystemExit(f'transition proof must be an object: {task}')
              required_keys = {
                  'completed_task',
                  'canonical_task_base',
                  'qualified_task_head',
                  'canonical_task_merge',
                  'post_merge_recovery_run_id',
                  'successor_task',
              }
              if set(proof) != required_keys:
                  raise SystemExit(f'transition proof key drift: {task}')
              if proof.get('completed_task') != task:
                  raise SystemExit(f'transition proof task-order drift: {task}')

              task_base = proof.get('canonical_task_base')
              task_head = proof.get('qualified_task_head')
              merge = proof.get('canonical_task_merge')
              if not all(isinstance(value, str) and sha40.fullmatch(value) is not None for value in (task_base, task_head, merge)):
                  raise SystemExit(f'transition proof SHA malformed: {task}')
              if task_base == task_head or task_base == merge or task_head == merge:
                  raise SystemExit(f'transition proof identities must be distinct: {task}')
              if merge in seen_merges:
                  raise SystemExit(f'canonical task merge reused across completions: {task}')
              seen_merges.add(merge)

              run_id = proof.get('post_merge_recovery_run_id')
              if type(run_id) is not int or run_id <= 0:
                  raise SystemExit(f'transition proof run id malformed: {task}')
              if run_id in seen_runs:
                  raise SystemExit(f'post-merge recovery run reused across completions: {task}')
              seen_runs.add(run_id)

              successor = task_order[index + 1] if index + 1 < len(task_order) else None
              if proof.get('successor_task') != successor:
                  raise SystemExit(f'transition proof successor drift: {task}')

              parents = subprocess.run(
                  ['git', 'show', '-s', '--format=%P', merge],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              if parents.returncode != 0:
                  raise SystemExit(f'canonical task merge is unavailable: {task}')
              parent_shas = parents.stdout.strip().split()
              if parent_shas != [task_base, task_head]:
                  raise SystemExit(f'canonical task merge parents do not match exact base/head: {task}')

              ancestry = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', merge, 'HEAD'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if ancestry.returncode != 0:
                  raise SystemExit(f'transition proof merge is not in candidate ancestry: {task}')

              if index == 0:
                  if task_base != os.environ.get('DISCOVERY_MAIN'):
                      raise SystemExit('B2R13 canonical task base must be exact discovery main')
              else:
                  base_read = subprocess.run(
                      ['git', 'show', f'{task_base}:{readiness_path}'],
                      check=False,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                  )
                  if base_read.returncode != 0:
                      raise SystemExit(f'canonical task base lacks successor readiness: {task}')
                  try:
                      task_base_state = json.loads(base_read.stdout)
                  except json.JSONDecodeError as error:
                      raise SystemExit(f'canonical task base readiness malformed: {task}') from error
                  if task_base_state.get('completed_recovery_tasks') != task_order[:index]:
                      raise SystemExit(f'canonical task base completion prefix drift: {task}')
                  if task_base_state.get('active_recovery_unit') != task:
                      raise SystemExit(f'task was not the active unit on its canonical first parent: {task}')
                  if previous_merge is None or previous_merge == task_base:
                      raise SystemExit(f'missing separate prior reconciliation before task base: {task}')
                  prior_ancestry = subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', previous_merge, task_base],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  )
                  if prior_ancestry.returncode != 0:
                      raise SystemExit(f'prior task merge is not ancestral to next task base: {task}')
              previous_merge = merge

              repository = os.environ.get('GITHUB_REPOSITORY', '')
              token = os.environ.get('GH_TOKEN', '')
              if not repository or not token:
                  raise SystemExit('GitHub transition-proof verification environment missing')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/actions/runs/{run_id}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'wispral-attempt-003-recovery-verifier',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      run = json.load(response)
              except Exception as error:
                  raise SystemExit(f'unable to verify transition proof run for {task}: {type(error).__name__}') from error
              expected = {
                  'name': '000B2 Public Corpus ATTEMPT-003 Recovery',
                  'event': 'push',
                  'head_branch': 'main',
                  'head_sha': merge,
                  'status': 'completed',
                  'conclusion': 'success',
              }
              for key, value in expected.items():
                  if run.get(key) != value:
                      raise SystemExit(f'transition proof run mismatch for {task}: {key}')

          replacement = state.get('replacement_attempt', {})
          if active in {'B2R13', 'B2R14', 'B2R15', 'B2R16'} and replacement.get('primary_decode_entry_open') is not False:
              raise SystemExit(f'ATTEMPT-003 primary decode unexpectedly open during {active}')
          if active in {'B2R13', 'B2R14', 'B2R15'} and replacement.get('frozen') is not False:
              raise SystemExit(f'ATTEMPT-003 frozen before B2R16: {active}')
          if active == 'B2R13' and completed:
              raise SystemExit('B2R13 activation candidate must not pre-complete successor tasks')

          guards = state.get('claim_guards', {})
          if guards.get('human_developer_speech_accuracy_evidence') != 'ABSENT':
              raise SystemExit('human developer-speech evidence guard drift')
          if active is not None and guards.get('comparative_result_available') is not False:
              raise SystemExit('comparative result became available before successor recovery completion')
          if guards.get('production_stt_selected') is not False:
              raise SystemExit('production STT unexpectedly selected')
          if guards.get('product_code_authorized') is not False:
              raise SystemExit('product code unexpectedly authorized')

          print(f'ACTIVE_SUCCESSOR_RECOVERY_UNIT={active}')
          print(f'VALIDATED_SUCCESSOR_TRANSITIONS={len(proofs)}')
          print('ATTEMPT_002_NEW_PRIMARY_DECODE_AUTHORIZED=NO')
          print('ATTEMPT_003_PRIMARY_DECODE_AUTHORIZED=' + ('YES' if replacement.get('primary_decode_entry_open') is True else 'NO'))
          print('COMPARATIVE_RESULT_AVAILABLE=' + ('YES' if guards.get('comparative_result_available') is True else 'NO'))
          print('PRODUCTION_STT_SELECTED=NO')
          print('PRODUCT_CODE_AUTHORIZED=NO')
          PY
