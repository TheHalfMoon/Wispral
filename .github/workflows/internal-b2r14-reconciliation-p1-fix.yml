name: Internal B2R14 Reconciliation P1 Fix
# Retriggered after forward-only restoration of the exact pre-repair specification blob.

on:
  push:
    branches:
      - recovery/b2r14-corrective-reconcile-to-b2r15
    paths:
      - '.github/workflows/internal-b2r14-reconciliation-p1-fix.yml'

permissions:
  contents: write

concurrency:
  group: b2r14-reconciliation-p1-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-bounded-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify live authority and apply bounded P1 repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "e07e9bf7b7bdff3fdb41cc421140a9d6bdd8b3ca"
          python - <<'PY'
          from pathlib import Path

          path = Path('specs/CURRENT.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '## Canonical B2R09 recovery reconciliation — latest authority':
                  '## Historical B2R09 recovery reconciliation — superseded ATTEMPT-002 authority',
              'This section is the sole current recovery-action authority in this document.':
                  'This section is retained only as historical ATTEMPT-002 reconciliation chronology and is not current execution authority. It is superseded by the later ATTEMPT-003 successor recovery activation and corrective B2R14 reconciliation, whose current execution authority is B2R15 only.',
              '## Next canonical action\n\nQualify `B2R10` only:':
                  '## Historical ATTEMPT-002 next action — superseded and non-authoritative\n\nThe instruction below is preserved only as historical ATTEMPT-002 chronology and MUST NOT be followed for any new execution decision. Current authority is ATTEMPT-003 B2R15 only; ATTEMPT-003 remains unfrozen, primary decoding and scoring remain closed, and B2R16+ remain unauthorized.\n\nQualify `B2R10` only:',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "specs/CURRENT.md"
          grep -Fq '## Historical B2R09 recovery reconciliation — superseded ATTEMPT-002 authority' specs/CURRENT.md
          grep -Fq 'This section is retained only as historical ATTEMPT-002 reconciliation chronology and is not current execution authority.' specs/CURRENT.md
          grep -Fq '## Historical ATTEMPT-002 next action — superseded and non-authoritative' specs/CURRENT.md
          grep -Fq 'Current authority is ATTEMPT-003 B2R15 only; ATTEMPT-003 remains unfrozen, primary decoding and scoring remain closed, and B2R16+ remain unauthorized.' specs/CURRENT.md

      - name: Commit bounded repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TheHalfMoon'
          git config user.email 'alshehriofficial@gmail.com'
          git rm .github/workflows/internal-b2r14-reconciliation-p1-fix.yml
          git add specs/CURRENT.md
          git diff --cached --check
          git commit -m 'docs(b2): demote superseded B2R10 authority'
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' .github/workflows/internal-b2r14-reconciliation-p1-fix.yml specs/CURRENT.md | sort)"
          git push origin HEAD:recovery/b2r14-corrective-reconcile-to-b2r15
