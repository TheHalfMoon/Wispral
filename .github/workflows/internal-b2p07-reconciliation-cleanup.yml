name: Internal B2P07 Reconciliation Cleanup

on:
  push:
    branches:
      - docs/000b2-reconcile-after-b2p07
    paths:
      - '.github/workflows/internal-b2p07-reconciliation-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/000b2-reconcile-after-b2p07
          fetch-depth: 0
      - name: Remove generated bytecode and cleanup workflow
        run: |
          set -euo pipefail
          find research -type d -name __pycache__ -prune -exec rm -rf {} +
          rm .github/workflows/internal-b2p07-reconciliation-cleanup.yml
          git diff --check
          git status --short
          test -z "$(find research -type d -name __pycache__ -print -quit)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(000b2): remove reconciliation bytecode artifacts"
          git push origin HEAD:docs/000b2-reconcile-after-b2p07
