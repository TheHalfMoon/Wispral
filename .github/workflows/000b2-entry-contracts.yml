name: 000B2 Entry Contracts

on:
  push:
    branches:
      - main
      - research/000b2-entry-preparation
    paths:
      - 'research/000b2-entry/scorer.py'
      - 'research/000b2-entry/scorer-config.json'
      - 'research/000b2-entry/verify_scorer.py'
      - 'research/000b2-entry/prepare_attempt_manifest.py'
      - 'research/000b2-entry/validate_entry_manifest.py'
      - 'research/000b2-entry/operational-smoke-evidence.json'
      - 'research/000b2-entry/verify_operational_smoke.py'
      - 'research/000b2-entry/readiness.json'
      - 'research/000b2-entry/canonical-closeout.json'
      - 'research/000b2-entry/verify_closeout.py'
      - 'research/000b2-entry/verify_readiness.py'
      - 'research/000b2-entry/authority/**'
      - 'research/000b2-entry/preprocessing/**'
      - 'research/000b2-entry/environment/**'
      - 'specs/CURRENT.md'
      - 'specs/000B-stt-entity-bakeoff/tasks.md'
      - 'docs/canonical/CURRENT_STATE.md'
      - '.github/workflows/000b2-entry-contracts.yml'
  pull_request:
    paths:
      - 'research/000b2-entry/scorer.py'
      - 'research/000b2-entry/scorer-config.json'
      - 'research/000b2-entry/verify_scorer.py'
      - 'research/000b2-entry/prepare_attempt_manifest.py'
      - 'research/000b2-entry/validate_entry_manifest.py'
      - 'research/000b2-entry/operational-smoke-evidence.json'
      - 'research/000b2-entry/verify_operational_smoke.py'
      - 'research/000b2-entry/readiness.json'
      - 'research/000b2-entry/canonical-closeout.json'
      - 'research/000b2-entry/verify_closeout.py'
      - 'research/000b2-entry/verify_readiness.py'
      - 'research/000b2-entry/authority/**'
      - 'research/000b2-entry/preprocessing/**'
      - 'research/000b2-entry/environment/**'
      - 'specs/CURRENT.md'
      - 'specs/000B-stt-entity-bakeoff/tasks.md'
      - 'docs/canonical/CURRENT_STATE.md'
      - '.github/workflows/000b2-entry-contracts.yml'

permissions:
  contents: read

jobs:
  verify-entry-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic B2 scorer
        run: python research/000b2-entry/verify_scorer.py
      - name: Verify durable six-cell operational smoke evidence
        run: python research/000b2-entry/verify_operational_smoke.py
      - name: Verify human authority contract remains fail-closed
        run: |
          python research/000b2-entry/authority/verify_authority.py --self-test
          OUTPUT="$(python research/000b2-entry/authority/verify_authority.py research/000b2-entry/authority/authority-package.json)"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -Fx 'AUTHORITY_PACKAGE=NOT_AUTHORIZED'
          printf '%s\n' "$OUTPUT" | grep -Fx 'PRIMARY_MEDIA_ACCEPTANCE=NO'
          if python research/000b2-entry/authority/verify_authority.py \
            research/000b2-entry/authority/authority-package.json \
            --require-authorized; then
            echo 'blocked authority package was incorrectly accepted as AUTHORIZED' >&2
            exit 1
          fi
          echo 'AUTHORITY_REQUIRE_AUTHORIZED=BLOCKED_AS_EXPECTED'
      - name: Verify preprocessing capture boundary
        run: |
          python research/000b2-entry/preprocessing/verify_capture.py
          python -O research/000b2-entry/preprocessing/verify_capture.py
      - name: Verify execution-environment capture boundary
        run: |
          python research/000b2-entry/environment/verify_capture.py
          python -O research/000b2-entry/environment/verify_capture.py
      - name: Generate amendment-aware non-frozen B2 entry draft
        run: |
          git fetch --no-tags --depth=1 origin main
          CANONICAL_REVISION="$(git rev-parse FETCH_HEAD)"
          python research/000b2-entry/prepare_attempt_manifest.py \
            --canonical-revision "$CANONICAL_REVISION" \
            --output "$RUNNER_TEMP/000b2-entry-draft.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / '000b2-entry-draft.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          expected = '49d0f31408ab36f285f5e61228b54a72ca0aec07'
          if manifest.get('scorer', {}).get('revision') != expected:
              raise SystemExit('canonical scorer revision was not projected into entry draft')
          print('CANONICAL_SCORER_REVISION=PASS')
          PY
      - name: Prove B2 entry draft validates but canonical frontier remains blocked
        run: |
          OUTPUT="$(python research/000b2-entry/validate_entry_manifest.py "$RUNNER_TEMP/000b2-entry-draft.json")"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -Fx 'ENTRY_STRUCTURE=PASS'
          printf '%s\n' "$OUTPUT" | grep -Fx 'B2_READY=NO'
          printf '%s\n' "$OUTPUT" | grep -Fx 'BLOCKER=canonical B2 frontier is BLOCKED_EXTERNAL, not READY'
          if printf '%s\n' "$OUTPUT" | grep -Fq 'scorer revision/config not frozen'; then
            echo 'resolved scorer blocker reappeared' >&2
            exit 1
          fi
      - name: Verify current B2 readiness and closeout records
        run: |
          test -f research/000b2-entry/readiness.json || {
            echo 'B2_ENTRY_READINESS_RECORD=MISSING' >&2
            exit 1
          }
          test -f research/000b2-entry/canonical-closeout.json || {
            echo 'B2_ENTRY_CLOSEOUT_RECORD=MISSING' >&2
            exit 1
          }
          python research/000b2-entry/verify_closeout.py
          python research/000b2-entry/verify_readiness.py
