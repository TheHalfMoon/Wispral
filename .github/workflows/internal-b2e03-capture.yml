name: Internal B2E03 Public C0 Capture

on:
  push:
    branches:
      - research/000b2-b2e03-whispercpp-compact
    paths:
      - 'research/000b2-public/b2e03-capture-trigger.json'

permissions:
  contents: read

concurrency:
  group: b2e03-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-b2e03:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      B2E03_REVISION: ${{ github.sha }}
      B2E03_CONTAINER_IMAGE: python:3.12.11-bookworm@sha256:13c9584604a99ca134c4f41800f74ffc64ee6ac8cf555cf1e704a6087fc84f12
      FFMPEG_TAG: n9.0.1
      FFMPEG_REV: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
      FFMPEG_ROOT: /evidence/toolchain
      WHISPER_REV: 371b5a7561823ab2bb32142d2751e35e7534727b
      WHISPER_TREE: 3d7ce4f956997cfa325c7556533aba5604278463
      MODEL_REV: 80da2d8bfee42b0e836fc3a9890373e5defc00a6
      MODEL_NAME: ggml-base.en.bin
      MODEL_BYTES: '147964211'
      MODEL_SHA256: a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002

    steps:
      - name: Checkout exact B2E03 source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.B2E03_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision and static B2E03 authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B2E03_REVISION"
          python -m py_compile \
            research/000b2-public/decode_b2e03.py \
            research/000b2-public/verify_b2e03.py
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e03.py --static-only
          git diff --quiet HEAD --

      - name: Pull exact immutable preprocessing container
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/b2e03"
          mkdir -p "$RUNNER_TEMP/b2e03/home" "$RUNNER_TEMP/b2e03/work"
          docker pull --platform linux/amd64 "$B2E03_CONTAINER_IMAGE"
          test "$(docker image inspect "$B2E03_CONTAINER_IMAGE" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$B2E03_CONTAINER_IMAGE" --format '{{.Architecture}}')" = "amd64"

      - name: Fetch exact FFmpeg release
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -e FFMPEG_TAG \
            -e FFMPEG_REV \
            -v "$RUNNER_TEMP/b2e03:/evidence" \
            "$B2E03_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              rm -rf "$FFMPEG_ROOT"
              mkdir -p "$FFMPEG_ROOT"
              SRC="$FFMPEG_ROOT/FFmpeg"
              git init "$SRC"
              git -C "$SRC" remote add origin https://github.com/FFmpeg/FFmpeg.git
              git -C "$SRC" fetch --depth=1 origin "refs/tags/$FFMPEG_TAG:refs/tags/$FFMPEG_TAG"
              test "$(git -C "$SRC" rev-list -n1 "$FFMPEG_TAG")" = "$FFMPEG_REV"
              git -C "$SRC" checkout --detach "$FFMPEG_REV"
            '

      - name: Build bounded FFmpeg 9.0.1 preprocessing tool
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$RUNNER_TEMP/b2e03:/evidence" \
            "$B2E03_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              SRC="$FFMPEG_ROOT/FFmpeg"
              PREFIX="$FFMPEG_ROOT/install"
              cd "$SRC"
              ./configure \
                --prefix="$PREFIX" \
                --disable-everything \
                --disable-doc \
                --disable-debug \
                --disable-ffplay \
                --disable-ffprobe \
                --disable-network \
                --disable-autodetect \
                --disable-x86asm \
                --enable-protocol=file \
                --enable-demuxer=flac,wav \
                --enable-muxer=wav \
                --enable-decoder=flac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
                --enable-encoder=pcm_s16le \
                --enable-parser=flac \
                --enable-filter=aresample,aformat \
                --enable-swresample
              make -j2 ffmpeg
              make install
              "$PREFIX/bin/ffmpeg" -version | head -n 1
            '

      - name: Reproduce exact frozen P0 preprocessing bytes
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/evidence/home \
            -e FFMPEG_ROOT \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/b2e03:/evidence" \
            -w /workspace \
            "$B2E03_CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/preprocess_subset.py \
                --ffmpeg "$FFMPEG_ROOT/install/bin/ffmpeg" \
                --work-dir /evidence/work \
                --output /evidence/preprocessing-capture.json
              PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_preprocessing_capture.py \
                --compare-committed /evidence/preprocessing-capture.json
            '

      - name: Fetch exact whisper.cpp source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/b2e03/whisper.cpp"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C "$SRC" fetch --depth=1 origin "$WHISPER_REV"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$WHISPER_REV"
          test "$(git -C "$SRC" rev-parse HEAD^{tree})" = "$WHISPER_TREE"
          git -C "$SRC" diff --quiet HEAD --

      - name: Build exact CPU-only Wispral stream adapter
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/b2e03/whisper.cpp"
          BUILD="$RUNNER_TEMP/b2e03/whisper-build"
          ADAPTER_DIR="$GITHUB_WORKSPACE/research/000b2-public/whispercpp-adapter"
          cmake -S "$ADAPTER_DIR" -B "$BUILD" \
            -DWHISPER_SOURCE_DIR="$SRC" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF
          changed="$(git -C "$SRC" diff --name-only HEAD --)"
          if [ -n "$changed" ]; then
            test "$changed" = "bindings/javascript/package.json"
            git -C "$SRC" checkout -- bindings/javascript/package.json
          fi
          git -C "$SRC" diff --quiet HEAD --
          cmake --build "$BUILD" --target wispral-whispercpp-c0 -j2
          git -C "$SRC" diff --quiet HEAD --
          "$BUILD/wispral-whispercpp-c0" --version

          export SRC BUILD ADAPTER_DIR
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          src = pathlib.Path(os.environ['SRC']).resolve()
          build = pathlib.Path(os.environ['BUILD']).resolve()
          adapter_dir = pathlib.Path(os.environ['ADAPTER_DIR']).resolve()
          binary = build / 'wispral-whispercpp-c0'
          cache = build / 'CMakeCache.txt'

          def sha(path: pathlib.Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def sha_text(text: str) -> str:
              return hashlib.sha256(text.encode('utf-8')).hexdigest()

          cache_text = cache.read_text(encoding='utf-8', errors='strict')
          match = re.search(r'^CMAKE_CXX_COMPILER:FILEPATH=(.+)$', cache_text, re.MULTILINE)
          if match is None:
              match = re.search(r'^CMAKE_CXX_COMPILER:STRING=(.+)$', cache_text, re.MULTILINE)
          if match is None:
              raise SystemExit('CMAKE_CXX_COMPILER missing from cache')
          compiler = match.group(1).strip()
          compiler_version = subprocess.run(
              [compiler, '--version'], check=True, text=True,
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
          ).stdout
          cmake_version = subprocess.run(
              ['cmake', '--version'], check=True, text=True,
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
          ).stdout
          source_revision = subprocess.run(
              ['git', '-C', str(src), 'rev-parse', 'HEAD'], check=True,
              text=True, stdout=subprocess.PIPE,
          ).stdout.strip()
          source_tree = subprocess.run(
              ['git', '-C', str(src), 'rev-parse', 'HEAD^{tree}'], check=True,
              text=True, stdout=subprocess.PIPE,
          ).stdout.strip()
          subprocess.run(['git', '-C', str(src), 'diff', '--quiet', 'HEAD', '--'], check=True)

          identity = {
              'schema_version': '000b2-whisper-build-identity-v2',
              'source_revision': source_revision,
              'source_tree': source_tree,
              'build_type': 'Release',
              'ggml_cuda': 'OFF',
              'ggml_metal': 'OFF',
              'whisper_build_tests': 'OFF',
              'whisper_build_examples': 'OFF',
              'target': 'wispral-whispercpp-c0',
              'adapter_source_path': 'research/000b2-public/whispercpp-adapter/adapter.cpp',
              'adapter_source_sha256': sha(adapter_dir / 'adapter.cpp'),
              'adapter_cmake_path': 'research/000b2-public/whispercpp-adapter/CMakeLists.txt',
              'adapter_cmake_sha256': sha(adapter_dir / 'CMakeLists.txt'),
              'adapter_binary_sha256': sha(binary),
              'cmake_cache_sha256': sha(cache),
              'compiler_version_sha256': sha_text(compiler_version),
              'cmake_version_sha256': sha_text(cmake_version),
          }
          (build / 'wispral-build-identity.json').write_text(
              json.dumps(identity, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(f"WHISPER_BUILD_SOURCE={source_revision}")
          print(f"WHISPER_BUILD_TREE={source_tree}")
          print(f"WHISPER_ADAPTER_SHA256={identity['adapter_binary_sha256']}")
          PY

      - name: Download exact pinned whispercpp-compact model
        run: |
          set -euo pipefail
          MODELS="$RUNNER_TEMP/b2e03/models"
          mkdir -p "$MODELS"
          BASE="https://huggingface.co/ggerganov/whisper.cpp/resolve/$MODEL_REV"
          curl --fail --location --retry 3 --retry-all-errors \
            "$BASE/$MODEL_NAME" -o "$MODELS/$MODEL_NAME"
          test "$(stat -c %s "$MODELS/$MODEL_NAME")" = "$MODEL_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" "$MODELS/$MODEL_NAME" | sha256sum --check -

      - name: Execute B2E03 whispercpp-compact C0 decode
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/decode_b2e03.py \
            --work-dir "$RUNNER_TEMP/b2e03/adapter-work" \
            --preprocessed-root "$RUNNER_TEMP/b2e03/work/preprocessed" \
            --model "$RUNNER_TEMP/b2e03/models/$MODEL_NAME" \
            --adapter "$RUNNER_TEMP/b2e03/whisper-build/wispral-whispercpp-c0" \
            --build-identity "$RUNNER_TEMP/b2e03/whisper-build/wispral-build-identity.json" \
            --output "$RUNNER_TEMP/b2e03/b2e03-whispercpp-compact.json"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e03.py \
            --evidence "$RUNNER_TEMP/b2e03/b2e03-whispercpp-compact.json"

      - name: Preserve raw-data boundary
        run: |
          set -euo pipefail
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
          test ! -e research/000b2-public/transcripts
          echo 'B2E03_RAW_DATA_BOUNDARY=PASS'

      - name: Upload bounded B2E03 execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2e03-whispercpp-compact-${{ env.B2E03_REVISION }}
          path: |
            ${{ runner.temp }}/b2e03/b2e03-whispercpp-compact.json
            ${{ runner.temp }}/b2e03/whisper-build/wispral-build-identity.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove transient corpus, model, source, adapter output, and toolchain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/b2e03"
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
          test ! -e research/000b2-public/transcripts
