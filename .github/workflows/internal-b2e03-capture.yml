name: Internal B2E03 Public C0 Capture

on:
  push:
    branches:
      - research/000b2-b2e03-whispercpp-compact
    paths:
      - 'research/000b2-public/b2e03-capture-trigger.json'

permissions:
  contents: read

concurrency:
  group: b2e03-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  halt-invalid-attempt:
    runs-on: ubuntu-24.04
    steps:
      - name: Record intentional halt
        run: |
          echo 'B2E03_CAPTURE=HALTED'
          echo 'REASON=MATERIAL_FROZEN_C0_METHODOLOGY_DRIFT_DISCOVERED_IN_CANONICAL_B2E01_B2E02_EXECUTION'
          echo 'B2E03_EVIDENCE_AUTHORIZED=NO'
