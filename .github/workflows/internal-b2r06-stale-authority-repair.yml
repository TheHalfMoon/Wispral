name: Internal B2R06 Stale Authority Repair

on:
  push:
    branches:
      - docs/000b2-b2r06-reconciliation
    paths:
      - .github/workflows/internal-b2r06-stale-authority-repair.yml
      - research/000b2-public/internal_b2r06_stale_authority_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reconciliation branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact repair bootstrap and canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "docs/000b2-b2r06-reconciliation"
          test "$(git rev-parse HEAD^)" = "bfbc6b526f4b3a6d90f4a9521458b4b29eee41a2"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "2460eae15260423b3a06d50d9119ae2459ff41c7"
          test -f research/000b2-public/internal_b2r06_stale_authority_repair.py
          test -f .github/workflows/internal-b2r06-stale-authority-repair.yml

      - name: Repair stale authority, verify, and push clean candidate
        shell: bash
        run: |
          set -euo pipefail
          python research/000b2-public/internal_b2r06_stale_authority_repair.py
