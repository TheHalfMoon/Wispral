name: 000B2 Trusted Human Authority Structure

on:
  pull_request:
    paths:
      - '.github/trusted/verify_000b2_human_authority.py'
      - '.github/workflows/000b2-trusted-human-authority.yml'
      - 'research/000b2-entry/authority/**'
      - 'research/000b2-entry/readiness.json'
      - 'research/000b2-entry/validate_entry_manifest.py'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/trusted/verify_000b2_human_authority.py'
      - '.github/workflows/000b2-trusted-human-authority.yml'
      - 'research/000b2-entry/authority/**'
      - 'research/000b2-entry/readiness.json'
      - 'research/000b2-entry/validate_entry_manifest.py'
      - 'specs/CURRENT.md'
      - 'docs/canonical/CURRENT_STATE.md'
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head for bootstrap qualification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify bootstrap checkout matches exact PR head
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$EVENT_HEAD_SHA" ]; then
            echo "bootstrap exact-head mismatch: event=$EVENT_HEAD_SHA checkout=$CHECKED_OUT_SHA" >&2
            exit 1
          fi
          echo "EXACT_PR_HEAD_SHA=$CHECKED_OUT_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile trusted authority verifier candidates
        run: |
          python -m py_compile research/000b2-entry/authority/verify_authority.py
          python -m py_compile .github/trusted/verify_000b2_human_authority.py
      - name: Exercise fail-closed authority contract self-test
        run: python research/000b2-entry/authority/verify_authority.py --self-test
      - name: Exercise trusted structural verifier on current blocked state
        run: |
          python .github/trusted/verify_000b2_human_authority.py \
            --base-root . \
            --candidate-root .
      - name: Exercise immutable remote candidate-data path
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .github/trusted/verify_000b2_human_authority.py \
            --base-root . \
            --repo "$REPOSITORY" \
            --head-sha "$CANDIDATE_HEAD_SHA"
      - name: Verify trusted workflow bootstrap invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/000b2-trusted-human-authority.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'pull_request_target:',
              "github.event.pull_request.base.ref == 'main'",
              'Checkout live canonical base authority',
              'Checkout exact PR head for bootstrap qualification',
              'Verify bootstrap checkout matches exact PR head',
              'trusted-base/.github/trusted/verify_000b2_human_authority.py',
              'PARTICIPANT_CONSENT_ATTESTATION=NOT_PROVIDED_BY_THIS_GATE',
              '--reverify-open-prs',
              'Exercise immutable remote candidate-data path',
              'actions/checkout@11d5960a326750d5838078e36cf38b85af677262',
              'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'trusted authority workflow bootstrap drift: {missing}')
          uses = []
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith('- uses:'):
                  uses.append(stripped.split('uses:', 1)[1].strip())
          if not uses:
              raise SystemExit('trusted authority workflow has no action uses entries')
          bad = [item for item in uses if re.fullmatch(r'[^@\s]+@[0-9a-f]{40}', item) is None]
          if bad:
              raise SystemExit(f'trusted authority workflow has non-pinned action uses: {bad}')
          print('TRUSTED_AUTHORITY_BOOTSTRAP=PASS')
          PY

  verify-candidate-structure-from-live-base:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout live canonical base authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted-base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve exact trust boundary
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA="$(git -C trusted-base rev-parse HEAD)"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "live canonical base SHA malformed: $BASE_SHA" >&2
            exit 1
          fi
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate event head SHA malformed: $EVENT_HEAD_SHA" >&2
            exit 1
          fi
          echo "TRUSTED_BASE_SHA=$BASE_SHA"
          echo "CANDIDATE_HEAD_SHA=$EVENT_HEAD_SHA"
      - name: Verify exact candidate data with live canonical verifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python trusted-base/.github/trusted/verify_000b2_human_authority.py \
            --base-root trusted-base \
            --repo "$REPOSITORY" \
            --head-sha "$CANDIDATE_HEAD_SHA"
          echo 'PARTICIPANT_CONSENT_ATTESTATION=NOT_PROVIDED_BY_THIS_GATE'
          echo 'PRIMARY_MEDIA_ACCEPTANCE=NO'

  verify-canonical-and-open-prs-after-base-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted-base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify new canonical base remains blocked
        run: |
          python trusted-base/.github/trusted/verify_000b2_human_authority.py \
            --base-root trusted-base \
            --candidate-root trusted-base
          echo 'PARTICIPANT_CONSENT_ATTESTATION=NOT_PROVIDED_BY_THIS_GATE'
      - name: Reverify every open main-targeting PR against the new canonical base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python trusted-base/.github/trusted/verify_000b2_human_authority.py \
            --base-root trusted-base \
            --repo "$REPOSITORY" \
            --reverify-open-prs
