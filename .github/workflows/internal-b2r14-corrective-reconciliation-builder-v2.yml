name: Internal B2R14 Corrective Reconciliation Builder V2

on:
  push:
    branches:
      - internal/b2r14-corrective-reconciliation-builder-v1
    paths:
      - '.github/workflows/internal-b2r14-corrective-reconciliation-builder-v2.yml'

permissions:
  contents: write

env:
  CANONICAL_BASE: e07e9bf7b7bdff3fdb41cc421140a9d6bdd8b3ca
  TASK_BASE: 2f4212228f24e40fbd03cfc59ab4774df94c0cc3
  QUALIFIED_HEAD: c60751c43a2523879814d691011d5dd6d3d1e119
  TASK_MERGE: e07e9bf7b7bdff3fdb41cc421140a9d6bdd8b3ca
  RECOVERY_RUN: '34246855454'
  TARGET_BRANCH: recovery/b2r14-corrective-reconcile-to-b2r15-v2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout builder source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact corrective proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git show -s --format='%P' "$TASK_MERGE")" = "$TASK_BASE $QUALIFIED_HEAD"
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/TheHalfMoon/Wispral/actions/runs/34246855454',headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          run=json.load(urllib.request.urlopen(req))
          assert run['workflow_id']==352653404
          assert run['path']=='.github/workflows/000b2-public-attempt-003-recovery.yml'
          assert run['event']=='push' and run['head_branch']=='main'
          assert run['head_sha']=='e07e9bf7b7bdff3fdb41cc421140a9d6bdd8b3ca'
          assert run['status']=='completed' and run['conclusion']=='success'
          print('B2R14_CORRECTIVE_PROOF=PASS')
          PY

      - name: Build minimal clean reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$CANONICAL_BASE"
          git switch -C "$TARGET_BRANCH"
          python - <<'PY'
          from pathlib import Path
          import json

          task_base='2f4212228f24e40fbd03cfc59ab4774df94c0cc3'
          head='c60751c43a2523879814d691011d5dd6d3d1e119'
          merge='e07e9bf7b7bdff3fdb41cc421140a9d6bdd8b3ca'
          run='34246855454'

          p=Path('research/000b2-public/recovery-attempt-003-readiness.json')
          s=p.read_text()
          old='''  "completed_recovery_tasks": ["B2R13"],\n  "active_recovery_unit": "B2R14",\n  "transition_proofs": [\n    {\n      "completed_task": "B2R13",\n      "canonical_task_base": "dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff",\n      "qualified_task_head": "43f9d5bcb4465bd6467a7a5880f274fe4600134e",\n      "canonical_task_merge": "60108c02df8397eda854d31c51eb37ee2e3fbe45",\n      "post_merge_recovery_run_id": 34231594716,\n      "successor_task": "B2R14"\n    }\n  ],'''
          new='''  "completed_recovery_tasks": ["B2R13","B2R14"],\n  "active_recovery_unit": "B2R15",\n  "transition_proofs": [\n    {\n      "completed_task": "B2R13",\n      "canonical_task_base": "dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff",\n      "qualified_task_head": "43f9d5bcb4465bd6467a7a5880f274fe4600134e",\n      "canonical_task_merge": "60108c02df8397eda854d31c51eb37ee2e3fbe45",\n      "post_merge_recovery_run_id": 34231594716,\n      "successor_task": "B2R14"\n    },\n    {\n      "completed_task": "B2R14",\n      "canonical_task_base": "2f4212228f24e40fbd03cfc59ab4774df94c0cc3",\n      "qualified_task_head": "c60751c43a2523879814d691011d5dd6d3d1e119",\n      "canonical_task_merge": "e07e9bf7b7bdff3fdb41cc421140a9d6bdd8b3ca",\n      "post_merge_recovery_run_id": 34246855454,\n      "successor_task": "B2R15"\n    }\n  ],'''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old_next='  "next_action": "Qualify B2R14 only: implement and verify the corrected sherpa-onnx result-extraction harness against the frozen deterministic synthetic non-primary fixture and exact pinned upstream source. Preserve plain-string results exactly, fail closed on object/string API confusion, do not access primary corpus material, and keep all ATTEMPT-003 primary decoding closed until B2R16 is canonically reconciled.",'
          new_next='  "next_action": "Qualify B2R15 only: capture or cryptographically rebind ATTEMPT-003 preprocessing and execution-environment evidence while preserving the frozen subset, candidate, scorer, normalization, and C0 identities. Do not perform any primary decode; ATTEMPT-003 remains unfrozen and primary decoding remains closed until B2R16 is separately qualified, merged, post-merge verified, and canonically reconciled.",'
          assert s.count(old_next)==1
          s=s.replace(old_next,new_next,1)
          p.write_text(s)
          r=json.loads(s)
          assert r['completed_recovery_tasks']==['B2R13','B2R14'] and r['active_recovery_unit']=='B2R15'
          assert r['replacement_attempt']['frozen'] is False and r['replacement_attempt']['primary_decode_entry_open'] is False
          assert r['transition_proofs'][-1]['canonical_task_merge']==merge
          assert r['transition_proofs'][-1]['post_merge_recovery_run_id']==int(run)

          p=Path('specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md')
          s=p.read_text()
          old='- [ ] `B2R14` — Qualify a corrected sherpa-onnx result-extraction harness against non-primary material only, including fail-closed string/object API regression coverage. No primary decode.'
          assert s.count(old)==1
          p.write_text(s.replace(old,old.replace('- [ ]','- [x]',1),1))

          p=Path('specs/CURRENT.md')
          s=p.read_text()
          old='**Status:** founding research active; ACP verified; B1 historical preregistration verified; public-corpus B2 methodology canonical; qualification-chronology gate `SATISFIED`; public-corpus B2 ATTEMPT-003 recovery active; B2R13 canonical and post-merge verified; active successor recovery unit `B2R14`; ATTEMPT-002 invalidated; ATTEMPT-003 primary decoding closed'
          new='**Status:** founding research active; ACP verified; B1 historical preregistration verified; public-corpus B2 methodology canonical; qualification-chronology gate `SATISFIED`; public-corpus B2 ATTEMPT-003 recovery active; B2R14 corrective requalification canonical and post-merge verified; active successor recovery unit `B2R15`; ATTEMPT-002 invalidated; ATTEMPT-003 primary decoding closed'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          s += f'''\n\n## Canonical ATTEMPT-003 B2R14 corrective recovery reconciliation\n\nB2R14 is canonically complete only through corrective requalification. Historical merge `2f4212228f24e40fbd03cfc59ab4774df94c0cc3` remains preserved Git history but is ineligible as completion because its required fresh independent substantive exact-range review did not finish before closure. Corrective PR #97 repaired the independently identified workflow/ref and completion-evidence defects forward-only, received fresh independent substantive review of exact range `{task_base}` through `{head}` with no actionable substantive findings, and merged normally as `{merge}` with first parent `{task_base}` and second parent `{head}`. Exact `main` push run `{run}` of `000B2 Public Corpus ATTEMPT-003 Recovery` (`workflow_id=352653404`) completed successfully on that exact corrective merge SHA.\n\n**Canonical successor recovery predecessor:** `B2R14`\n**Canonical B2R14 task base:** `{task_base}`\n**Canonical B2R14 qualified head:** `{head}`\n**Canonical B2R14 corrective recovery merge:** `{merge}`\n**Canonical B2R14 post-merge recovery run:** `{run}`\n**Active successor recovery unit:** `B2R15`\n**ATTEMPT-003 required:** `true`\n**ATTEMPT-003 frozen:** `false`\n**ATTEMPT-003 primary decode entry open:** `false`\n\nThe sole next bounded action is B2R15: capture or cryptographically rebind ATTEMPT-003 preprocessing and execution-environment evidence while preserving frozen subset, candidate, scorer, normalization, and C0 identities. No primary decode is authorized. B2R16 and later successors remain closed until B2R15 is separately qualified, merged, post-merge verified, and reconciled. Comparative scoring/ranking, production selection, and product-code authority remain closed; `HUMAN_DEVELOPER_SPEECH_ACCURACY_EVIDENCE=ABSENT` remains preserved.\n'''
          p.write_text(s)

          p=Path('docs/canonical/CURRENT_STATE.md')
          s=p.read_text()
          old='; B2R13 is canonical at merge `60108c02df8397eda854d31c51eb37ee2e3fbe45` from exact qualified head `43f9d5bcb4465bd6467a7a5880f274fe4600134e` and post-merge ATTEMPT-003 Recovery run `34231594716` succeeded; active successor recovery unit is `B2R14`; ATTEMPT-003 remains unfrozen and primary decoding is closed'
          new=f'; B2R13 is canonical at merge `60108c02df8397eda854d31c51eb37ee2e3fbe45`; B2R14 is canonically complete only through corrective requalification merge `{merge}` from exact qualified head `{head}` with post-merge ATTEMPT-003 Recovery run `{run}` successful; active successor recovery unit is `B2R15`; ATTEMPT-003 remains unfrozen and primary decoding is closed'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          s += f'''\n\n## Canonical ATTEMPT-003 B2R14 corrective recovery reconciliation\n\nThe earlier B2R14 merge `2f4212228f24e40fbd03cfc59ab4774df94c0cc3` is preserved as historical Git truth but is ineligible as B2R14 completion because its required independent substantive exact-range review did not finish before closure. Corrective PR #97 preserved the exact four-path B2R14 boundary, repaired the independently identified workflow/ref and completion-evidence defects forward-only, and received fresh independent substantive review of exact base `{task_base}` through exact final head `{head}` with no actionable substantive findings before merge. The guarded normal corrective merge is `{merge}`, with first parent `{task_base}` and second parent `{head}`. Exact post-merge `000B2 Public Corpus ATTEMPT-003 Recovery` push run `{run}` (`workflow_id=352653404`) succeeded on `{merge}`.\n\n**ATTEMPT-002 status:** `INVALIDATED_MATERIAL_EXECUTION_DRIFT`\n**Canonical successor recovery predecessor:** `B2R14`\n**Canonical B2R14 task base:** `{task_base}`\n**Canonical B2R14 qualified head:** `{head}`\n**Canonical B2R14 corrective recovery merge:** `{merge}`\n**Canonical B2R14 post-merge recovery run:** `{run}`\n**Active successor recovery unit:** `B2R15`\n**ATTEMPT-003 required:** `true`\n**ATTEMPT-003 frozen:** `false`\n**ATTEMPT-003 primary decode entry open:** `false`\n\nB2R15 alone is the proposed next bounded unit after this reconciliation becomes independently qualified, normally merged, post-merge verified, and canonical authority is reread. It may only capture or cryptographically rebind ATTEMPT-003 preprocessing and execution-environment evidence. Primary decoding and scoring remain closed; B2R16+ remain unauthorized; all ATTEMPT-002 historical bytes and claim guards remain preserved.\n'''
          p.write_text(s)
          PY
          expected=$(printf '%s\n' docs/canonical/CURRENT_STATE.md research/000b2-public/recovery-attempt-003-readiness.json specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md specs/CURRENT.md | sort)
          test "$(git diff --name-only "$CANONICAL_BASE" -- | sort)" = "$expected"
          git diff --check
          python research/000b2-public/verify_attempt_002_invalidation.py --static-only
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add docs/canonical/CURRENT_STATE.md research/000b2-public/recovery-attempt-003-readiness.json specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md specs/CURRENT.md
          git commit -m 'docs(b2): reconcile corrective B2R14 and authorize B2R15'
          test "$(git rev-parse HEAD^)" = "$CANONICAL_BASE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Verify minimal published candidate
        shell: bash
        run: |
          set -euo pipefail
          head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$head" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_BASE"
          test "$(git diff --name-only "$CANONICAL_BASE" "$head" | sort)" = "$(printf '%s\n' docs/canonical/CURRENT_STATE.md research/000b2-public/recovery-attempt-003-readiness.json specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md specs/CURRENT.md | sort)"
          echo "B2R14_CORRECTIVE_RECONCILIATION_HEAD=$head"
