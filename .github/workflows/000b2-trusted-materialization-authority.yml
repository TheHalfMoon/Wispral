name: 000B2 Trusted Materialization Authority

on:
  pull_request:
    paths:
      - '.github/trusted/verify_000b2_materialization.py'
      - '.github/workflows/000b2-trusted-materialization-authority.yml'
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile trusted verifier
        run: python -m py_compile .github/trusted/verify_000b2_materialization.py
      - name: Exercise fail-closed local self-test
        run: python .github/trusted/verify_000b2_materialization.py --self-test

  verify-pr-head-artifact-identity:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.number == 10
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout canonical base authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout untrusted PR head as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record exact trust boundary
        run: |
          echo "TRUSTED_BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "CANDIDATE_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
      - name: Reproduce exact pending artifact identities from canonical authority
        run: |
          python trusted-base/.github/trusted/verify_000b2_materialization.py \
            --base-root trusted-base \
            --candidate-root candidate

  resolve-active-b2-head:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      active: ${{ steps.pr.outputs.active }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: pr
        name: Resolve current PR #10 state and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls/10",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Wispral-trusted-artifact-identity/1",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pr = json.load(response)
          active = pr.get("state") == "open" and pr.get("base", {}).get("ref") == "main"
          head_sha = pr.get("head", {}).get("sha", "") if active else ""
          if active and not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("active PR #10 head SHA is malformed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"active={'true' if active else 'false'}\n")
              output.write(f"head_sha={head_sha}\n")
          print(f"ACTIVE_B2_PR={'YES' if active else 'NO'}")
          if active:
              print(f"CANDIDATE_HEAD_SHA={head_sha}")
          PY

  reverify-active-b2-after-base-push:
    if: github.event_name == 'push' && needs.resolve-active-b2-head.outputs.active == 'true'
    needs: resolve-active-b2-head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout new canonical base authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout exact active B2 PR head as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-active-b2-head.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record refreshed trust boundary
        run: |
          echo "TRUSTED_BASE_SHA=${{ github.sha }}"
          echo "CANDIDATE_HEAD_SHA=${{ needs.resolve-active-b2-head.outputs.head_sha }}"
      - name: Reproduce exact pending artifact identities against new canonical base
        run: |
          python trusted-base/.github/trusted/verify_000b2_materialization.py \
            --base-root trusted-base \
            --candidate-root candidate
