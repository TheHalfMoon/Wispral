name: 000B2 Public Corpus B2E02 Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/000b2-public-b2e02.yml'
      - 'research/000b2-public/decode_b2e02.py'
      - 'research/000b2-public/verify_b2e02.py'
      - 'research/000b2-public/b2e02-moonshine-balanced.json'
      - 'research/000b2-public/b2e02-moonshine-balanced-duplicate-run-33963021322.json'
      - 'research/000b2-public/b2e02-provenance.json'
      - 'research/000b2-public/attempt-manifest.json'
      - 'research/000b2-public/preprocessing-capture.json'
      - 'research/000b2-public/readiness.json'
      - 'specs/CURRENT.md'
      - 'specs/000B2-public-corpus-bakeoff/tasks.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/000b2-public-b2e02.yml'
      - 'research/000b2-public/decode_b2e02.py'
      - 'research/000b2-public/verify_b2e02.py'
      - 'research/000b2-public/b2e02-moonshine-balanced.json'
      - 'research/000b2-public/b2e02-moonshine-balanced-duplicate-run-33963021322.json'
      - 'research/000b2-public/b2e02-provenance.json'
      - 'research/000b2-public/attempt-manifest.json'
      - 'research/000b2-public/preprocessing-capture.json'
      - 'research/000b2-public/readiness.json'
      - 'specs/CURRENT.md'
      - 'specs/000B2-public-corpus-bakeoff/tasks.md'

permissions:
  contents: read

concurrency:
  group: 000b2-b2e02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-b2e02-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          echo "EXACT_REVISION=$EXACT_REVISION"

      - name: Compile B2E02 execution and verifier sources
        run: |
          set -euo pipefail
          python -m py_compile \
            research/000b2-public/decode_b2e02.py \
            research/000b2-public/verify_b2e02.py

      - name: Verify repository-root revision lookup
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import importlib.util
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          module_path = Path("research/000b2-public/decode_b2e02.py").resolve()
          spec = importlib.util.spec_from_file_location("decode_b2e02_review_test", module_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              cwd=module.ROOT,
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout.strip()
          original = Path.cwd()
          try:
              with tempfile.TemporaryDirectory() as temporary:
                  os.chdir(temporary)
                  assert module.git_head() == expected
          finally:
              os.chdir(original)
          print("B2E02_REPOSITORY_ROOT_REVISION_LOOKUP=PASS")
          PY

      - name: Verify short candidate list fails closed
        shell: bash
        run: |
          set -euo pipefail
          manifest=research/000b2-public/attempt-manifest.json
          original="$RUNNER_TEMP/b2e02-candidate-list-original.json"
          cp "$manifest" "$original"
          cleanup() { cp "$original" "$manifest"; }
          trap cleanup EXIT
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("research/000b2-public/attempt-manifest.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          value["candidate_set"]["candidate_ids"] = value["candidate_set"]["candidate_ids"][:1]
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          rm -f "$RUNNER_TEMP/b2e02-short-candidate-output.json"
          set +e
          output=$(PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/decode_b2e02.py \
            --work-dir "$RUNNER_TEMP/b2e02-short-candidate-work" \
            --preprocessed-root "$RUNNER_TEMP/b2e02-short-candidate-preprocessed" \
            --output "$RUNNER_TEMP/b2e02-short-candidate-output.json" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fqx 'B2E02_EXECUTION=FAIL: candidate cell 2 drift' <<<"$output"
          test ! -e "$RUNNER_TEMP/b2e02-short-candidate-output.json"

      - name: Verify invalid attempt freeze digest fails closed
        shell: bash
        run: |
          set -euo pipefail
          manifest=research/000b2-public/attempt-manifest.json
          original="$RUNNER_TEMP/b2e02-attempt-manifest-original.json"
          cp "$manifest" "$original"
          cleanup() { cp "$original" "$manifest"; }
          trap cleanup EXIT

          for mode in missing malformed; do
            cp "$original" "$manifest"
            MODE="$mode" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("research/000b2-public/attempt-manifest.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          if os.environ["MODE"] == "missing":
              value.pop("freeze_digest_sha256", None)
          else:
              value["freeze_digest_sha256"] = "not-a-valid-digest"
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            rm -f "$RUNNER_TEMP/b2e02-negative-output.json"
            set +e
            output=$(PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/decode_b2e02.py \
              --work-dir "$RUNNER_TEMP/b2e02-negative-work" \
              --preprocessed-root "$RUNNER_TEMP/b2e02-negative-preprocessed" \
              --output "$RUNNER_TEMP/b2e02-negative-output.json" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            test "$status" -eq 1
            grep -Fqx 'B2E02_EXECUTION=FAIL: attempt freeze digest missing or malformed' <<<"$output"
            test ! -e "$RUNNER_TEMP/b2e02-negative-output.json"
          done

      - name: Verify sealed and reconciled B2E02 execution evidence
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e02.py

      - name: Preserve raw-data boundary
        run: |
          set -euo pipefail
          test ! -e research/000b2-public/raw
          test ! -e research/000b2-public/preprocessed
          echo 'B2E02_RAW_DATA_BOUNDARY=PASS'
