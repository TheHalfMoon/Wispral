name: Patch PR106 Recovery Control Repair

on:
  push:
    branches:
      - automation/patch-pr106-recovery-control-repair

permissions:
  contents: write

jobs:
  patch-pr106:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR106 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/b2r16-trusted-exact-scope-control
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e4152b019dbf597b4df56eb58554f94418f556fd"

      - name: Apply exact two-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <(git show origin/automation/patch-pr106-recovery-control-repair:.github/automation/patch_pr106_recovery_control_repair.py)
          python3 -m py_compile research/000b2-public/verify_attempt_002_invalidation.py
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          test "$(git diff --name-only | sed -n '1p')" = ".github/workflows/000b2-public-attempt-003-recovery.yml"
          test "$(git diff --name-only | sed -n '2p')" = "research/000b2-public/verify_attempt_002_invalidation.py"
          git diff --name-status

      - name: Commit and push forward-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/000b2-public-attempt-003-recovery.yml research/000b2-public/verify_attempt_002_invalidation.py
          git commit -m "fix(000b2): qualify Recovery control-repair lane"
          git push origin HEAD:fix/b2r16-trusted-exact-scope-control
