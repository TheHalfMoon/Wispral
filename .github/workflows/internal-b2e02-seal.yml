name: Internal B2E02 Evidence Seal

on:
  push:
    branches:
      - research/000b2-b2e02-moonshine-balanced
    paths:
      - '.github/workflows/internal-b2e02-seal.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: b2e02-evidence-seal
  cancel-in-progress: false

jobs:
  seal-b2e02-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_REVISION: 43cab310662b6e8eb1ea25b6d8e39a6dbf14a17e
      EXPECTED_RUN_ID: '33962004933'
      EXPECTED_RUN_ATTEMPT: '1'
      EXPECTED_JOB_ID: '101295384896'
      EXPECTED_ARTIFACT_ID: '9968333519'
      EXPECTED_ARTIFACT_NAME: b2e02-moonshine-balanced-43cab310662b6e8eb1ea25b6d8e39a6dbf14a17e
      EXPECTED_ARTIFACT_ZIP_SHA256: 0cb9ae81262a6af0a5eb2382ac1fccdae6488c8a04d8551a912bdf8ff9d818ad
      EXPECTED_EVIDENCE_SHA256: 8bc1b3e2e10bd7c64465b424f8dff5ffc84a153868459457d91e22e5cf3da253
      EXPECTED_PAYLOAD_SHA256: ad2baccb196313323b0284d5672f94d9ffae551f0b2af38cc29b4be082e6a6aa
    steps:
      - name: Checkout exact sealing head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact captured artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b2e02-seal"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/b2e02-seal/artifact.zip"
          echo "$EXPECTED_ARTIFACT_ZIP_SHA256  $RUNNER_TEMP/b2e02-seal/artifact.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/b2e02-seal/artifact.zip" -d "$RUNNER_TEMP/b2e02-seal/unpacked"
          test "$(find "$RUNNER_TEMP/b2e02-seal/unpacked" -maxdepth 1 -type f | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/b2e02-seal/unpacked/b2e02-moonshine-balanced.json"
          echo "$EXPECTED_EVIDENCE_SHA256  $RUNNER_TEMP/b2e02-seal/unpacked/b2e02-moonshine-balanced.json" | sha256sum --check --strict

      - name: Verify raw execution evidence before sealing
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_b2e02.py \
            --evidence "$RUNNER_TEMP/b2e02-seal/unpacked/b2e02-moonshine-balanced.json"

      - name: Seal raw evidence and GitHub provenance
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/b2e02-seal/unpacked/b2e02-moonshine-balanced.json" \
            research/000b2-public/b2e02-moonshine-balanced.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "schema_version": "000b2-public-b2e02-provenance-v1",
              "task": "B2E02",
              "attempt_id": "000B2-PUBLIC-ATTEMPT-001",
              "candidate_id": "moonshine-balanced",
              "capture": {
                  "source_revision": os.environ["EXPECTED_SOURCE_REVISION"],
                  "workflow_name": "Internal B2E02 Public C0 Capture",
                  "event": "push",
                  "run_id": int(os.environ["EXPECTED_RUN_ID"]),
                  "run_attempt": int(os.environ["EXPECTED_RUN_ATTEMPT"]),
                  "job_id": int(os.environ["EXPECTED_JOB_ID"]),
                  "artifact_id": int(os.environ["EXPECTED_ARTIFACT_ID"]),
                  "artifact_name": os.environ["EXPECTED_ARTIFACT_NAME"],
                  "artifact_zip_sha256": os.environ["EXPECTED_ARTIFACT_ZIP_SHA256"],
              },
              "evidence": {
                  "path": "research/000b2-public/b2e02-moonshine-balanced.json",
                  "raw_file_sha256": os.environ["EXPECTED_EVIDENCE_SHA256"],
                  "payload_sha256": os.environ["EXPECTED_PAYLOAD_SHA256"],
                  "input_count": 240,
                  "decoded_count": 240,
                  "failure_count": 0,
              },
              "claims": {
                  "timing_semantics": "DIAGNOSTIC_ONLY",
                  "comparative_performance_authorized": False,
                  "b2e03_authorized": False,
                  "human_developer_speech_accuracy_evidence": "ABSENT",
                  "production_stt_selected": False,
                  "product_code_authorized": False,
              },
              "selection_basis": "SOLE_SUCCESSFUL_AUTHORIZED_B2E02_CAPTURE_RUN; NOT_RESULT_DRIVEN",
              "provenance_status": "RECORDED_FROM_EXACT_GITHUB_ACTIONS_RUN_AND_ARTIFACT_METADATA",
          }
          Path("research/000b2-public/b2e02-provenance.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test "$(sha256sum research/000b2-public/b2e02-moonshine-balanced.json | cut -d' ' -f1)" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Commit sealed evidence forward-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/000b2-public/b2e02-moonshine-balanced.json \
            research/000b2-public/b2e02-provenance.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'expected sealed evidence changes are absent' >&2; exit 1; }
          git commit -m 'research(000b2): seal B2E02 moonshine-balanced evidence'
          git push origin HEAD:research/000b2-b2e02-moonshine-balanced
