name: Internal B2R07 Decoder Bootstrap

on:
  push:
    branches:
      - research/000b2-b2r07-execution
    paths:
      - '.github/workflows/internal-b2r07-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: b2r07-decoder-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-b2r07:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      B2R07_REVISION: ${{ github.sha }}
      CANONICAL_BASE: 16104eacf2d571276452d173ddb54c089faccd0e
      TASK_BRANCH: research/000b2-b2r07-whispercpp-compact
      EXECUTION_BRANCH: research/000b2-b2r07-execution
    steps:
      - name: Checkout exact bootstrap revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.B2R07_REVISION }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify canonical base and immutable donor blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B2R07_REVISION"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git hash-object research/000b2-public/decode_b2r07.py)" = "9b0b16df7c06068b3ffa70e88203f56fbe44b7f2"
          test "$(git hash-object research/000b2-public/whispercpp-adapter/CMakeLists.txt)" = "e975e7d4afd0f580881b17a7e9c2856634ec61e7"
          test "$(git hash-object research/000b2-public/whispercpp-adapter/adapter.cpp)" = "e7405cd343532b7d9dff8b667bfc7591f50631d9"
          test "$(git rev-parse "$TASK_BRANCH")" = "$CANONICAL_BASE" 2>/dev/null || test "$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)" = "$CANONICAL_BASE"

      - name: Rebind historical pre-primary Whisper adapter decoder to B2R07 authority
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path
          import re

          path = Path('research/000b2-public/decode_b2r07.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('B2E03', 'B2R07').replace('b2e03', 'b2r07')
          text = text.replace('B2E04', 'B2R08').replace('b2e04', 'b2r08')
          text = text.replace('READINESS_PATH = PUBLIC / "readiness.json"', 'READINESS_PATH = PUBLIC / "recovery-readiness.json"')
          text = text.replace('ATTEMPT_MANIFEST_PATH = PUBLIC / "attempt-manifest.json"', 'ATTEMPT_MANIFEST_PATH = PUBLIC / "attempt-002-manifest.json"')
          text = text.replace(
              'PREPROCESSING_CAPTURE_PATH = PUBLIC / "preprocessing-capture.json"',
              'PREPROCESSING_CAPTURE_PATH = PUBLIC / "preprocessing-capture.json"\nREBINDING_PATH = PUBLIC / "b2r03-preexecution-rebinding.json"\nFROZEN_METHODOLOGY_PATH = ROOT / "research" / "000b1" / "frozen-methodology.json"\nCANDIDATE_REGISTRY_PATH = ROOT / "research" / "000b1" / "qualified-candidates.json"\nCANONICAL_CURRENT_PATH = ROOT / "docs" / "canonical" / "CURRENT_STATE.md"'
          )
          text = text.replace('SCHEMA = "000b2-public-b2r07-decode-v1"', 'SCHEMA = "000b2-public-b2r07-decode-v1"')
          text = text.replace('ATTEMPT_ID = "000B2-PUBLIC-ATTEMPT-001"', 'ATTEMPT_ID = "000B2-PUBLIC-ATTEMPT-002"')
          text = text.replace('EXPECTED_AUTHORITY_BASE = "b326397cdd29fbb132b9c438ba2178626558efab"', 'EXPECTED_AUTHORITY_BASE = "16104eacf2d571276452d173ddb54c089faccd0e"')
          text = text.replace('EXPECTED_FREEZE = "af4d5009e293daef5d8f629ca91af653f5f591448cd94d4555473a51e2d1da86"', 'EXPECTED_FREEZE = "600a286747ef2e1503a48c4138b6e405665ccd6586904ef65b3638b49974bcc8"')
          text = text.replace(
              'EXPECTED_PREPROCESSING = "d90e5215081191134d8e714778140bfeee8080eb77aedc3a159b2dfed6e2d011"',
              'EXPECTED_PREPROCESSING = "d90e5215081191134d8e714778140bfeee8080eb77aedc3a159b2dfed6e2d011"\nEXPECTED_REBINDING = "f9cda5168e6cafb6a1e9e6898f394ec3987b37af50c53c15cf63bc136c1f2df1"\nEXPECTED_FROZEN_METHODOLOGY = "fc177308926941e683f311a340b9e398f2c44ffa32963b3abc20aa359dbb09df"\nEXPECTED_REGISTRY = "2448daab15aea13d1e03c326e43b163337a4e3a09ec077bb0f25e3dd51499f1f"'
          )
          text = text.replace('os.environ.get("B2R07_CONTAINER_IMAGE", "")', 'os.environ.get("B2R07_CONTAINER_IMAGE", "")')
          new_authority = '''def validate_authority() -> tuple[dict[str, Any], dict[str, Any], dict[str, Any]]:
              attempt = load_json(ATTEMPT_MANIFEST_PATH, "frozen ATTEMPT-002 manifest")
              require(attempt.get("schema_version") == "000b2-public-attempt-002-manifest-v1", "ATTEMPT-002 schema drift")
              require(attempt.get("attempt_id") == ATTEMPT_ID, "ATTEMPT-002 id drift")
              require(attempt.get("frozen") is True and attempt.get("phase") == "PRE_PRIMARY_FROZEN", "ATTEMPT-002 freeze state drift")
              require(attempt.get("freeze_digest_sha256") == EXPECTED_FREEZE, "ATTEMPT-002 freeze digest drift")

              candidate_set = attempt.get("candidate_set")
              require(isinstance(candidate_set, dict), "ATTEMPT-002 candidate set missing")
              candidate_ids = candidate_set.get("candidate_ids")
              require(candidate_ids == EXPECTED_CANDIDATE_IDS, "frozen candidate set drift")
              require(candidate_ids[2] == CANDIDATE_ID, "candidate cell 3 drift")
              require(candidate_set.get("membership_change_after_freeze_allowed") is False, "candidate membership became mutable")
              require(candidate_set.get("frozen_methodology_sha256") == EXPECTED_FROZEN_METHODOLOGY, "frozen methodology binding drift")
              require(candidate_set.get("registry_sha256") == EXPECTED_REGISTRY, "candidate registry binding drift")
              require(sha256_file(FROZEN_METHODOLOGY_PATH) == EXPECTED_FROZEN_METHODOLOGY, "frozen methodology bytes drift")
              require(sha256_file(CANDIDATE_REGISTRY_PATH) == EXPECTED_REGISTRY, "candidate registry bytes drift")

              contract = attempt.get("decoding_contract")
              require(isinstance(contract, dict), "ATTEMPT-002 decoding contract missing")
              require(contract.get("c0_repository_context") == "OFF", "repository context is not OFF")
              require(contract.get("c0_test_specific_context") == "OFF", "test-specific context is not OFF")
              require(contract.get("candidate_specific_audio_transform") == "OFF", "candidate-specific audio transform is not OFF")
              require(contract.get("identical_frozen_audio_required_across_candidates") is True, "identical frozen audio invariant drift")
              require(contract.get("raw_outputs_and_failures_must_be_preserved") is True, "raw-output preservation invariant drift")

              readiness = load_json(READINESS_PATH, "recovery readiness")
              require(readiness.get("state") == "RECOVERY_READY", "recovery lane is not ready")
              require(readiness.get("active_recovery_unit") == TASK, "B2R07 is not the active recovery unit")
              require(readiness.get("completed_recovery_tasks") == ["B2R01", "B2R02", "B2R03", "B2R04", "B2R05", "B2R06"], "B2R07 predecessor ledger drift")
              require(readiness.get("qualified_workflow_change_paths") == [], "B2R07 unexpectedly authorizes workflow drift")
              next_action = readiness.get("next_action")
              require(isinstance(next_action, str) and next_action.startswith("Qualify B2R07 only:"), "B2R07 is not the sole canonical next action")
              require("whispercpp-compact" in next_action, "B2R07 candidate identity missing from canonical next action")
              require("Keep B2R08" in next_action, "B2R08 successor boundary missing from canonical next action")
              replacement = readiness.get("replacement_attempt")
              require(isinstance(replacement, dict) and replacement.get("attempt_id") == ATTEMPT_ID, "replacement attempt identity drift")
              require(replacement.get("frozen") is True and replacement.get("primary_decode_entry_open") is True, "ATTEMPT-002 primary entry is not open")
              guards = readiness.get("claim_guards")
              require(isinstance(guards, dict), "recovery claim guards missing")
              require(guards.get("human_developer_speech_accuracy_evidence") == "ABSENT", "developer-speech claim guard drift")
              require(guards.get("comparative_result_available") is False, "comparative result opened before scoring")
              require(guards.get("production_stt_selected") is False, "production STT selected during recovery")
              require(guards.get("product_code_authorized") is False, "product code authorized during recovery")

              tasks = TASKS_PATH.read_text(encoding="utf-8")
              current = CURRENT_PATH.read_text(encoding="utf-8")
              canonical_current = CANONICAL_CURRENT_PATH.read_text(encoding="utf-8")
              require("- [x] `B2R06`" in tasks and "- [ ] `B2R07`" in tasks and "- [ ] `B2R08`" in tasks, "B2R06/B2R07/B2R08 task boundary drift")
              require("active recovery unit `B2R07`" in current, "CURRENT does not own B2R07 frontier")
              require("**Active recovery unit:** `B2R07`" in canonical_current, "canonical CURRENT_STATE does not own B2R07 frontier")

              preprocessing = load_json(PREPROCESSING_CAPTURE_PATH, "B2P06 preprocessing capture")
              require(sha256_file(PREPROCESSING_CAPTURE_PATH) == EXPECTED_PREPROCESSING, "preprocessing capture bytes drift")
              execution = preprocessing.get("execution")
              require(isinstance(execution, dict), "preprocessing execution block missing")
              records = execution.get("records")
              require(isinstance(records, list) and len(records) == EXPECTED_UTTERANCES, "preprocessing record count drift")
              require(execution.get("all_source_hashes_reverified") is True, "source hashes were not reverified in B2P06")
              require(execution.get("all_outputs_verified_pcm_s16le_mono_16000hz") is True, "frozen preprocessing format invariant missing")

              rebinding = load_json(REBINDING_PATH, "B2R03 preexecution rebinding")
              require(sha256_file(REBINDING_PATH) == EXPECTED_REBINDING, "B2R03 rebinding bytes drift")
              require(rebinding.get("task") == "B2R03", "B2R03 rebinding task drift")
              require(rebinding.get("attempt", {}).get("attempt_id") == ATTEMPT_ID, "B2R03 attempt binding drift")
              preserved = rebinding.get("preserved_identity_guards")
              require(isinstance(preserved, dict), "B2R03 preserved identity guards missing")
              require(preserved.get("subset_manifest_sha256") == "5fa108dc623760f194fdde463cbfb819288fe8f2a10279d25ec889f221b389bb", "subset identity drift")
              require(preserved.get("candidate_registry_sha256") == EXPECTED_REGISTRY, "candidate identity drift")
              require(preserved.get("c0_repository_context") == "OFF" and preserved.get("c0_test_specific_context") == "OFF", "B2R03 C0 context drift")
              environment = rebinding.get("execution_environment_rebinding")
              require(isinstance(environment, dict), "B2R03 environment rebinding missing")
              require(environment.get("bound_attempt_id") == ATTEMPT_ID, "B2R03 environment attempt binding drift")
              require(environment.get("performance_mode") == "DIAGNOSTIC", "B2R03 timing semantics drift")
              require(environment.get("comparative_performance_authorized") is False, "comparative timing unexpectedly authorized")
              return readiness, attempt, preprocessing'''
          text, count = re.subn(
              r'def validate_authority\(\) -> tuple\[dict\[str, Any\], dict\[str, Any\], dict\[str, Any\]\]:.*?\n\ndef build_preprocessing_index',
              new_authority + '\n\ndef build_preprocessing_index',
              text,
              flags=re.S,
          )
          assert count == 1, count
          text = text.replace('"state": "C0_PRIMARY_DECODE_CAPTURED"', '"state": "ATTEMPT_002_C0_PRIMARY_DECODE_CAPTURED"')
          text = text.replace('"attempt_manifest_path": "research/000b2-public/attempt-manifest.json"', '"attempt_manifest_path": "research/000b2-public/attempt-002-manifest.json"')
          old_guards = '''"claim_guards": {
                  "candidate_decoding_started": True,
                  "primary_decoding_started": True,
                  "completed_through": "B2R07_EXECUTION_ONLY",
                  "b2r08_authorized": False,
                  "human_developer_speech_accuracy_evidence": "ABSENT",
                  "production_stt_selected": False,
                  "product_code_authorized": False,
              },'''
          new_guards = '''"claim_guards": {
                  "human_developer_speech_accuracy_evidence": "ABSENT",
                  "comparative_result_available": False,
                  "comparative_performance_authorized": False,
                  "production_stt_selected": False,
                  "product_code_authorized": False,
                  "b2r08_authorized": False,
              },'''
          assert old_guards in text
          text = text.replace(old_guards, new_guards)
          assert 'ATTEMPT-001' not in text
          assert 'readiness.json' not in text.replace('recovery-readiness.json', '')
          assert 'B2E03' not in text and 'B2E04' not in text
          assert 'b2e03' not in text and 'b2e04' not in text
          assert 'B2R07' in text and 'B2R08_AUTHORIZED=NO' in text
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          print('B2R07_REBIND=PASS')
          PY

      - name: Verify generated B2R07 authority before any primary workflow exists
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('research/000b2-public/decode_b2r07.py')
          spec = importlib.util.spec_from_file_location('wispral_b2r07_decoder', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate_authority()
          assert module.TASK == 'B2R07'
          assert module.ATTEMPT_ID == '000B2-PUBLIC-ATTEMPT-002'
          assert module.CANDIDATE_ID == 'whispercpp-compact'
          assert module.EXPECTED_AUTHORITY_BASE == '16104eacf2d571276452d173ddb54c089faccd0e'
          assert module.EXPECTED_RUNTIME_REVISION == '371b5a7561823ab2bb32142d2751e35e7534727b'
          assert module.EXPECTED_MODEL_SHA256 == 'a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002'
          print('B2R07_CURRENT_AUTHORITY=PASS')
          print('B2R08_AUTHORIZED=NO')
          PY
          test "$(git hash-object research/000b2-public/whispercpp-adapter/CMakeLists.txt)" = "e975e7d4afd0f580881b17a7e9c2856634ec61e7"
          test "$(git hash-object research/000b2-public/whispercpp-adapter/adapter.cpp)" = "e7405cd343532b7d9dff8b667bfc7591f50631d9"

      - name: Commit exact generated decoder and frozen adapter to clean task branch
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/b2r07-generated"
          rm -rf "$TMP"
          mkdir -p "$TMP/whispercpp-adapter"
          cp research/000b2-public/decode_b2r07.py "$TMP/decode_b2r07.py"
          cp research/000b2-public/whispercpp-adapter/CMakeLists.txt "$TMP/whispercpp-adapter/CMakeLists.txt"
          cp research/000b2-public/whispercpp-adapter/adapter.cpp "$TMP/whispercpp-adapter/adapter.cpp"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$TASK_BRANCH:$TASK_BRANCH"
          git switch "$TASK_BRANCH"
          test "$(git rev-parse HEAD)" = "$CANONICAL_BASE"
          mkdir -p research/000b2-public/whispercpp-adapter
          cp "$TMP/decode_b2r07.py" research/000b2-public/decode_b2r07.py
          cp "$TMP/whispercpp-adapter/CMakeLists.txt" research/000b2-public/whispercpp-adapter/CMakeLists.txt
          cp "$TMP/whispercpp-adapter/adapter.cpp" research/000b2-public/whispercpp-adapter/adapter.cpp
          git add research/000b2-public/decode_b2r07.py research/000b2-public/whispercpp-adapter/CMakeLists.txt research/000b2-public/whispercpp-adapter/adapter.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'research(000b2): implement B2R07 whispercpp decoder'
          git push origin "HEAD:$TASK_BRANCH"
          echo "TASK_HEAD=$(git rev-parse HEAD)"

      - name: Converge execution branch to exact generated decoder and remove bootstrap
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/b2r07-generated"
          git switch -C b2r07-execution "$B2R07_REVISION"
          cp "$TMP/decode_b2r07.py" research/000b2-public/decode_b2r07.py
          rm .github/workflows/internal-b2r07-bootstrap.yml
          git add research/000b2-public/decode_b2r07.py .github/workflows/internal-b2r07-bootstrap.yml
          git commit -m 'research(000b2): rebind B2R07 decoder to ATTEMPT-002'
          git push origin "HEAD:$EXECUTION_BRANCH"
          echo "EXECUTION_HEAD=$(git rev-parse HEAD)"
