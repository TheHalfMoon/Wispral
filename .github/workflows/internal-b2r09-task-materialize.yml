name: Internal B2R09 Evidence Materialization

on:
  push:
    branches:
      - ci/000b2-b2r09-task-materialize
    paths:
      - .github/workflows/internal-b2r09-task-materialize.yml

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact clean B2R09 task source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b7a4bb8828a4b861a399b1424bc07a4e549cf51f
          fetch-depth: 0
          persist-credentials: true

      - name: Verify refs and download exact evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=737e2fa0422e0d1aa0dd4d5bdc0473d51cec624c
          TASK_BRANCH=research/000b2-b2r09-sherpa-onnx-compact
          TASK_HEAD=b7a4bb8828a4b861a399b1424bc07a4e549cf51f
          EXEC_BRANCH=research/000b2-b2r09-execution
          EXEC_HEAD=47d1c53f6892dda437aa0f1d109f58f1cc5e101e
          ARTIFACT_ID=10031177463
          ZIP="$RUNNER_TEMP/b2r09.zip"
          test "$(git rev-parse HEAD)" = "$TASK_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TASK_BRANCH | cut -f1)" = "$TASK_HEAD"
          test "$(git ls-remote origin refs/heads/$EXEC_BRANCH | cut -f1)" = "$EXEC_HEAD"
          test "$(git hash-object research/000b2-public/decode_b2r09.py)" = 27052cc7f3d57d2743ee06a7db8de730c833935e
          test "$(git diff --name-only "$BASE" "$TASK_HEAD")" = research/000b2-public/decode_b2r09.py
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$ZIP"
          test "$(stat -c%s "$ZIP")" = 19519
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = 79652728032760ae133845b7f1308623a984ee69c490991cf190d8a7301985ea
          export ZIP
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile(os.environ['ZIP']) as z:
              assert z.namelist() == ['b2r09-sherpa-onnx-compact.json']
              raw = z.read('b2r09-sherpa-onnx-compact.json')
          assert len(raw) == 248426
          assert hashlib.sha256(raw).hexdigest() == 'd59fa9605e8b0cf6892cd5a7ece105c6abe0753ff8949e9206e35f42da9a003f'
          value = json.loads(raw)
          unsigned = dict(value)
          payload = unsigned.pop('evidence_payload_sha256')
          canonical = (json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode()
          assert payload == '4a81f1be21e18aa462ee9ec9c32a1daeaa6fa86bcca6372b0634a9421c16c1ed'
          assert hashlib.sha256(canonical).hexdigest() == payload
          assert value['task'] == 'B2R09'
          assert value['candidate']['candidate_id'] == 'sherpa-onnx-compact'
          assert value['run']['repository_revision'] == '47d1c53f6892dda437aa0f1d109f58f1cc5e101e'
          x = value['execution']
          assert (x['input_count'], x['decoded_count'], x['failure_count']) == (240, 240, 0)
          assert len(x['records']) == 240
          assert value['claim_guards']['b2r10_authorized'] is False
          Path('research/000b2-public/b2r09-sherpa-onnx-compact.json').write_bytes(raw)
          print('B2R09_ARTIFACT_BYTES=PASS')
          PY

      - name: Fast-forward task branch with exact evidence bytes only
        shell: bash
        run: |
          set -euo pipefail
          BASE=737e2fa0422e0d1aa0dd4d5bdc0473d51cec624c
          TASK_BRANCH=research/000b2-b2r09-sherpa-onnx-compact
          TASK_HEAD=b7a4bb8828a4b861a399b1424bc07a4e549cf51f
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TASK_BRANCH | cut -f1)" = "$TASK_HEAD"
          ACTUAL_SCOPE="$({ git diff --name-only "$BASE"; git ls-files --others --exclude-standard; } | sort -u)"
          test "$ACTUAL_SCOPE" = $'research/000b2-public/b2r09-sherpa-onnx-compact.json\nresearch/000b2-public/decode_b2r09.py'
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add research/000b2-public/b2r09-sherpa-onnx-compact.json
          git commit -m 'research(000b2): materialize exact B2R09 evidence bytes'
          test "$(git rev-parse HEAD^)" = "$TASK_HEAD"
          git push origin HEAD:refs/heads/$TASK_BRANCH
          echo "B2R09_EVIDENCE_HEAD=$(git rev-parse HEAD)"
