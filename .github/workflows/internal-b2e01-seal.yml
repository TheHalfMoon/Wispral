name: Internal B2E01 Duplicate Capture Cancel

on:
  push:
    branches:
      - research/000b2-b2e01-moonshine-compact
    paths:
      - '.github/workflows/internal-b2e01-seal.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DUPLICATE_RUN_ID: '33929116272'
      CANONICAL_CAPTURE_RUN_ID: '33928586213'
    steps:
      - name: Cancel duplicate pre-decode capture run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$DUPLICATE_RUN_ID" != "$CANONICAL_CAPTURE_RUN_ID"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN_ID/cancel"
          echo "B2E01_DUPLICATE_CAPTURE_CANCEL_REQUESTED=$DUPLICATE_RUN_ID"
          echo "B2E01_CANONICAL_CAPTURE_RUN=$CANONICAL_CAPTURE_RUN_ID"
