name: Temporary 000B2 review-fix editor

on:
  push:
    branches:
      - docs/000b2-reconcile-after-b2e02

permissions:
  contents: write

jobs:
  apply-exact-review-fix:
    if: github.sha == 'c1f4c3f53e6ea7daa6ab20fa03f633bb873ff085'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: docs/000b2-reconcile-after-b2e02
          fetch-depth: 0

      - name: Apply exact anchored verifier hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c1f4c3f53e6ea7daa6ab20fa03f633bb873ff085"
          python - <<'PY'
          from pathlib import Path

          path = Path("research/000b2-public/verify_methodology.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    require_absent(current, "Execute and canonically qualify `B2E02` only: decode the exact frozen P0 public-human subset with candidate cell 1 (`moonshine-compact`) under frozen C0", "current frontier stale B2E01 candidate identity")\n',
                  '    require_absent(current, "Execute and canonically qualify `B2E01` only: decode the exact frozen P0 public-human subset with candidate cell 1 (`moonshine-compact`) under frozen C0", "current frontier stale B2E01 candidate identity")\n',
              ),
              (
                  '    require_text(current_state, "current bounded execution unit is `B2E03`", "current state")\n',
                  '    require_text(current_state, "current bounded execution unit is `B2E03`", "current state")\n'
                  '    require_text(current_state, "Execute and canonically qualify `B2E03` only", "current state next action")\n'
                  '    require_text(current_state, "Execute and canonically qualify `B2E03` only: decode the identical frozen P0 public-human subset with candidate cell 3 (`whispercpp-compact`) under unchanged frozen C0", "current state exact B2E03 candidate/action identity")\n'
                  '    require_absent(current_state, "Execute and canonically qualify `B2E01` only: decode the exact frozen P0 public-human subset with candidate cell 1 (`moonshine-compact`) under frozen C0", "current state stale B2E01 next action")\n'
                  '    require_absent(current_state, "B2E01 is now the only authorized bounded execution unit", "current state stale B2E01-only authority")\n'
                  '    require_absent(current_state, "B2E01 is the sole authorized decoding unit, B2E02 and all later candidate cells remain unauthorized", "current state stale B2E01-only decoding authority")\n',
              ),
              (
                  '    print("B2E01_FRONTIER=AUTHORIZED")\n',
                  '    print("B2E03_FRONTIER=AUTHORIZED")\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one anchored match, got {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python research/000b2-public/verify_methodology.py
          git diff --check

      - name: Remove temporary editor and commit only the durable fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-000b2-review-fix.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/000b2-public/verify_methodology.py
          git commit -m "fix(000b2): harden stale authority verifier"
          git push origin HEAD:docs/000b2-reconcile-after-b2e02
