name: Internal B2R05 Reconciliation

on:
  push:
    branches:
      - docs/000b2-b2r05-reconciliation
    paths:
      - '.github/workflows/internal-b2r05-reconcile.yml'
      - 'research/000b2-public/internal_b2r05_reconcile.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact helper revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build, verify, and push reconciliation candidate
        run: python research/000b2-public/internal_b2r05_reconcile.py
