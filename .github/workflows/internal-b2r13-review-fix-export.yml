name: Internal B2R13 Review Fix Export

on:
  push:
    branches:
      - automation/b2r13-review-fix-edec6fe
    paths:
      - '.github/workflows/internal-b2r13-review-fix-export.yml'

permissions:
  contents: read

env:
  EXPECTED_TARGET_HEAD: edec6fe34657c69c9150266d3c09eb7d1b8298f9
  TARGET_BRANCH: recovery/b2r13-attempt-002-invalidation
  HELPER_BRANCH: automation/b2r13-review-fix-edec6fe

jobs:
  export-review-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable target frontier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff"
          test "$(git diff --name-only dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff HEAD -- | wc -l)" -eq 9

      - name: Reapply exact reviewed patch from helper payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          import subprocess

          helper = subprocess.run(
              ["git", "show", "origin/automation/b2r13-review-fix-edec6fe:.github/workflows/internal-b2r13-review-fix.yml"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout
          match = re.search(r"base64\.b64decode\('([A-Za-z0-9+/=]+)'\)", helper)
          if not match:
              raise SystemExit("review-fix payload missing from helper workflow")
          exec(base64.b64decode(match.group(1)), {})
          PY

      - name: Validate exact repaired bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/000b2-public/verify_attempt_002_invalidation.py research/000b2-public/verify_b2r13_activation.py
          rm -rf research/000b2-public/__pycache__
          grep -q 'B2R14_TRUSTED_CANDIDATE_HARNESS_SHAPE=PASS' .github/workflows/000b2-public-attempt-003-recovery.yml
          grep -q 'Candidate-supplied verifier code is intentionally never executed here.' research/000b2-public/verify_attempt_002_invalidation.py
          test "$(git diff --name-only "$EXPECTED_TARGET_HEAD" -- | sort)" = "$(printf '%s\n' .github/workflows/000b2-public-attempt-003-recovery.yml research/000b2-public/verify_attempt_002_invalidation.py specs/000B2-public-corpus-bakeoff/recovery-v2.md | sort)"
          git diff --check

      - name: Upload exact repaired bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2r13-review-fix-${{ github.sha }}
          path: |
            .github/workflows/000b2-public-attempt-003-recovery.yml
            research/000b2-public/verify_attempt_002_invalidation.py
            specs/000B2-public-corpus-bakeoff/recovery-v2.md
          if-no-files-found: error
          retention-days: 7
