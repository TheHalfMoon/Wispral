name: Internal B2P08 Reconciliation V3

on:
  push:
    branches:
      - research/000b2-b2p08-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/000b2-b2p08-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified B2P08 reconciliation candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readiness = json.loads(Path('research/000b2-public/readiness.json').read_text(encoding='utf-8'))
          if readiness.get('completed_through') != 'B2P07':
              raise SystemExit(f"unexpected entry frontier: {readiness.get('completed_through')!r}")

          # Reuse the already-repaired V2 transformation source, then repair the one
          # canonical next-action wording whose live text is newer than the bootstrap.
          workflow = Path('.github/workflows/internal-b2p08-reconciliation-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          source = workflow[start:end]
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines())
          exec(compile(source, '<b2p08-reconciliation-v2-apply>', 'exec'), {'__name__': '__main__'})

          current_path = Path('specs/CURRENT.md')
          current = current_path.read_text(encoding='utf-8')
          old = ('Execute and canonically qualify `B2P08` only: freeze the final pre-decode attempt manifest for '
                 '`000B2-PUBLIC-ATTEMPT-001`, binding the canonical B2P04 subset, B2P05 candidate revalidation, '
                 'B2P06 preprocessing evidence, and B2P07 execution-environment evidence while verifying '
                 '`primary_decoding_started=false`. B2P08 must not execute candidate or primary decoding. Preserve '
                 '`HUMAN_DEVELOPER_SPEECH_ACCURACY_EVIDENCE=ABSENT`, `production_stt_selected=false`, and '
                 '`product_code_authorized=false`. Candidate and primary decoding remain unauthorized until B2P08 '
                 'is canonically qualified, post-merge verified, and reconciled.')
          new = ('Execute and canonically qualify `B2E01` only: decode the exact frozen P0 public-human subset with '
                 'candidate cell 1 (`moonshine-compact`) under frozen C0, preserving raw transcript/failure/run '
                 'evidence and keeping repository/test-specific context, candidate-specific audio transforms, and '
                 'comparative timing claims disabled. B2E02 and all later candidate cells remain unauthorized until '
                 'B2E01 is canonically qualified, post-merge verified, and reconciled.')
          if current.count(old) != 1:
              raise SystemExit(f'CURRENT exact next-action anchor count={current.count(old)}')
          current_path.write_text(current.replace(old, new, 1), encoding='utf-8')
          print('B2P08_RECONCILIATION_V3=APPLIED')
          PY
      - name: Verify reconciliation surfaces
        run: |
          set -euo pipefail
          python -m py_compile \
            research/000b2-public/capture_environment.py \
            research/000b2-public/verify_candidate_revalidation.py \
            research/000b2-public/verify_environment_capture.py \
            research/000b2-public/verify_preprocessing_capture.py \
            research/000b2-public/verify_subset_freeze.py \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_attempt_manifest.py
          python research/000b2-public/verify_environment_capture.py
          python research/000b2-public/verify_preprocessing_capture.py
          python research/000b2-public/verify_subset_freeze.py
          git diff --check dd65e23d29e7f83b9a94aba9c018928c7f9cc41d --
      - name: Commit verified canonical reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/canonical/CURRENT_STATE.md \
            specs/CURRENT.md \
            specs/000B2-public-corpus-bakeoff/tasks.md \
            research/000b2-public/readiness.json \
            research/000b2-public/capture_environment.py \
            research/000b2-public/verify_candidate_revalidation.py \
            research/000b2-public/verify_environment_capture.py \
            research/000b2-public/verify_preprocessing_capture.py \
            research/000b2-public/verify_subset_freeze.py \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_methodology.py
          git diff --cached --check
          git commit -m 'docs(000b2): reconcile frontier after B2P08'
          git push origin HEAD:research/000b2-b2p08-reconciliation
