name: Internal B2P08 Reconciliation V3

on:
  push:
    branches:
      - research/000b2-b2p08-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/000b2-b2p08-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified B2P08 reconciliation candidate
        run: python .github/internal-b2p08-reconciliation-v3.py
      - name: Repair generated verifier ordering
        run: |
          set -euo pipefail
          grep -F 'attempt.get("frozen") is (completed_through == "B2P08")' research/000b2-public/verify_subset_freeze.py
          sed -i 's/attempt.get("frozen") is (completed_through == "B2P08")/attempt.get("frozen") is (readiness.get("completed_through") == "B2P08")/' research/000b2-public/verify_subset_freeze.py
          grep -F 'attempt.get("frozen") is (readiness.get("completed_through") == "B2P08")' research/000b2-public/verify_subset_freeze.py
      - name: Verify reconciliation surfaces
        run: |
          set -euo pipefail
          python -m py_compile \
            research/000b2-public/capture_environment.py \
            research/000b2-public/verify_candidate_revalidation.py \
            research/000b2-public/verify_environment_capture.py \
            research/000b2-public/verify_preprocessing_capture.py \
            research/000b2-public/verify_subset_freeze.py \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_methodology.py
          python research/000b2-public/verify_attempt_manifest.py
          python research/000b2-public/verify_environment_capture.py
          python research/000b2-public/verify_preprocessing_capture.py --static-only
          python research/000b2-public/verify_subset_freeze.py
          git diff --check dd65e23d29e7f83b9a94aba9c018928c7f9cc41d --
      - name: Commit verified canonical reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/canonical/CURRENT_STATE.md \
            specs/CURRENT.md \
            specs/000B2-public-corpus-bakeoff/tasks.md \
            research/000b2-public/readiness.json \
            research/000b2-public/capture_environment.py \
            research/000b2-public/verify_candidate_revalidation.py \
            research/000b2-public/verify_environment_capture.py \
            research/000b2-public/verify_preprocessing_capture.py \
            research/000b2-public/verify_subset_freeze.py \
            research/000b2-public/verify_attempt_manifest.py \
            research/000b2-public/verify_methodology.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'B2P08_RECONCILIATION_COMMIT=NO_CHANGES'
            exit 0
          fi
          git commit -m 'docs(000b2): reconcile frontier after B2P08'
          git push origin HEAD:research/000b2-b2p08-reconciliation
