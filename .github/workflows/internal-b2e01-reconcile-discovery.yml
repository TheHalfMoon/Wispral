name: Internal B2E01 Reconciliation Discovery

on:
  push:
    branches:
      - docs/000b2-reconcile-after-b2e01
    paths:
      - '.github/workflows/internal-b2e01-reconcile-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/000b2-reconcile-after-b2e01
          fetch-depth: 0

      - name: Discover frontier-coupled files
        shell: bash
        run: |
          set -euo pipefail
          echo 'DISCOVERY_HEAD='$(git rev-parse HEAD)
          echo '== frontier-coupled Python files =='
          git grep -l -E 'completed_through|current bounded execution unit|Execute B2E01 only|B2E01 is the sole|B2P08' -- 'research/000b2-public/*.py' | sort
          echo '== relevant lines =='
          git grep -n -E 'completed_through|current bounded execution unit|Execute B2E01 only|B2E01 is the sole|B2E02|B2P08' -- 'research/000b2-public/*.py' || true

      - name: Remove discovery workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/internal-b2e01-reconcile-discovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/internal-b2e01-reconcile-discovery.yml
          git commit -m 'chore(000b2): remove reconciliation discovery workflow'
          git push origin HEAD:docs/000b2-reconcile-after-b2e01
