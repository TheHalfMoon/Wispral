name: Temporary B2R13 Reconciliation Builder

on:
  push:
    branches:
      - recovery/b2r13-reconcile-to-b2r14
    paths:
      - '.github/workflows/tmp-b2r13-reconcile-builder.yml'

permissions:
  contents: write

jobs:
  build-clean-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: recovery/b2r13-reconcile-to-b2r14
          fetch-depth: 0

      - name: Build exact four-file reconciliation candidate
        shell: bash
        env:
          EXPECTED_MAIN: 60108c02df8397eda854d31c51eb37ee2e3fbe45
          TASK_BASE: dc70fac9eddb6cda2dc4cabc4aec2df5f0beb9ff
          QUALIFIED_HEAD: 43f9d5bcb4465bd6467a7a5880f274fe4600134e
          TASK_MERGE: 60108c02df8397eda854d31c51eb37ee2e3fbe45
          RECOVERY_RUN: '34231594716'
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          task_base = os.environ["TASK_BASE"]
          qualified_head = os.environ["QUALIFIED_HEAD"]
          task_merge = os.environ["TASK_MERGE"]
          recovery_run = int(os.environ["RECOVERY_RUN"])

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          readiness_path = Path("research/000b2-public/recovery-attempt-003-readiness.json")
          readiness = readiness_path.read_text(encoding="utf-8")
          readiness = replace_once(
              readiness,
              '  "completed_recovery_tasks": [],\n  "active_recovery_unit": "B2R13",\n  "transition_proofs": [],',
              '  "completed_recovery_tasks": ["B2R13"],\n  "active_recovery_unit": "B2R14",\n  "transition_proofs": [\n    {\n      "completed_task": "B2R13",\n      "canonical_task_base": "' + task_base + '",\n      "qualified_task_head": "' + qualified_head + '",\n      "canonical_task_merge": "' + task_merge + '",\n      "post_merge_recovery_run_id": ' + str(recovery_run) + ',\n      "successor_task": "B2R14"\n    }\n  ],',
              "readiness frontier",
          )
          readiness = replace_once(
              readiness,
              '  "next_action": "Qualify B2R13 only: prove and canonically bind ATTEMPT-002 material invalidation against the exact pinned sherpa-onnx source while preserving historical ATTEMPT-002 bytes. Install the one-time successor trusted-base PR gate; after B2R13 becomes canonical, every B2R14+ task or reconciliation PR must be qualified by the canonical-base pull_request_target gate before merge. Do not begin B2R14 or any primary decode; B2R10 through B2R12 under ATTEMPT-002, comparative scoring, ranking, synthesis, production STT selection, and product code remain closed.",',
              '  "next_action": "Qualify B2R14 only: implement and verify the corrected sherpa-onnx result-extraction harness against the frozen deterministic synthetic non-primary fixture and exact pinned upstream source. Preserve plain-string results exactly, fail closed on object/string API confusion, do not access primary corpus material, and keep all ATTEMPT-003 primary decoding closed until B2R16 is canonically reconciled.",',
              "readiness next action",
          )
          doc = json.loads(readiness)
          expected_proof = {
              "completed_task": "B2R13",
              "canonical_task_base": task_base,
              "qualified_task_head": qualified_head,
              "canonical_task_merge": task_merge,
              "post_merge_recovery_run_id": recovery_run,
              "successor_task": "B2R14",
          }
          assert doc["completed_recovery_tasks"] == ["B2R13"]
          assert doc["active_recovery_unit"] == "B2R14"
          assert doc["replacement_attempt"]["frozen"] is False
          assert doc["replacement_attempt"]["primary_decode_entry_open"] is False
          assert doc["transition_proofs"] == [expected_proof]
          readiness_path.write_text(readiness, encoding="utf-8")

          tasks_path = Path("specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md")
          tasks = tasks_path.read_text(encoding="utf-8")
          tasks = replace_once(
              tasks,
              '- [ ] `B2R13` — Qualify and canonically bind ATTEMPT-002 material invalidation against exact canonical B2R09 bytes and the pinned sherpa-onnx upstream API. Preserve all historical attempt bytes. No primary decode.',
              '- [x] `B2R13` — Qualify and canonically bind ATTEMPT-002 material invalidation against exact canonical B2R09 bytes and the pinned sherpa-onnx upstream API. Preserve all historical attempt bytes. No primary decode.',
              "B2R13 task checkbox",
          )
          tasks_path.write_text(tasks, encoding="utf-8")

          current_path = Path("specs/CURRENT.md")
          current = current_path.read_text(encoding="utf-8")
          current = replace_once(
              current,
              '**Status:** founding research active; ACP verified; B1 historical preregistration verified; public-corpus B2 methodology canonical; qualification-chronology gate `SATISFIED`; public-corpus B2 recovery active; B2R01 through B2R09 canonical and post-merge verified; active recovery unit `B2R10`; ATTEMPT-001 B2E03 and all later primary decoding closed',
              '**Status:** founding research active; ACP verified; B1 historical preregistration verified; public-corpus B2 methodology canonical; qualification-chronology gate `SATISFIED`; public-corpus B2 ATTEMPT-003 recovery active; B2R13 canonical and post-merge verified; active successor recovery unit `B2R14`; ATTEMPT-002 invalidated; ATTEMPT-003 primary decoding closed',
              "CURRENT status",
          )
          old_lines = [
              '**ATTEMPT-002 status:** `INVALIDATED_MATERIAL_EXECUTION_DRIFT`',
              '**Successor recovery authority:** `specs/000B2-public-corpus-bakeoff/recovery-v2.md`',
              '**Successor machine authority:** `research/000b2-public/recovery-attempt-003-readiness.json`',
              '**Active successor recovery unit:** `B2R13`',
              '**ATTEMPT-003 required:** `true`',
              '**ATTEMPT-003 frozen:** `false`',
              '**ATTEMPT-003 primary decode entry open:** `false`',
              '',
              'B2R13 is an invalidation/authority-recovery unit only. It MUST NOT perform a primary decode, score ATTEMPT-002, rewrite canonical B2R05-B2R09 execution bytes, promote closed PR #89/#90 evidence, or mark B2R10-B2R12 complete. `research/000b2-public/recovery-readiness.json` and the B2R10 marker above remain immutable historical ATTEMPT-002 snapshots and do not authorize new execution after this successor authority is canonical.',
              '',
              'The sole next bounded action is to qualify B2R13: prove ATTEMPT-002 material invalidation against exact canonical B2R09 bytes and the exact pinned sherpa-onnx upstream API, preserve all historical ATTEMPT-002 evidence, keep ATTEMPT-003 unfrozen, and keep every primary decode closed. B2R14 and every later ATTEMPT-003 unit remain unauthorized until B2R13 is independently qualified, merged, post-merge verified, and reconciled.',
          ]
          new_lines = [
              '**ATTEMPT-002 status:** `INVALIDATED_MATERIAL_EXECUTION_DRIFT`',
              '**Successor recovery authority:** `specs/000B2-public-corpus-bakeoff/recovery-v2.md`',
              '**Successor machine authority:** `research/000b2-public/recovery-attempt-003-readiness.json`',
              '**Canonical successor recovery predecessor:** `B2R13`',
              f'**Canonical B2R13 task base:** `{task_base}`',
              f'**Canonical B2R13 qualified head:** `{qualified_head}`',
              f'**Canonical B2R13 recovery merge:** `{task_merge}`',
              f'**Canonical B2R13 post-merge recovery run:** `{recovery_run}`',
              '**Active successor recovery unit:** `B2R14`',
              '**ATTEMPT-003 required:** `true`',
              '**ATTEMPT-003 frozen:** `false`',
              '**ATTEMPT-003 primary decode entry open:** `false`',
              '',
              'B2R13 is canonical and post-merge verified. Its transition proof binds the exact canonical task base, exact independently reviewed qualified head, real two-parent normal merge, and successful `main` push run of `000B2 Public Corpus ATTEMPT-003 Recovery`. Historical ATTEMPT-002 bytes and the superseded B2R10-B2R12 frontier remain immutable and non-authoritative for new execution.',
              '',
              'The sole next bounded action is to qualify B2R14: implement and verify the corrected sherpa-onnx result-extraction harness against the frozen deterministic synthetic non-primary fixture and exact pinned upstream source. Preserve the plain Python string result exactly and fail closed on object/string API confusion. Do not access primary corpus material or ATTEMPT-003 primary evidence. B2R15 and every later ATTEMPT-003 unit remain unauthorized until B2R14 is independently qualified, merged, post-merge verified, and reconciled.',
          ]
          current = replace_once(current, "\n".join(old_lines), "\n".join(new_lines), "CURRENT successor block")
          current_path.write_text(current, encoding="utf-8")

          state_path = Path("docs/canonical/CURRENT_STATE.md")
          state = state_path.read_text(encoding="utf-8")
          old_tail = 'B2R09 is canonical and post-merge verified at task merge `fc357350270d5cb34fc1305dba4a9de41a5234c3` with recovery run `34160146607`; ATTEMPT-002 is frozen; active recovery unit is `B2R10`; only B2R10 primary decode is open; ATTEMPT-001 B2E03 and all later primary decoding are closed'
          new_tail = f'B2R09 remains canonical historical ATTEMPT-002 evidence at task merge `fc357350270d5cb34fc1305dba4a9de41a5234c3` with recovery run `34160146607`; ATTEMPT-002 is invalidated for material execution drift; B2R13 is canonical at merge `{task_merge}` from exact qualified head `{qualified_head}` and post-merge ATTEMPT-003 Recovery run `{recovery_run}` succeeded; active successor recovery unit is `B2R14`; ATTEMPT-003 remains unfrozen and primary decoding is closed'
          state = replace_once(state, old_tail, new_tail, "CURRENT_STATE chronology tail")
          anchor = "\n## Current product thesis\n"
          if state.count(anchor) != 1:
              raise SystemExit(f"CURRENT_STATE product-thesis anchor count={state.count(anchor)}")
          section_lines = [
              '',
              '## Canonical ATTEMPT-003 B2R13 recovery reconciliation',
              '',
              f'B2R13 is canonically complete after PR #92 merged the exact independently reviewed activation range as real normal merge `{task_merge}` with first parent `{task_base}` and exact qualified head `{qualified_head}` as second parent. Exact `main` push run `{recovery_run}` of `000B2 Public Corpus ATTEMPT-003 Recovery` (`workflow_id=352653404`, path `.github/workflows/000b2-public-attempt-003-recovery.yml`) completed successfully on that exact merge SHA. This reconciliation advances exactly one successor task and does not execute B2R14.',
              '',
              '**ATTEMPT-002 status:** `INVALIDATED_MATERIAL_EXECUTION_DRIFT`',
              '**Successor recovery authority:** `specs/000B2-public-corpus-bakeoff/recovery-v2.md`',
              '**Successor machine authority:** `research/000b2-public/recovery-attempt-003-readiness.json`',
              '**Canonical successor recovery predecessor:** `B2R13`',
              f'**Canonical B2R13 task base:** `{task_base}`',
              f'**Canonical B2R13 qualified head:** `{qualified_head}`',
              f'**Canonical B2R13 recovery merge:** `{task_merge}`',
              f'**Canonical B2R13 post-merge recovery run:** `{recovery_run}`',
              '**Active successor recovery unit:** `B2R14`',
              '**ATTEMPT-003 required:** `true`',
              '**ATTEMPT-003 frozen:** `false`',
              '**ATTEMPT-003 primary decode entry open:** `false`',
              '',
              'B2R14 alone is the next bounded unit: qualify the corrected sherpa-onnx result-extraction harness against the canonical deterministic synthetic non-primary fixture and exact pinned upstream source. Primary corpus access, ATTEMPT-003 primary evidence access, scoring, ranking, synthesis, production STT selection, and product-code authority remain closed. B2R15 and every later successor unit require their own exact-head qualification, independent review, guarded normal merge, post-merge recovery proof, and separate reconciliation.',
          ]
          state = state.replace(anchor, "\n".join(section_lines) + anchor, 1)
          state_path.write_text(state, encoding="utf-8")
          PY

          export AUTHORITY_BASE_REVISION="$EXPECTED_MAIN"
          PYTHONDONTWRITEBYTECODE=1 python research/000b2-public/verify_attempt_002_invalidation.py --static-only

          git rm .github/workflows/tmp-b2r13-reconcile-builder.yml
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN" -- | sort)
          mapfile -t expected < <(printf '%s\n' \
            docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-attempt-003-readiness.json \
            specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md \
            specs/CURRENT.md | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          git config user.name "wispral-reconciliation-builder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/canonical/CURRENT_STATE.md \
            research/000b2-public/recovery-attempt-003-readiness.json \
            specs/000B2-public-corpus-bakeoff/recovery-v2-tasks.md \
            specs/CURRENT.md
          git commit -m "docs(b2): reconcile B2R13 and authorize B2R14"
          git push origin HEAD:refs/heads/recovery/b2r13-reconcile-to-b2r14
