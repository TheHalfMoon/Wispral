name: Temporary 000B2 review-2 editor

on:
  push:
    branches:
      - docs/000b2-reconcile-after-b2e02

permissions:
  contents: write

jobs:
  apply-exact-review-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out bounded branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/000b2-reconcile-after-b2e02
          fetch-depth: 0

      - name: Apply exact anchored authority hardening and regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c4ca93a8e9f8964c0b19c58953fd14549bbb59f5"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one anchored match in {path}, got {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "research/000b2-public/verify_preprocessing_capture.py",
              '''        else:\n            require("- [x] `B2E02`" in tasks, "B2E02 reconciliation must mark B2E02 complete")\n            require("- [ ] `B2E03`" in tasks, "B2E03 must remain pending before execution")\n            require("Execute B2E03 only" in str(readiness.get("next_action")), "B2E02 reconciliation must advance to B2E03")\n            require("Execute and canonically qualify `B2E03` only" in current, "CURRENT must authorize B2E03 only")\n''',
              '''        else:\n            require("- [x] `B2E01`" in tasks, "B2E01 predecessor must remain complete before B2E03 authorization")\n            require("- [x] `B2E02`" in tasks, "B2E02 reconciliation must mark B2E02 complete")\n            require("- [ ] `B2E03`" in tasks, "B2E03 must remain pending before execution")\n            require("- [ ] `B2E04`" in tasks, "B2E04 must remain unauthorized before B2E03 execution")\n            next_action = str(readiness.get("next_action"))\n            require("Execute B2E03 only" in next_action, "B2E02 reconciliation must advance to B2E03")\n            require(\n                "Do not begin B2E04 or any later candidate cell until B2E03 is canonical." in next_action,\n                "B2E03 readiness successor boundary drift",\n            )\n            require("Execute and canonically qualify `B2E03` only" in current, "CURRENT must authorize B2E03 only")\n            require(\n                "B2E04 and all later candidate cells remain unauthorized" in current,\n                "B2E03 CURRENT successor boundary drift",\n            )\n''',
          )

          replace_once(
              "research/000b2-public/verify_subset_freeze.py",
              '''        require("Do not begin B2E04 or any later candidate cell until B2E03 is canonical." in next_action, "B2E03 successor boundary drift")\n        require("- [x] `B2E02`" in tasks, "B2E02 reconciliation must mark B2E02 complete")\n        require("- [ ] `B2E03`" in tasks, "B2E03 must remain pending before execution")\n''',
              '''        require("Do not begin B2E04 or any later candidate cell until B2E03 is canonical." in next_action, "B2E03 successor boundary drift")\n        require("- [x] `B2E01`" in tasks, "B2E01 predecessor must remain complete before B2E03 authorization")\n        require("- [x] `B2E02`" in tasks, "B2E02 reconciliation must mark B2E02 complete")\n        require("- [ ] `B2E03`" in tasks, "B2E03 must remain pending before execution")\n        require("- [ ] `B2E04`" in tasks, "B2E04 must remain unauthorized before B2E03 execution")\n''',
          )

          regression_step = '''      - name: Verify B2E02 predecessor and B2E03 successor guards fail closed\n        shell: bash\n        run: |\n          set -euo pipefail\n          tasks=specs/000B2-public-corpus-bakeoff/tasks.md\n          readiness=research/000b2-public/readiness.json\n          current=specs/CURRENT.md\n          cp "$tasks" "$RUNNER_TEMP/tasks.md.original"\n          cp "$readiness" "$RUNNER_TEMP/readiness.json.original"\n          cp "$current" "$RUNNER_TEMP/CURRENT.md.original"\n          restore() {\n            cp "$RUNNER_TEMP/tasks.md.original" "$tasks"\n            cp "$RUNNER_TEMP/readiness.json.original" "$readiness"\n            cp "$RUNNER_TEMP/CURRENT.md.original" "$current"\n          }\n          trap restore EXIT\n\n          python - <<'PY'\n          from pathlib import Path\n          path = Path("specs/000B2-public-corpus-bakeoff/tasks.md")\n          text = path.read_text(encoding="utf-8")\n          old = "- [x] `B2E01`"\n          assert text.count(old) == 1\n          path.write_text(text.replace(old, "- [ ] `B2E01`", 1), encoding="utf-8")\n          PY\n          for command in \
            "python research/000b2-public/verify_preprocessing_capture.py --static-only" \
            "python research/000b2-public/verify_subset_freeze.py"; do\n            set +e\n            output=$(eval "$command" 2>&1)\n            status=$?\n            set -e\n            printf '%s\\n' "$output"\n            test "$status" -ne 0\n            grep -F 'B2E01 predecessor must remain complete before B2E03 authorization' <<<"$output"\n          done\n          restore\n\n          python - <<'PY'\n          import json\n          from pathlib import Path\n          path = Path("research/000b2-public/readiness.json")\n          value = json.loads(path.read_text(encoding="utf-8"))\n          suffix = " Do not begin B2E04 or any later candidate cell until B2E03 is canonical."\n          assert value["next_action"].endswith(suffix)\n          value["next_action"] = value["next_action"][:-len(suffix)]\n          path.write_text(json.dumps(value, indent=2) + "\\n", encoding="utf-8")\n          PY\n          set +e\n          output=$(python research/000b2-public/verify_preprocessing_capture.py --static-only 2>&1)\n          status=$?\n          set -e\n          printf '%s\\n' "$output"\n          test "$status" -ne 0\n          grep -F 'B2E03 readiness successor boundary drift' <<<"$output"\n          restore\n\n          python - <<'PY'\n          from pathlib import Path\n          path = Path("specs/CURRENT.md")\n          text = path.read_text(encoding="utf-8")\n          old = "B2E04 and all later candidate cells remain unauthorized"\n          assert text.count(old) >= 1\n          path.write_text(text.replace(old, "B2E04 successor closure intentionally removed by mutation test", 1), encoding="utf-8")\n          PY\n          set +e\n          output=$(python research/000b2-public/verify_preprocessing_capture.py --static-only 2>&1)\n          status=$?\n          set -e\n          printf '%s\\n' "$output"\n          test "$status" -ne 0\n          grep -F 'B2E03 CURRENT successor boundary drift' <<<"$output"\n          restore\n          git diff --quiet -- "$tasks" "$readiness" "$current"\n\n'''
          replace_once(
              ".github/workflows/000b2-public-preprocessing.yml",
              "      - name: Fetch exact FFmpeg release inside immutable container\n",
              regression_step + "      - name: Fetch exact FFmpeg release inside immutable container\n",
          )
          PY
          python research/000b2-public/verify_preprocessing_capture.py --static-only
          python research/000b2-public/verify_subset_freeze.py
          git diff --check

      - name: Remove temporary editor and commit only durable fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-000b2-review2-fix.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/000b2-public/verify_preprocessing_capture.py \
            research/000b2-public/verify_subset_freeze.py \
            .github/workflows/000b2-public-preprocessing.yml
          git commit -m "fix(000b2): enforce B2E03 authority boundaries"
          git push origin HEAD:docs/000b2-reconcile-after-b2e02
