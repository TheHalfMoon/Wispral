<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omalla</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%235eead4' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%235eead4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-mark" aria-hidden="true"></div>
      <p>Connecting to the local runtime…</p>
    </div>

    <div id="login" class="login" hidden>
      <form id="login-form" class="card login-card">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Omalla</div>
        <h1>Local console</h1>
        <p class="muted">
          Paste the API key printed by <code>omalla start</code>. It is stored only in this browser.
        </p>
        <label class="field">
          <span>API key</span>
          <input id="login-key" type="password" autocomplete="off" spellcheck="false" placeholder="omk_…" required />
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button class="primary" type="submit">Open console</button>
        <p class="hint">The key is in <code>&lt;data-dir&gt;/api-key.txt</code>.</p>
      </form>
    </div>

    <div id="shell" class="shell" hidden>
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Omalla</div>
        <nav id="nav" class="nav" aria-label="Main">
          <button data-view="overview" class="nav-item active">Overview</button>
          <button data-view="calls" class="nav-item">Calls</button>
          <button data-view="workflows" class="nav-item">Workflows</button>
          <button data-view="automations" class="nav-item">Automations</button>
          <button data-view="telephony" class="nav-item">Telephony</button>
          <button data-view="settings" class="nav-item">Settings</button>
        </nav>
        <div class="sidebar-foot">
          <span class="dot" aria-hidden="true"></span>
          <div>
            <strong id="tenant-name">…</strong>
            <span class="muted small">Simulated telephony · local models</span>
          </div>
        </div>
      </aside>

      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
