<!doctype html>
<html lang="en" dir="auto" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omalla Studio</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23D8B4FE' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%237E22CE'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-mark" aria-hidden="true"></div>
      <p dir="auto">Connecting to Omalla runtime…</p>
    </div>

    <div id="login" class="login" hidden>
      <form id="login-form" class="card login-card">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Omalla Studio</div>
        <h1 dir="auto">Local Voice &amp; Automation Studio</h1>
        <p class="muted" dir="auto">
          Paste the API key printed by <code>omalla start</code>. Stored locally in this browser.
        </p>
        <label class="field">
          <span dir="auto">API key</span>
          <input id="login-key" type="password" autocomplete="off" spellcheck="false" placeholder="omk_…" required />
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button class="primary" type="submit">Open Omalla Studio</button>
        <p class="hint">Key file: <code>&lt;data-dir&gt;/api-key.txt</code>.</p>
      </form>
    </div>

    <div id="shell" class="shell" hidden>
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Omalla</div>
        <div class="sidebar-controls">
          <button id="lang-toggle" type="button" class="ghost" title="Toggle English / العربية (RTL/LTR)">العربية / EN</button>
          <button id="theme-toggle" type="button" class="ghost" title="Toggle Quiet Signal Light / Dark">Theme</button>
        </div>
        <nav id="nav" class="nav" aria-label="Main">
          <button data-view="overview" data-i18n="nav.overview" class="nav-item active">Overview</button>
          <button data-view="studio" data-i18n="nav.studio" class="nav-item">Voice Studio</button>
          <button data-view="agents" data-i18n="nav.agents" class="nav-item">Agents &amp; Versions</button>
          <button data-view="calls" data-i18n="nav.calls" class="nav-item">Calls</button>
          <button data-view="workflows" data-i18n="nav.workflows" class="nav-item">Workflows</button>
          <button data-view="automations" data-i18n="nav.automations" class="nav-item">Automations</button>
          <button data-view="telephony" data-i18n="nav.telephony" class="nav-item">Telephony &amp; SIP</button>
          <button data-view="settings" data-i18n="nav.settings" class="nav-item">Settings</button>
        </nav>
        <div class="sidebar-foot">
          <span class="dot" aria-hidden="true"></span>
          <div>
            <strong id="tenant-name" dir="auto">…</strong>
            <span class="muted small" dir="auto">Wispral · Local-first voice &amp; SIP</span>
          </div>
        </div>
      </aside>

      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
